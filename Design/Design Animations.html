const { lane, grid, tree, recorder, mount, ln } = BrainAnim;
const mapLane = (name, m, hl) => { const ks = [...m.keys()]; return lane(name, ks.map(k => `${k}: ${fmt(m.get(k))}`), { active: hl === undefined ? [] : [ks.indexOf(hl)] }); };
const fmt = v => Array.isArray(v) ? `[${v.join(',')}]` : v instanceof Set ? `{${[...v].join(',')}}` : String(v);

// ===== LRU =====
const C_LRU = `
public int get(int key) {
    Node n = map.get(key);
    if (n == null) return -1;
    remove(n);
    addFront(n);
    return n.val;
}

public void put(int key, int value) {
    Node n = map.get(key);
    if (n != null) { n.val = value; remove(n); addFront(n); return; }
    if (map.size() == capacity) { Node lru = tail.prev; remove(lru); map.remove(lru.key); }
    n = new Node(key, value);
    addFront(n);
    map.put(key, n);
}`;
function lru() {
  const r = recorder(), cap = 2; let list = [];
  const L = (o = {}) => [lane('DLL: head → … → tail (left = most recent)', list.map(([k, v]) => `${k}=${v}`), o), lane('HashMap keys', list.map(([k]) => k))];
  const ops = [['put', 1, 1], ['put', 2, 2], ['get', 1], ['put', 3, 3], ['get', 2], ['put', 4, 4], ['get', 1], ['get', 3], ['get', 4]];
  r.step(0, `Capacity 2. The HashMap finds a node in O(1); the <b>doubly linked list</b> keeps recency order, so moving a node to the front or dropping the tail is also O(1).`, L());
  for (const [op, k, v] of ops) {
    const i = list.findIndex(x => x[0] === k);
    if (op === 'get') {
      if (i < 0) { r.step(ln(C_LRU, 'return -1'), `get(${k}) → miss → <b>-1</b>.`, L()); continue; }
      const [n] = list.splice(i, 1); list.unshift(n);
      r.step(ln(C_LRU, 'addFront(n);'), `get(${k}) → hit <b>${n[1]}</b>. Move it to the front (most recent).`, L({ active: [0] }));
    } else {
      if (i >= 0) { list.splice(i, 1); list.unshift([k, v]); r.step(ln(C_LRU, 'n.val = value'), `put(${k}) updates and moves to front.`, L({ active: [0] })); continue; }
      if (list.length === cap) { const ev = list.pop(); r.step(ln(C_LRU, 'Node lru = tail.prev'), `Full → evict the tail (least recent) <b>${ev[0]}</b>.`, L({ bad: [] })); }
      list.unshift([k, v]);
      r.step(ln(C_LRU, 'addFront(n);', 2), `put(${k}, ${v}) → new node at the front.`, L({ active: [0] }));
    }
  }
  return r.steps;
}

// ===== LFU =====
const C_LFU = `
private void touch(int key) {
    int[] d = data.get(key);
    LinkedHashSet<Integer> b = buckets.get(d[1]);
    b.remove(key);
    if (b.isEmpty() && d[1] == minFreq) minFreq++;
    d[1]++;
    buckets.computeIfAbsent(d[1], f -> new LinkedHashSet<>()).add(key);
}

public void put(int key, int value) {
    if (data.containsKey(key)) { data.get(key)[0] = value; touch(key); return; }
    if (data.size() == capacity) {
        Iterator<Integer> it = buckets.get(minFreq).iterator();
        data.remove(it.next());
        it.remove();
    }
    data.put(key, new int[]{value, 1});
    buckets.computeIfAbsent(1, f -> new LinkedHashSet<>()).add(key);
    minFreq = 1;
}`;
function lfu() {
  const r = recorder(), cap = 2, data = new Map(), buckets = new Map(); let minF = 0;
  const L = () => [lane('freq buckets (each = keys oldest → newest)', [...buckets.keys()].sort().filter(f => buckets.get(f).length).map(f => `f${f}: [${buckets.get(f)}]`)), lane('minFreq', [minF])];
  const touch = k => { const d = data.get(k), b = buckets.get(d[1]); b.splice(b.indexOf(k), 1); if (!b.length && d[1] === minF) minF++; d[1]++; if (!buckets.has(d[1])) buckets.set(d[1], []); buckets.get(d[1]).push(k); };
  r.step(0, `Evict the key with the <b>lowest frequency</b>; ties → the least recently used. Bucket per frequency, each bucket in recency order.`, L());
  for (const [op, k, v] of [['put', 1, 1], ['put', 2, 2], ['get', 1], ['put', 3, 3], ['get', 2], ['get', 3], ['put', 4, 4]]) {
    if (op === 'get') { if (!data.has(k)) { r.step(0, `get(${k}) → -1.`, L()); continue; } touch(k); r.step(ln(C_LFU, 'd[1]++'), `get(${k}) → ${data.get(k)[0]}; move ${k} up to bucket f${data.get(k)[1]}.`, L()); continue; }
    if (data.size === cap) { const b = buckets.get(minF), ev = b.shift(); data.delete(ev); r.step(ln(C_LFU, 'data.remove(it.next())'), `Full → evict the oldest key in bucket f${minF}: <b>${ev}</b>.`, L()); }
    data.set(k, [v, 1]); if (!buckets.has(1)) buckets.set(1, []); buckets.get(1).push(k); minF = 1;
    r.step(ln(C_LFU, 'minFreq = 1;'), `put(${k}) → bucket f1, minFreq = 1.`, L());
  }
  return r.steps;
}

// ===== AllOne =====
const C_ALL = `
public void inc(String key) {
    Bucket cur = where.getOrDefault(key, head);
    Bucket nx = cur.next.count == cur.count + 1 ? cur.next : addAfter(cur, cur.count + 1);
    nx.keys.add(key);
    where.put(key, nx);
    if (cur != head) { cur.keys.remove(key); removeIfEmpty(cur); }
}
// dec is the mirror image; getMax = tail.prev, getMin = head.next`;
function allOne() {
  const r = recorder(), m = new Map();
  const L = () => { const counts = [...new Set(m.values())].sort((a, b) => a - b); return [lane('buckets head → tail (count: keys)', counts.map(c => `${c}: {${[...m].filter(([, v]) => v === c).map(([k]) => k)}}`)), lane('min / max key', counts.length ? [`min ${[...m].find(([, v]) => v === counts[0])[0]}`, `max ${[...m].find(([, v]) => v === counts.at(-1))[0]}`] : [])]; };
  r.step(0, `Buckets sorted by count in a DLL. A key only moves to a <b>neighbouring</b> bucket (count ±1), so every op is O(1).`, L());
  for (const [op, k] of [['inc', 'a'], ['inc', 'b'], ['inc', 'a'], ['inc', 'c'], ['inc', 'a'], ['dec', 'a'], ['dec', 'b']]) {
    if (op === 'inc') m.set(k, (m.get(k) || 0) + 1); else { if (m.get(k) === 1) m.delete(k); else m.set(k, m.get(k) - 1); }
    r.step(ln(C_ALL, op === 'inc' ? 'nx.keys.add' : 'dec is'), `${op}("${k}") → ${m.has(k) ? `moves to bucket ${m.get(k)}` : 'removed'}.`, L());
  }
  return r.steps;
}

// ===== Generic small sims =====
function seqSim(intro, ops) { const r = recorder(); r.step(0, intro.say, intro.lanes()); for (const o of ops) { o.do(); r.step(o.line, o.say(), o.lanes()); } return r.steps; }

const C_WD = `
private boolean dfs(Node node, String w, int i) {
    if (node == null) return false;
    if (i == w.length()) return node.end;
    char c = w.charAt(i);
    if (c != '.') return dfs(node.next[c - 'a'], w, i + 1);
    for (Node child : node.next) if (dfs(child, w, i + 1)) return true;
    return false;
}`;
function wordDict() {
  const r = recorder(), words = ['bad', 'dad', 'mad'];
  const P = { '^': -1 }, L = { '^': '•' }; for (const w of words) { let p = '^'; for (const c of w) { const id = p + c; if (!(id in P)) { P[id] = p; L[id] = c; } p = id; } }
  const T = (cls) => tree('Trie of bad, dad, mad', P, { labels: L, cls });
  r.step(0, `addWord: normal trie insert. search with '.': a '.' must try <b>every child</b> (DFS branch).`, [T({})]);
  r.step(ln(C_WD, "if (c != '.')"), `search("bad"): plain walk b→a→d → <b>true</b>.`, [T({ '^b': 'done', '^ba': 'done', '^bad': 'done' })]);
  r.step(ln(C_WD, 'for (Node child'), `search(".ad"): '.' branches into b, d, m; the first branch b→a→d succeeds → <b>true</b>.`, [T({ '^b': 'warn', '^d': 'warn', '^m': 'warn', '^ba': 'done', '^bad': 'done' })]);
  r.step(ln(C_WD, 'return false;', 2), `search("b.."): b, then any, any → "bad" ✓. search("pad"): no 'p' child → false.`, [T({ '^b': 'done', '^ba': 'active', '^bad': 'done' })]);
  return r.steps;
}

const C_FOOD = `
public void changeRating(String food, int newRating) {
    TreeSet<String> set = byCuisine.get(cuisineOf.get(food));
    set.remove(food);             // remove with OLD rating (comparator must still find it)
    rating.put(food, newRating);
    set.add(food);                // re-insert with NEW rating
}

public String highestRated(String cuisine) { return byCuisine.get(cuisine).first(); }`;
function food() {
  const rating = new Map([['kimchi', 9], ['bulgogi', 7], ['ramen', 14], ['sushi', 12]]);
  const korean = () => ['kimchi', 'bulgogi'].sort((a, b) => rating.get(b) - rating.get(a) || a.localeCompare(b)).map(f => `${f} (${rating.get(f)})`);
  const V = () => [lane('korean TreeSet (rating desc, name asc)', korean(), { done: [0] })];
  return seqSim({ say: `One TreeSet per cuisine sorted by (rating ↓, name ↑). <b>first()</b> is the answer.`, lanes: V }, [
    { line: ln(C_FOOD, 'byCuisine.get(cuisine).first()'), do() {}, say: () => `highestRated("korean") → <b>kimchi</b>.`, lanes: V },
    { line: ln(C_FOOD, 'set.remove(food)'), do() { rating.set('bulgogi', 16); }, say: () => `changeRating("bulgogi", 16): remove it <b>before</b> changing the rating (the TreeSet locates it by the old rating), then re-add.`, lanes: V },
    { line: ln(C_FOOD, 'set.add(food)'), do() { rating.set('kimchi', 16); }, say: () => `changeRating("kimchi", 16): tie at 16 → name order → <b>bulgogi</b> first.`, lanes: V }]);
}

const C_NUM = `
public void change(int index, int number) {
    Integer old = idxToNum.put(index, number);
    if (old != null) {
        TreeSet<Integer> s = numToIdx.get(old);
        s.remove(index);
        if (s.isEmpty()) numToIdx.remove(old);
    }
    numToIdx.computeIfAbsent(number, k -> new TreeSet<>()).add(index);
}

public int find(int number) {
    TreeSet<Integer> s = numToIdx.get(number);
    return s == null ? -1 : s.first();
}`;
function numberContainers() {
  const idx = new Map(), num = new Map();
  const ch = (i, n) => { if (idx.has(i)) num.get(idx.get(i)).delete(i); idx.set(i, n); if (!num.has(n)) num.set(n, new Set()); num.get(n).add(i); };
  const V = () => [mapLane('index → number', idx), lane('number → sorted indices', [...num].filter(([, s]) => s.size).map(([n, s]) => `${n}: {${[...s].sort((a, b) => a - b)}}`))];
  return seqSim({ say: `Two maps: <b>index → number</b> and <b>number → TreeSet of indices</b>. find = first() of the set.`, lanes: V }, [
    { line: ln(C_NUM, 'computeIfAbsent'), do() { ch(2, 10); ch(1, 10); ch(3, 10); ch(5, 10); }, say: () => `change(2/1/3/5, 10). find(10) → <b>1</b>.`, lanes: V },
    { line: ln(C_NUM, 's.remove(index)'), do() { ch(1, 20); }, say: () => `change(1, 20): index 1 leaves 10's set first. find(10) → <b>2</b>.`, lanes: V }]);
}

const C_INC = `
public int pop() {
    if (top < 0) return -1;
    int res = st[top] + inc[top];
    if (top > 0) inc[top - 1] += inc[top];   // hand the pending increment down
    inc[top] = 0;
    top--;
    return res;
}

public void increment(int k, int val) {
    int i = Math.min(k, top + 1) - 1;
    if (i >= 0) inc[i] += val;               // tag only the highest affected index
}`;
function customStack() {
  const st = [], inc = [];
  const V = () => [lane('stack values (bottom → top)', [...st], { showIdx: true }), lane('lazy inc[]', [...inc], { showIdx: true, active: inc.map((x, i) => (x ? i : -1)).filter(i => i >= 0) }), lane('real values', st.map((v, i) => v + inc.slice(i).reduce((a, b) => a + b, 0)))];
  return seqSim({ say: `Increment the bottom k elements in O(1): write the increment <b>only at index k−1</b>; it flows down on pop.`, lanes: V }, [
    { line: 0, do() { st.push(1, 2, 3); inc.push(0, 0, 0); }, say: () => `push 1, 2, 3.`, lanes: V },
    { line: ln(C_INC, 'inc[i] += val'), do() { inc[1] += 100; }, say: () => `increment(2, 100) → tag inc[1] += 100 (covers indices 0..1).`, lanes: V },
    { line: ln(C_INC, 'int res = st[top] + inc[top]'), do() { st.pop(); inc.pop(); }, say: () => `pop() → 3 (no tag at the top).`, lanes: V },
    { line: ln(C_INC, 'hand the pending'), do() { const t = inc.pop(); st.pop(); inc[inc.length - 1] += t; }, say: () => `pop() → 2 + 100 = <b>102</b>; pass +100 down to index 0.`, lanes: V },
    { line: ln(C_INC, 'int res'), do() { }, say: () => `next pop() → 1 + 100 = <b>101</b>. Each element was touched once.`, lanes: V }]);
}

const C_BH = `
public void visit(String url) {
    cur++;
    if (cur < pages.size()) pages.set(cur, url); else pages.add(url);
    last = cur;                       // forward history is gone
}
public String back(int steps) { cur = Math.max(0, cur - steps); return pages.get(cur); }
public String forward(int steps) { cur = Math.min(last, cur + steps); return pages.get(cur); }`;
function browser() {
  const pages = ['leet']; let cur = 0, last = 0;
  const V = () => [lane('pages', [...pages], { showIdx: true, active: [cur], ghost: pages.map((_, i) => (i > last ? i : -1)).filter(i => i >= 0), ptr: { [cur]: 'cur', ...(last !== cur ? { [last]: 'last' } : {}) } })];
  const visit = u => { cur++; if (cur < pages.length) pages[cur] = u; else pages.push(u); last = cur; };
  return seqSim({ say: `One array + <b>cur</b> + <b>last</b>. Back/forward just move cur; visit overwrites and resets last.`, lanes: V }, [
    { line: ln(C_BH, 'last = cur'), do() { visit('google'); visit('facebook'); visit('youtube'); }, say: () => `visit google, facebook, youtube.`, lanes: V },
    { line: ln(C_BH, 'public String back'), do() { cur = Math.max(0, cur - 2); }, say: () => `back(2) → <b>${pages[cur]}</b>.`, lanes: V },
    { line: ln(C_BH, 'last = cur'), do() { visit('linkedin'); }, say: () => `visit linkedin overwrites slot ${cur}; youtube is no longer reachable (last = ${last}).`, lanes: V },
    { line: ln(C_BH, 'public String forward'), do() { cur = Math.min(last, cur + 2); }, say: () => `forward(2) → stays at <b>${pages[cur]}</b>.`, lanes: V },
    { line: ln(C_BH, 'public String back'), do() { cur = Math.max(0, cur - 7); }, say: () => `back(7) → clamps at 0 → <b>${pages[cur]}</b>.`, lanes: V }]);
}

const C_CQ = `
public boolean enQueue(int v) {
    if (isFull()) return false;
    a[(front + size) % a.length] = v;
    size++;
    return true;
}
public boolean deQueue() {
    if (isEmpty()) return false;
    front = (front + 1) % a.length;
    size--;
    return true;
}
public int Rear() { return isEmpty() ? -1 : a[(front + size - 1) % a.length]; }`;
function circular() {
  const a = Array(3).fill(null); let front = 0, size = 0;
  const V = () => [lane('array (k = 3)', a.map(x => x ?? '·'), { showIdx: true, active: [...Array(size).keys()].map(i => (front + i) % 3), ptr: { [front]: 'front', ...(size ? { [(front + size - 1) % 3]: front === (front + size - 1) % 3 ? 'front/rear' : 'rear' } : {}) } })];
  const enq = v => { if (size === 3) return false; a[(front + size) % 3] = v; size++; return true; }, deq = () => { if (!size) return false; a[front] = null; front = (front + 1) % 3; size--; return true; };
  return seqSim({ say: `Fixed array, <b>front</b> + <b>size</b>. Indices wrap with % k, so freed slots at the start get reused.`, lanes: V }, [
    { line: ln(C_CQ, 'a[(front + size)'), do() { enq(1); enq(2); enq(3); }, say: () => `enQueue 1, 2, 3 → full.`, lanes: V },
    { line: ln(C_CQ, 'if (isFull()) return false'), do() { }, say: () => `enQueue(4) → <b>false</b> (full).`, lanes: V },
    { line: ln(C_CQ, 'front = (front + 1)'), do() { deq(); }, say: () => `deQueue → front moves to 1.`, lanes: V },
    { line: ln(C_CQ, 'a[(front + size)'), do() { enq(4); }, say: () => `enQueue(4) → (front + size) % 3 = 0: <b>wraps</b> into slot 0. Rear() = 4.`, lanes: V }]);
}

const C_HM = `
private int[] find(int key) {
    List<int[]> b = buckets[key % SIZE];
    if (b == null) return null;
    for (int[] p : b) if (p[0] == key) return p;
    return null;
}
public void put(int key, int value) {
    int[] p = find(key);
    if (p != null) { p[1] = value; return; }
    if (buckets[key % SIZE] == null) buckets[key % SIZE] = new LinkedList<>();
    buckets[key % SIZE].add(new int[]{key, value});
}`;
function hashmap() {
  const B = [[], [], [], [], []];
  const V = (hl) => [lane('buckets (SIZE = 5 for the demo; real code uses 10007)', B.map((b, i) => `${i}: ${b.map(([k, v]) => `${k}→${v}`).join(', ') || '∅'}`), { active: hl === undefined ? [] : [hl] })];
  const put = (k, v) => { const b = B[k % 5], p = b.find(x => x[0] === k); if (p) p[1] = v; else b.push([k, v]); };
  return seqSim({ say: `Hash → bucket index (key % SIZE). Collisions live together in the bucket's list (<b>separate chaining</b>).`, lanes: () => V() }, [
    { line: ln(C_HM, 'buckets[key % SIZE].add'), do() { put(1, 1); put(6, 6); put(11, 11); }, say: () => `put 1, 6, 11 → all land in bucket 1 (collision chain).`, lanes: () => V(1) },
    { line: ln(C_HM, 'p[1] = value'), do() { put(6, 60); }, say: () => `put(6, 60): found in the chain → update.`, lanes: () => V(1) },
    { line: ln(C_HM, 'for (int[] p : b)'), do() { }, say: () => `get(11): go to bucket 1, scan the short chain → <b>11</b>. A prime SIZE spreads keys evenly.`, lanes: () => V(1) }]);
}

const C_HS = `
// Approach 1: boolean[1_000_001] present → add / remove / contains are one array access
// Approach 2: buckets[key % 10007] chains, like Design HashMap but storing keys only
public void remove(int key) { if (buckets[key % SIZE] != null) buckets[key % SIZE].remove(Integer.valueOf(key)); }`;
function hashset() {
  const r = recorder();
  r.step(1, `Keys are ≤ 10^6, so a <b>direct-address</b> boolean array works: O(1) everything, ~1 MB memory.`, [lane('present[0..9] (demo)', ['F', 'T', 'T', 'F', 'F', 'F', 'F', 'F', 'F', 'F'], { showIdx: true, done: [1, 2] })]);
  r.step(2, `For huge key ranges use <b>chaining</b> instead (see Design HashMap).`, [lane('buckets', ['0: ∅', '1: 1 → 10008', '2: 2'], { active: [1] })]);
  r.step(ln(C_HS, 'Integer.valueOf(key)'), `Java trap: <code>list.remove(key)</code> with an int removes by <b>index</b>. Use <code>remove(Integer.valueOf(key))</code>.`, [lane('bucket list', [1, 10008], { bad: [0] })]);
  return r.steps;
}

const C_MOVIE = `
public void rent(int shop, int movie) {
    int p = price.get(key(shop, movie));
    available.get(movie).remove(new int[]{p, shop});
    rented.add(new int[]{p, shop, movie});
}
// search(movie): first 5 of available[movie]   ordered by (price, shop)
// report():      first 5 of rented             ordered by (price, shop, movie)`;
function movie() {
  const avail = { 1: [[5, 0], [4, 1], [5, 2]], 2: [[6, 0]], 3: [[7, 0], [8, 1]] }, rented = [];
  const S = a => [...a].sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const V = () => [lane('available[1] (price, shop)', S(avail[1]).map(([p, s]) => `$${p} s${s}`)), lane('rented (price, shop, movie)', [...rented].sort((x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2]).map(([p, s, m]) => `$${p} s${s} m${m}`))];
  const rent = (s, m) => { const i = avail[m].findIndex(x => x[1] === s); const [p] = avail[m].splice(i, 1)[0]; rented.push([p, s, m]); };
  return seqSim({ say: `Two kinds of sorted sets: per-movie <b>available</b> (price, shop) and one global <b>rented</b> (price, shop, movie). Renting moves an entry between them.`, lanes: V }, [
    { line: ln(C_MOVIE, 'search(movie)'), do() { }, say: () => `search(1) → shops <b>[1, 0, 2]</b> (cheapest first, then smaller shop).`, lanes: V },
    { line: ln(C_MOVIE, 'rented.add'), do() { rent(0, 1); rent(0, 2); }, say: () => `rent(0, 1) and rent(0, 2): each entry moves from its movie's available set into the global rented set.`, lanes: V },
    { line: ln(C_MOVIE, 'search(movie)'), do() { }, say: () => `search(1) now → <b>[1, 2]</b> (shop 0's copy is out).`, lanes: V },
    { line: ln(C_MOVIE, 'report()'), do() { }, say: () => `report() → rented sorted by (price, shop, movie) → <b>[[0,1], [0,2]]</b>.`, lanes: V }]);
}

const C_PARK = `
public boolean addCar(int carType) {
    if (slots[carType] == 0) return false;
    slots[carType]--;
    return true;
}`;
function park() {

    { line: ln(C_BANK, 'bal[a2 - 1] += money'), do() { b[4] -= 20; b[0] += 20; }, say: () => `transfer(5, 1, 20) → true.`, lanes: V },
    { line: ln(C_BANK, 'return false'), do() { }, say: () => `transfer(3, 4, 15) → false (account 3 has 10). withdraw(10, 50) → false (no account 10).`, lanes: V }]);
}

const C_SNAP = `
public void set(int index, int val) {
    List<int[]> h = hist.get(index);
    if (h.get(h.size() - 1)[0] == snapId) h.get(h.size() - 1)[1] = val;
    else h.add(new int[]{snapId, val});
}
public int get(int index, int id) {          // last change with snapId <= id
    List<int[]> h = hist.get(index);
    int lo = 0, hi = h.size() - 1;
    while (lo < hi) { int m = (lo + hi + 1) >>> 1; if (h.get(m)[0] <= id) lo = m; else hi = m - 1; }
    return h.get(lo)[1];
}`;
function snapshot() {
  const h = [[[0, 0]], [[0, 0]], [[0, 0]]]; let snap = 0;
  const V = () => [lane('history per index: (snap, value)', h.map((x, i) => `${i}: ${x.map(([s, v]) => `(${s},${v})`).join(' ')}`)), lane('current snapId', [snap])];
  const set = (i, v) => { const x = h[i]; if (x.at(-1)[0] === snap) x.at(-1)[1] = v; else x.push([snap, v]); };
  return seqSim({ say: `Copying the array per snap is O(n·snaps). Store only <b>changes</b> per index, tagged with the snap id.`, lanes: V }, [
    { line: ln(C_SNAP, 'h.get(h.size() - 1)[1] = val'), do() { set(0, 5); }, say: () => `set(0, 5) during snap 0 → overwrite (0,0) with (0,5).`, lanes: V },
    { line: 0, do() { snap++; }, say: () => `snap() → returns 0, now snapId = 1.`, lanes: V },
    { line: ln(C_SNAP, 'h.add(new int[]'), do() { set(0, 6); }, say: () => `set(0, 6) in snap 1 → append (1,6).`, lanes: V },
    { line: ln(C_SNAP, 'return h.get(lo)[1]'), do() { }, say: () => `get(0, 0) → binary search for the last entry with snap ≤ 0 → <b>5</b>.`, lanes: V }]);
}

const C_TM = `
public String get(String key, int timestamp) {
    TreeMap<Integer, String> t = m.get(key);
    if (t == null) return "";
    Map.Entry<Integer, String> e = t.floorEntry(timestamp);
    return e == null ? "" : e.getValue();
}`;
function timeMap() {
  const t = new Map();
  const V = () => [mapLane('foo: TreeMap(timestamp → value)', t)];
  return seqSim({ say: `Per key a TreeMap of timestamp → value. get = <b>floorEntry</b>: the largest timestamp ≤ the query.`, lanes: V }, [
    { line: 0, do() { t.set(1, 'bar'); }, say: () => `set(foo, bar, 1). get(foo, 3) → floor(3) = 1 → "bar".`, lanes: V },
    { line: ln(C_TM, 'floorEntry'), do() { t.set(4, 'bar2'); }, say: () => `set(foo, bar2, 4). get(foo, 4) → "bar2"; get(foo, 5) → "bar2"; get(foo, 0) → "" (no floor).`, lanes: V }]);
}

const C_ROBOT = `
Robot(int width, int height) {
    for (int x = 0; x < width; x++) { pos.add(new int[]{x, 0}); dir.add("East"); }
    for (int y = 1; y < height; y++) { pos.add(new int[]{width - 1, y}); dir.add("North"); }
    for (int x = width - 2; x >= 0; x--) { pos.add(new int[]{x, height - 1}); dir.add("West"); }
    for (int y = height - 2; y > 0; y--) { pos.add(new int[]{0, y}); dir.add("South"); }
    dir.set(0, "South");               // arriving back at the origin means facing South
}
public void step(int num) { moved = true; i = (i + num) % pos.size(); }
public String getDir() { return !moved ? "East" : dir.get(i); }`;
function robot() {
  const W = 6, H = 3, cells = []; for (let x = 0; x < W; x++) cells.push([x, 0, 'E']); for (let y = 1; y < H; y++) cells.push([W - 1, y, 'N']); for (let x = W - 2; x >= 0; x--) cells.push([x, H - 1, 'W']); for (let y = H - 2; y > 0; y--) cells.push([0, y, 'S']);
  let i = 0;
  const G = () => grid('6 × 3 field (top row = y 2)', [...Array(H)].map((_, ry) => [...Array(W)].map((_, x) => { const k = cells.findIndex(c => c[0] === x && c[1] === H - 1 - ry); return k < 0 ? '' : k === i ? '🤖' : cells[k][2]; })), { rowLabels: [2, 1, 0], cls: (ry, x) => (cells[i][0] === x && cells[i][1] === H - 1 - ry ? 'active' : '') });
  return seqSim({ say: `The robot only ever walks the <b>border</b>. Precompute the perimeter (${cells.length} cells) once; step(num) is a modulo.`, lanes: () => [G()] }, [
    { line: ln(C_ROBOT, 'public void step'), do() { i = 4; }, say: () => `step(2), step(2) → (4, 0) facing East.`, lanes: () => [G()] },
    { line: ln(C_ROBOT, 'public void step'), do() { i = (i + 7) % cells.length; }, say: () => `step(2), step(1), step(4) → (1, 2) facing West.`, lanes: () => [G()] },
    { line: ln(C_ROBOT, 'dir.set(0, "South")'), do() { i = 0; }, say: () => `Gotcha: back at (0,0) after moving, it faces <b>South</b> (it arrived from above), not East.`, lanes: () => [G()] }]);
}
