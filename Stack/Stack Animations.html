<script>
const { lane, grid, recorder, mount, ln } = BrainAnim;
const S = (name, st, hl) => lane(name, st.map(x => (Array.isArray(x) ? `(${x})` : x)), { vertical: true, active: hl ? [st.length - 1] : [], tag: 'top on top' });
// Scans items left→right (or right→left); step(item, i) mutates state and returns [line, say]
function scan(intro, items, step, lanes, opt = {}) {
  const r = recorder(); r.step(0, intro, lanes(-1));
  const order = opt.reverse ? [...items.keys()].reverse() : [...items.keys()];
  for (const i of order) { const out = step(items[i], i); if (!out) break; const [line, say, vars] = out; r.step(line, say, lanes(i), vars); }
  if (opt.end) { const [line, say, vars] = opt.end(); r.step(line, say, lanes(-1), vars); }
  return r.steps;
}

const C_VP = `
for (char c : s.toCharArray()) {
    if (c == '(') st.push(')');
    else if (c == '[') st.push(']');
    else if (c == '{') st.push('}');
    else if (st.isEmpty() || st.pop() != c) return false;   // must match the expected closer
}
return st.isEmpty();`;
function vp() { const s = '{[()]}', st = []; return scan(`Push the closer you <b>expect</b>; a closing bracket must equal the popped expectation.`, [...s], c => { if ('([{'.includes(c)) { st.push({ '(': ')', '[': ']', '{': '}' }[c]); return [ln(C_VP, `c == '${c}'`), `"${c}" → expect "${st.at(-1)}".`]; } st.pop(); return [ln(C_VP, 'must match'), `"${c}" matches the expectation → pop.`]; }, i => [lane('s', [...s], { active: i >= 0 ? [i] : [] }), S('stack of expected closers', st)], { end: () => [ln(C_VP, 'st.isEmpty()'), `Stack empty → <b>valid</b>.`] }); }

const C_RPN = `
switch (t) {
    case "+" -> st.push(st.pop() + st.pop());
    case "*" -> st.push(st.pop() * st.pop());
    case "-" -> { int b = st.pop(), a = st.pop(); st.push(a - b); }   // order!
    case "/" -> { int b = st.pop(), a = st.pop(); st.push(a / b); }
    default -> st.push(Integer.parseInt(t));
}`;
function rpn() { const t = ['4', '13', '5', '/', '+'], st = []; return scan(`Postfix: operands wait on the stack; an operator eats the top two.`, t, x => { if (!isNaN(x)) { st.push(+x); return [ln(C_RPN, 'default'), `push ${x}.`]; } const b = st.pop(), a = st.pop(), v = x === '+' ? a + b : x === '-' ? a - b : x === '*' ? a * b : Math.trunc(a / b); st.push(v); return [ln(C_RPN, `case "${x}"`), `${a} ${x} ${b} = <b>${v}</b> (a is the deeper one).`]; }, i => [lane('tokens', t, { active: i >= 0 ? [i] : [] }), S('stack', st)]); }

const C_QS = `
public void push(int x) { in.push(x); }
private void move() { if (out.isEmpty()) while (!in.isEmpty()) out.push(in.pop()); }   // reverse once
public int pop() { move(); return out.pop(); }`;
function qs() {
  const inS = [], out = [], r = recorder(), V = () => [S('in (pushes)', [...inS]), S('out (pops)', [...out])];
  r.step(0, `Two stacks: <b>in</b> takes pushes, <b>out</b> serves pops. Pouring in → out reverses the order once, so the oldest ends on top.`, V());
  [1, 2, 3].forEach(x => inS.push(x)); r.step(ln(C_QS, 'in.push'), `push 1, 2, 3.`, V());
  while (inS.length) out.push(inS.pop()); r.step(ln(C_QS, 'reverse once'), `pop(): out is empty → pour everything over. Now 1 is on top.`, V());
  out.pop(); r.step(ln(C_QS, 'return out.pop()'), `pop() → <b>1</b>.`, V());
  inS.push(4); r.step(ln(C_QS, 'in.push'), `push 4 goes to in. out still has 2, 3, so the next pops do not touch in → amortised O(1).`, V());
  return r.steps;
}


const C_DT = `
for (int i = 0; i < t.length; i++) {
    while (!st.isEmpty() && t[st.peek()] < t[i]) { int j = st.pop(); res[j] = i - j; }   // warmer day answers them
    st.push(i);
}`;
function dt() { const t = [73, 74, 75, 71, 69, 72, 76, 73], res = Array(8).fill(0), st = []; return scan(`Indices wait on a <b>decreasing</b> stack until a warmer day arrives.`, t, (x, i) => { const ans = []; while (st.length && t[st.at(-1)] < x) { const j = st.pop(); res[j] = i - j; ans.push(j); } st.push(i); return [ln(C_DT, 'warmer day'), ans.length ? `${x}° answers day${ans.length > 1 ? 's' : ''} ${ans.join(', ')}.` : `${x}° waits.`]; }, i => [lane('temps', t, { showIdx: true, active: i >= 0 ? [i] : [] }), S('waiting indices', st.map(j => `${j}:${t[j]}`)), lane('answer', [...res])], { end: () => [0, `Days still waiting never get warmer → 0. Answer <b>[${res}]</b>.`] }); }

const C_LRH = `
for (int i = 0; i <= n; i++) {
    int cur = i == n ? 0 : h[i];                        // sentinel 0 flushes the stack
    while (!st.isEmpty() && h[st.peek()] >= cur) {
        int height = h[st.pop()], left = st.isEmpty() ? -1 : st.peek();
        best = Math.max(best, height * (i - left - 1));  // i = NSR, left = NSL
    }
    st.push(i);
}`;
function lrh() { const h = [2, 1, 5, 6, 2, 3]; let best = 0; const st = []; return scan(`For each bar: how far can it stretch? Until the nearest <b>smaller</b> bar on each side. A popped bar learns both at once.`, [...h, 0], (x, i) => { const said = []; while (st.length && h[st.at(-1)] >= x) { const k = st.pop(), left = st.length ? st.at(-1) : -1, a = h[k] * (i - left - 1); best = Math.max(best, a); said.push(`${h[k]}×${i - left - 1}=${a}`); } st.push(i); return [ln(C_LRH, 'NSR'), said.length ? `bar ${i === 6 ? '(sentinel 0)' : x} pops: ${said.join(', ')}.` : `push bar ${x}.`, { best }]; }, i => [lane('heights', h, { showIdx: true, active: i >= 0 && i < 6 ? [i] : [] }), S('increasing stack (indices)', st.filter(k => k < 6).map(k => `${k}:${h[k]}`))]); }

const C_MR = `
for (char[] row : m) {
    for (int j = 0; j < h.length; j++) h[j] = row[j] == '1' ? h[j] + 1 : 0;   // histogram of 1s above
    best = Math.max(best, mah(h));                                            // Largest Rectangle in Histogram
}`;
function mr() {
  const M = ['10100', '10111', '11111', '10010'], h = Array(5).fill(0), r = recorder(); let best = 0;
  r.step(0, `Turn each row into the floor of a histogram: height = consecutive 1s above. Then reuse <b>Largest Rectangle in Histogram</b>.`, [grid('matrix', M.map(x => [...x]))]);
  M.forEach((row, k) => { [...row].forEach((c, j) => h[j] = c === '1' ? h[j] + 1 : 0); const a = (() => { let b = 0; for (let i = 0; i < 5; i++) { let mn = 99; for (let j = i; j < 5; j++) { mn = Math.min(mn, h[j]); b = Math.max(b, mn * (j - i + 1)); } } return b; })(); best = Math.max(best, a); r.step(ln(C_MR, 'histogram of 1s'), `row ${k}: heights [${h}] → best rectangle here ${a}.`, [grid('matrix', M.map(x => [...x]), { cls: (i) => (i === k ? 'active' : '') }), lane('histogram', [...h])], { best }); });
  return r.steps;
}

const C_LVP = `
st.push(-1);                                     // base: index before the current valid run
for (int i = 0; i < s.length(); i++) {
    if (s.charAt(i) == '(') st.push(i);
    else {
        st.pop();
        if (st.isEmpty()) st.push(i);            // unmatched ')' becomes the new base
        else best = Math.max(best, i - st.peek());
    }
}`;
function lvp() { const s = ')()())', st = [-1]; let best = 0; return scan(`Stack of indices with a <b>base</b> (the index just before the current valid run). Length = i − top after a match.`, [...s], (c, i) => { if (c === '(') { st.push(i); return [ln(C_LVP, "st.push(i);"), `"(" at ${i} → push.`]; } st.pop(); if (!st.length) { st.push(i); return [ln(C_LVP, 'new base'), `unmatched ")" at ${i} → new base ${i}.`]; } best = Math.max(best, i - st.at(-1)); return [ln(C_LVP, 'best = Math.max'), `match → length ${i} − ${st.at(-1)} = ${i - st.at(-1)}.`, { best }]; }, i => [lane('s', [...s], { showIdx: true, active: i >= 0 ? [i] : [] }), S('indices', [...st])]); }

const C_132 = `
for (int i = a.length - 1; i >= 0; i--) {
    if (a[i] < two) return true;                            // found the "1"
    while (!st.isEmpty() && st.peek() < a[i]) two = st.pop();   // a[i] is a "3"; popped = best "2"
    st.push(a[i]);
}`;
function p132() { const a = [3, 1, 4, 2], st = []; let two = -Infinity, done = false; return scan(`Scan from the right. The stack holds "3" candidates; whatever a bigger value pops becomes the best "2" (largest value below some "3").`, a, (x, i) => { if (done) return null; if (x < two) { done = true; return [ln(C_132, 'found the "1"'), `${x} &lt; two (${two}) → <b>1-3-2 found</b>.`]; } const p = []; while (st.length && st.at(-1) < x) { two = st.pop(); p.push(two); } st.push(x); return [ln(C_132, 'best "2"'), p.length ? `${x} pops ${p} → two = ${two}.` : `push ${x}.`, { two }]; }, i => [lane('nums', a, { showIdx: true, active: i >= 0 ? [i] : [] }), S('stack ("3" candidates)', [...st])], { reverse: true, end: () => [0, done ? `Pattern <b>1, 4, 2</b> exists → true.` : 'No pattern → false.'] }); }

const C_AST = `
for (int a : asteroids) {
    boolean alive = true;
    while (alive && a < 0 && !st.isEmpty() && st.peek() > 0) {   // only → ← can collide
        if (st.peek() < -a) st.pop();
        else { if (st.peek() == -a) st.pop(); alive = false; }
    }
    if (alive) st.push(a);
}`;
function ast() { const a = [10, 2, -5, 5, -10], st = []; return scan(`Only a right-mover on the stack and a new left-mover can collide.`, a, x => { let alive = true; const log = []; while (alive && x < 0 && st.length && st.at(-1) > 0) { if (st.at(-1) < -x) log.push(`${st.pop()} explodes`); else { if (st.at(-1) === -x) { st.pop(); log.push('both explode'); } else log.push(`${x} explodes`); alive = false; } } if (alive) st.push(x); return [ln(C_AST, 'only → ←'), log.length ? `${x}: ${log.join(', ')}.` : `${x} joins.`]; }, i => [lane('asteroids', a, { active: i >= 0 ? [i] : [] }), S('survivors', [...st])], { end: () => [0, `Survivors <b>[${st}]</b>.`] }); }

const C_CALC = `
else if (c == '(') { st.push(result); st.push(sign); result = 0; sign = 1; }   // save outer state
else if (c == ')') {
    result += sign * num; num = 0;
    result = st.pop() * result + st.pop();                                    // outer + sign * inner
}`;
function calc() { const s = '1-(4+5)+2', st = []; let res = 0, num = 0, sign = 1; return scan(`Keep a running <b>result</b> and the <b>sign</b> of the next number. "(" saves (result, sign) and starts fresh.`, [...s], c => { if (/\d/.test(c)) { num = num * 10 + +c; return [0, `digit → num ${num}.`, { result: res, sign, num }]; } if (c === '+' || c === '-') { res += sign * num; num = 0; sign = c === '+' ? 1 : -1; return [0, `"${c}": result ${res}, next sign ${sign}.`, { result: res, sign, num }]; } if (c === '(') { st.push(res, sign); res = 0; sign = 1; return [ln(C_CALC, 'save outer state'), `"(": save (${st.at(-2)}, ${st.at(-1)}), restart.`, { result: res, sign, num }]; } res += sign * num; num = 0; const sg = st.pop(), prev = st.pop(); res = prev + sg * res; return [ln(C_CALC, 'outer + sign'), `")": ${prev} + (${sg})·inner → ${res}.`, { result: res, sign, num }]; }, i => [lane('s', [...s], { active: i >= 0 ? [i] : [] }), S('saved (result, sign)', [...st])], { end: () => [0, `Final: ${res} + ${sign}·${num} = <b>${res + sign * num}</b>.`] }); }

const C_BUILD = `
for (int t : target) {
    while (cur < t) { ops.add("Push"); ops.add("Pop"); cur++; }   // unwanted number
    ops.add("Push");
    cur++;
}`;
function build() { const ops = []; let cur = 1; return scan(`target [1,3], stream 1, 2, 3, … Every number is pushed; unwanted ones are popped immediately.`, [1, 3], t => { while (cur < t) { ops.push('Push', 'Pop'); cur++; } ops.push('Push'); cur++; return [ln(C_BUILD, 'unwanted'), `reach ${t}: numbers before it were pushed and popped.`]; }, () => [lane('operations', [...ops])]); }

const C_CBV = `
int bal = 0;
for (int i = 0; i < n; i++) { bal += (locked[i] == '0' || s[i] == '(') ? 1 : -1; if (bal < 0) return false; }   // too many ')'
bal = 0;
for (int i = n - 1; i >= 0; i--) { bal += (locked[i] == '0' || s[i] == ')') ? 1 : -1; if (bal < 0) return false; }   // too many '('
return true;`;
function cbv() {
  const r = recorder();
  r.step(0, `s = "))()))", locked = "010100". Unlocked chars are <b>wildcards</b>. Odd length is impossible.`, [lane('s', [...'))()))']), lane('locked', [...'010100'])]);
  r.step(ln(C_CBV, "too many ')'"), `Left → right, count wildcards as "(": the balance never goes negative ✓.`, [lane('balance (wild = +1)', [1, 0, 1, 0, 1, 0])]);
  r.step(ln(C_CBV, "too many '('"), `Right → left, count wildcards as ")": never negative ✓ → <b>true</b>.`, [lane('balance from the right', [0, 1, 0, 1, 0, 1])]);
  return r.steps;
}

const C_CD = `
for (char c : s.toCharArray()) {
    if (Character.isDigit(c)) { if (st.length() > 0) st.deleteCharAt(st.length() - 1); }   // digit eats the closest letter
    else st.append(c);
}`;
function cd() { const s = 'ab3c4d', st = []; return scan(`A digit deletes itself and the closest non-digit to its left = the <b>top</b> of a letter stack.`, [...s], c => { if (/\d/.test(c)) { const x = st.pop(); return [ln(C_CD, 'digit eats'), `"${c}" removes "${x}".`]; } st.push(c); return [0, `keep "${c}".`]; }, i => [lane('s', [...s], { active: i >= 0 ? [i] : [] }), S('kept', [...st])], { end: () => [0, `Result <b>"${st.join('')}"</b>.`] }); }

const C_CRAWL = `
for (String l : logs) {
    if (l.equals("../")) depth = Math.max(0, depth - 1);
    else if (!l.equals("./")) depth++;
}`;
function crawl() { const logs = ['d1/', 'd2/', '../', 'd21/', './']; let d = 0; return scan(`Only the stack <b>size</b> matters, so a depth counter is enough.`, logs, l => { if (l === '../') d = Math.max(0, d - 1); else if (l !== './') d++; return [ln(C_CRAWL, l === '../' ? 'depth - 1' : 'depth++'), `"${l}" → depth ${d}.`, { depth: d }]; }, i => [lane('logs', logs, { active: i >= 0 ? [i] : [] })], { end: () => [0, `Steps back to main = depth = <b>${d}</b>.`] }); }

const C_DEPTH = `
for (char c : s.toCharArray()) {
    if (c == '(') best = Math.max(best, ++depth);
    else if (c == ')') depth--;
}`;
function depth() { const s = '(1+(2*3)+((8)/4))+1'; let d = 0, b = 0; return scan(`Stack size = current depth; we only need its maximum.`, [...s].filter(c => '()'.includes(c)), c => { if (c === '(') b = Math.max(b, ++d); else d--; return [ln(C_DEPTH, c === '(' ? '++depth' : 'depth--'), `"${c}" → depth ${d}.`, { depth: d, max: b }]; }, () => [lane('brackets only', [...s].filter(c => '()'.includes(c)))], { end: () => [0, `Maximum depth <b>${b}</b>.`] }); }

const C_MSRS = `
static Object[] removePairs(String s, char a, char b, int pts) {
    StringBuilder st = new StringBuilder();
    for (char c : s.toCharArray()) {
        if (c == b && st.length() > 0 && st.charAt(st.length() - 1) == a) { st.deleteCharAt(st.length() - 1); score += pts; }
        else st.append(c);
    }
}
// first remove the MORE valuable pair everywhere, then the other pair from what is left`;
function msrs() {
  const r = recorder();
  r.step(0, `"cdbcbbaaabab", x("ab") = 4, y("ba") = 5. Greedy: remove the <b>more valuable</b> pair first, everywhere.`, [lane('s', [...'cdbcbbaaabab'])]);
  r.step(ln(C_MSRS, 'score += pts'), `Remove every "ba" with a stack → 3 × 5 = 15, leaving "cdbcbab"… → "cdbcab".`, [lane('after "ba" removal', [...'cdbcab'])], { score: 15 });
  r.step(ln(C_MSRS, 'then the other pair'), `Then "ab" once → +4. Total <b>19</b>.`, [lane('left', [...'cdbc'])], { score: 19 });
  return r.steps;
}

const C_MAP = `
for (char c : s.toCharArray()) {
    if (c == '(') open++;
    else if (open > 0) open--;
    else add++;                      // ')' with nothing to match
}
return add + open;                   // + unmatched '('`;
function mapv() { const s = '()))(('; let o = 0, a = 0; return scan(`Count unmatched "(" (open) and unmatched ")" (add).`, [...s], c => { if (c === '(') o++; else if (o) o--; else a++; return [ln(C_MAP, c === '(' ? 'open++' : o >= 0 && a ? 'add++' : 'open--'), `"${c}"`, { open: o, add: a }]; }, i => [lane('s', [...s], { active: i >= 0 ? [i] : [] })], { end: () => [ln(C_MAP, 'return add + open'), `Answer ${a} + ${o} = <b>${a + o}</b>.`] }); }

const C_MDB = `
for (char c : s.toCharArray()) {
    if (c == 'a') aRight--; else bLeft++;
    best = Math.min(best, aRight + bLeft);   // split after this char: delete b's left, a's right
}`;
function mdb() { const s = 'aababbab'; let aR = [...s].filter(c => c === 'a').length, bL = 0, best = aR; return scan(`Balanced = all a's then all b's. Choose a <b>split</b>: delete the b's before it and the a's after it.`, [...s], c => { if (c === 'a') aR--; else bL++; best = Math.min(best, aR + bL); return [ln(C_MDB, 'split after'), `split after "${c}": b's left ${bL} + a's right ${aR} = ${aR + bL}.`, { best }]; }, i => [lane('s', [...s], { active: i >= 0 ? [i] : [] })]); }

const C_MSW = `
for (char c : s.toCharArray()) {
    if (c == '[') open++;
    else if (open > 0) open--;            // matched pair disappears
}
return (open + 1) / 2;                    // each swap fixes two unmatched pairs`;
function msw() {
  const r = recorder();
  r.step(0, `"]]][[[": cancel matched pairs like a stack. What is left always looks like "]]]…[[[".`, [lane('s', [...']]][[['])]);
  r.step(ln(C_MSW, 'matched pair'), `Unmatched: 3 "]" and 3 "[".`, [lane('unmatched', [...']]][[['], { bad: [0, 1, 2, 3, 4, 5] })]);
  r.step(ln(C_MSW, 'each swap fixes two'), `Swap the first "]" with the last "[" → fixes 2 pairs at once → ceil(3/2) = <b>2</b>.`, [lane('after one swap', [...'[]][[]'], { done: [0, 5] })]);
  return r.steps;
}

const C_FP = `
for (int i = 0; i < p.length; i++) {
    while (!st.isEmpty() && p[st.peek()] >= p[i]) res[st.pop()] -= p[i];   // first cheaper-or-equal to the right
    st.push(i);
}`;
function fp() { const p = [8, 4, 6, 2, 3], res = [...p], st = []; return scan(`Each item waits for the first later price ≤ its own (a <b>next smaller-or-equal</b> element).`, p, (x, i) => { const g = []; while (st.length && p[st.at(-1)] >= x) { const j = st.pop(); res[j] -= x; g.push(j); } st.push(i); return [ln(C_FP, 'first cheaper'), g.length ? `${x} discounts item${g.length > 1 ? 's' : ''} ${g}.` : `${x} waits.`]; }, i => [lane('prices', p, { showIdx: true, active: i >= 0 ? [i] : [] }), S('waiting', st.map(j => `${j}:${p[j]}`)), lane('final', [...res])], { end: () => [0, `Items left on the stack get no discount. Answer <b>[${res}]</b>.`] }); }

const C_RAMP = `
for (int i = 0; i < a.length; i++) if (st.isEmpty() || a[i] < a[st.peek()]) st.push(i);   // new prefix minimum
for (int j = a.length - 1; j >= 0; j--)
    while (!st.isEmpty() && a[st.peek()] <= a[j]) best = Math.max(best, j - st.pop());`;
function ramp() {
  const a = [6, 0, 8, 2, 1, 5], r = recorder();
  r.step(ln(C_RAMP, 'new prefix minimum'), `Only <b>prefix minima</b> can be the best left end: stack = indices 0 (6), 1 (0).`, [lane('nums', a, { showIdx: true, warn: [0, 1] })]);
  r.step(ln(C_RAMP, 'best = Math.max'), `Scan right ends from the back: j = 5 (5) pops index 1 (0 ≤ 5) → width 4.`, [lane('nums', a, { showIdx: true, done: [1, 5] })], { best: 4 });
  r.step(ln(C_RAMP, 'best = Math.max'), `j = 2 (8) pops index 0 (6 ≤ 8) → width 2. Answer <b>4</b>.`, [lane('nums', a, { showIdx: true })], { best: 4 });
  return r.steps;
}

const C_ZERO = `
for (int x : nums) {
    while (!st.isEmpty() && st.peek() > x) st.pop();      // a smaller value splits the bigger levels
    if (x == 0) continue;
    if (st.isEmpty() || st.peek() < x) { st.push(x); ops++; }   // new level → one more operation
}`;
function zero() { const a = [1, 2, 1, 2, 1, 2], st = []; let ops = 0; return scan(`An operation zeroes the min of a zero-free subarray. Equal values can share one operation <b>unless a smaller value sits between them</b>. Keep an increasing stack of "open levels".`, a, x => { while (st.length && st.at(-1) > x) st.pop(); let neu = false; if (x && (!st.length || st.at(-1) < x)) { st.push(x); ops++; neu = true; } return [ln(C_ZERO, neu ? 'new level' : 'splits'), neu ? `${x} opens a new level → ops ${ops}.` : `${x} is already open → free.`, { ops }]; }, i => [lane('nums', a, { active: i >= 0 ? [i] : [] }), S('open levels', [...st])]); }
