<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="app"></div>
<script src="../assets/problem-links.js"></script>

<script src="../assets/brain-anim.js?v=3"></script>
<script>
const { lane, recorder, mount, ln } = BrainAnim;
const range = (a, b) => { const r = []; for (let t = a; t <= b; t++) r.push(t); return r; };
// Window lane: cells in [i..j] lit, cells already left behind faded, pointers i and j on top
const W = (name, arr, i, j, o = {}) => {
  const mark = new Set([...(o.done || []), ...(o.warn || []), ...(o.bad || [])]), ptr = {};
  if (i >= 0 && i < arr.length) ptr[i] = 'i';
  if (j >= 0 && j < arr.length) ptr[j] = ptr[j] ? 'i,j' : 'j';
  Object.assign(ptr, o.ptr || {});
  const active = [], ghost = [];
  arr.forEach((_, t) => { if (mark.has(t)) return; if (t >= i && t <= j) active.push(t); else if (t < i && !o.noGhost) ghost.push(t); });
  return lane(name, arr, { active, ghost, done: o.done, warn: o.warn, bad: o.bad, ptr, showIdx: true, tag: o.tag || (j >= i ? `window [${i}..${j}], length ${j - i + 1}` : 'empty window') });
};
// Map lane from a JS Map, one "key:count" cell per entry
const M = (name, m, hl) => { const ks = [...m.keys()]; return lane(name, ks.map(k => `${k}:${m.get(k)}`), { active: ks.includes(hl) ? [ks.indexOf(hl)] : [], tag: `size ${ks.length}` }); };
// Adds d to m[k], deleting the key at zero; returns the new count
const inc = (m, k, d = 1) => { const v = (m.get(k) || 0) + d; if (v === 0) m.delete(k); else m.set(k, v); return v; };
const story = list => { const r = recorder(); for (const [line, say, lanes, vars] of list) r.step(line, say, lanes, vars); return r.steps; };
const isV = c => 'aeiou'.includes(c);

const C_ALT = `
int N = n + k - 1;                       // read the circle once, plus k-1 wrap tiles
for (int i = 0, j = 1; j < N; j++) {
    if (colors[j % n] == colors[(j - 1) % n]) {
        i = j;                           // two equal neighbours: restart here
        continue;
    }
    if (j - i + 1 == k) {
        result++;                        // a full alternating group
        i++;                             // slide by one
    }
}`;
function alt() {
  const c = [0, 1, 0, 1, 0], k = 3, n = c.length, ext = [...c, ...c.slice(0, k - 1)], r = recorder(); let res = 0, i = 0;
  r.step(ln(C_ALT, 'int N'), `Circle [0,1,0,1,0], k = 3. A group may wrap around, so read the first k−1 tiles again at the end (shown greyed as extra cells 5, 6).`, [W('colors (circle read twice)', ext, 0, 0)], { result: 0 });
  for (let j = 1; j < ext.length; j++) {
    if (ext[j] === ext[j - 1]) { i = j; r.step(ln(C_ALT, 'restart here'), `colors[${j}] = colors[${j - 1}] = ${ext[j]}: no group can contain both → i jumps to ${j}.`, [W('colors (circle read twice)', ext, i, j, { bad: [j - 1, j] })], { result: res }); continue; }
    if (j - i + 1 === k) { res++; r.step(ln(C_ALT, 'a full alternating group'), `[${i}..${j}] alternates and has length k → group #${res}. Then i++ keeps the window at k.`, [W('colors (circle read twice)', ext, i, j, { done: range(i, j) })], { result: res }); i++; }
    else r.step(ln(C_ALT, 'for (int i'), `colors[${j}] ≠ colors[${j - 1}]: the run grows to length ${j - i + 1}.`, [W('colors (circle read twice)', ext, i, j)], { result: res });
  }
  r.step(0, `Every start on the circle was a full group: answer <b>${res}</b>.`, [lane('colors', c, { done: range(0, n - 1) })], { result: res });
  return r.steps;
}

const C_STOCK = `
for (int i = 0, j = 0; j < n; j++) {
    original += profit[j];                       // what the window earns today
    if (j - i + 1 > k / 2) modified += prices[j];  // second half: sell (strategy 1)
    if (j - i + 1 > k) {
        original -= profit[i];
        modified -= prices[i + k / 2];           // that day slid into the first half
        i++;
    }
    if (j - i + 1 == k) maxGain = Math.max(maxGain, modified - original);
}
return actual + maxGain;`;
function stock() {
  const p = [4, 7, 1, 9, 3, 8], st = [1, -1, 0, -1, 1, 0], k = 4, n = p.length, prof = p.map((x, d) => x * st[d]), r = recorder();
  const actual = prof.reduce((a, b) => a + b, 0); let orig = 0, mod = 0, gain = 0;
  r.step(0, `profit[d] = strategy·price = [${prof.join(', ')}], base total ${actual}. One modification over k = 4 days: first half becomes 0 (hold), second half becomes 1 (sell). Find the window with the biggest gain.`, [lane('prices', p, { showIdx: true }), lane('strategy', st), lane('profit', prof)], { actual });
  for (let i = 0, j = 0; j < n; j++) {
    orig += prof[j]; if (j - i + 1 > k / 2) mod += p[j];
    if (j - i + 1 > k) { orig -= prof[i]; mod -= p[i + k / 2]; i++; }
    if (j - i + 1 === k) { gain = Math.max(gain, mod - orig); r.step(ln(C_STOCK, 'maxGain = Math.max'), `Window [${i}..${j}]: originally earns ${orig}; modified it earns ${mod} (sell days ${i + k / 2}..${j}). Gain ${mod - orig}.`, [W('prices', p, i, j, { warn: range(i + k / 2, j) }), lane('profit', prof)], { original: orig, modified: mod, maxGain: gain }); }
    else r.step(ln(C_STOCK, 'original += profit[j]'), `Grow to day ${j}. Days past the first half add their price to "modified".`, [W('prices', p, i, j), lane('profit', prof)], { original: orig, modified: mod });
  }
  r.step(ln(C_STOCK, 'return actual'), `Answer = ${actual} + ${gain} = <b>${actual + gain}</b>.`, [lane('prices', p)], { answer: actual + gain });
  return r.steps;
}

const C_BIN = `
for (int i = 0, j = 0; j < nums.length; j++) {
    sum += nums[j];
    while (i < j && (nums[i] == 0 || sum > goal)) {   // drop leading 0s and excess
        prefixZeros = nums[i] == 1 ? 0 : prefixZeros + 1;
        sum -= nums[i];
        i++;
    }
    if (sum == goal) count += 1 + prefixZeros;        // each dropped 0 is another start
}`;
function bin() {
  const a = [1, 0, 1, 0, 1], goal = 2, r = recorder(); let pz = 0, sum = 0, cnt = 0;
  r.step(0, `nums = [1,0,1,0,1], goal 2. Zeros make plain shrinking miss starts, so remember how many leading zeros we dropped (prefixZeros): each one is an extra start.`, [W('nums', a, 0, -1)], { count: 0 });
  for (let i = 0, j = 0; j < a.length; j++) {
    sum += a[j];
    while (i < j && (a[i] === 0 || sum > goal)) { pz = a[i] === 1 ? 0 : pz + 1; sum -= a[i]; i++; r.step(ln(C_BIN, 'drop leading 0s'), `Drop nums[${i - 1}] = ${a[i - 1]} → prefixZeros = ${pz}.`, [W('nums', a, i, j)], { sum, prefixZeros: pz, count: cnt }); }
    if (sum === goal) { cnt += 1 + pz; r.step(ln(C_BIN, 'each dropped 0'), `sum == goal at j = ${j}: 1 + ${pz} subarrays end here → count ${cnt}.`, [W('nums', a, i, j, { done: range(i, j) })], { sum, prefixZeros: pz, count: cnt }); }
    else r.step(ln(C_BIN, 'sum += nums[j]'), `j = ${j}: sum = ${sum}.`, [W('nums', a, i, j)], { sum, prefixZeros: pz, count: cnt });
  }
  r.step(0, `Answer <b>${cnt}</b>. (Prefix-sum map version: count earlier prefixes equal to sum − goal.)`, [lane('nums', a)], { count: cnt });
  return r.steps;
}

const C_DUP = `
for (int i = 0, j = 0; j < nums.length; j++) {
    if (j - i > k) window.remove(nums[i++]);   // keep only the last k values
    if (!window.add(nums[j])) return true;      // already inside: distance ≤ k
}
return false;`;
function dup() {
  const a = [1, 2, 3, 4, 2, 5], k = 2, r = recorder(), s = new Set();
  r.step(0, `nums = [1,2,3,4,2,5], k = 2. A set holds only the last k values: a repeat inside it is at distance ≤ k.`, [W('nums', a, 0, -1), lane('set', [])]);
  for (let i = 0, j = 0; j < a.length; j++) {
    if (j - i > k) { s.delete(a[i]); i++; r.step(ln(C_DUP, 'keep only the last k'), `Window too wide: evict nums[${i - 1}] = ${a[i - 1]}.`, [W('nums', a, i, j - 1, { ptr: { [j]: 'j' } }), lane('set', [...s])]); }
    if (s.has(a[j])) { r.step(ln(C_DUP, 'already inside'), `${a[j]} is already in the set → <b>true</b>.`, [W('nums', a, i, j, { bad: [j] }), lane('set', [...s], { bad: [[...s].indexOf(a[j])] })]); return r.steps; }
    s.add(a[j]); r.step(ln(C_DUP, 'already inside'), `Add ${a[j]}.`, [W('nums', a, i, j), lane('set', [...s])]);
  }
  r.step(ln(C_DUP, 'return false'), `The two 2s are 3 apart, more than k = 2, so 2 was evicted first → <b>false</b>.`, [lane('nums', a, { warn: [1, 4] }), lane('set', [...s])]);
  return r.steps;
}

const C_CONT = `
for (int i = 0, j = 0; j < nums.length; j++) {
    win.merge(nums[j], 1, Integer::sum);            // TreeMap: sorted value → count
    while (win.lastKey() - win.firstKey() > 2) {     // max − min too big: shrink
        if (win.merge(nums[i], -1, Integer::sum) == 0) win.remove(nums[i]);
        i++;
    }
    count += j - i + 1;                              // every start in [i..j] works
}`;
function cont() {
  const a = [5, 4, 2, 4], r = recorder(), m = new Map(); let cnt = 0;
  const T = () => { const ks = [...m.keys()].sort((x, y) => x - y); return lane('TreeMap (sorted)', ks.map(k => `${k}:${m.get(k)}`), { tag: ks.length ? `min ${ks[0]}, max ${ks[ks.length - 1]}` : '' }); };
  r.step(0, `nums = [5,4,2,4]. Valid = max − min ≤ 2. A TreeMap gives min and max of the window instantly.`, [W('nums', a, 0, -1), T()], { count: 0 });
  for (let i = 0, j = 0; j < a.length; j++) {
    inc(m, a[j]); const span = () => Math.max(...m.keys()) - Math.min(...m.keys());
    while (span() > 2) { r.step(ln(C_CONT, 'max − min too big'), `max − min = ${span()} > 2 → drop nums[${i}] = ${a[i]}.`, [W('nums', a, i, j, { bad: [i] }), T()], { count: cnt }); inc(m, a[i], -1); i++; }
    cnt += j - i + 1; r.step(ln(C_CONT, 'every start'), `Window [${i}..${j}] is valid → +${j - i + 1} subarrays ending at ${j}.`, [W('nums', a, i, j), T()], { count: cnt });
  }
  r.step(0, `Answer <b>${cnt}</b>. Why "~O(n)": the map never holds more than 3 distinct values.`, [lane('nums', a)], { count: cnt });
  return r.steps;
}

const C_CCS = `
int total = number of distinct values in nums;
for (int i = 0, j = 0; j < n; j++) {
    win.merge(nums[j], 1, Integer::sum);
    while (win.size() == total) {        // [i..j] is complete
        res += n - j;                    // so is [i..j+1], ..., [i..n-1]
        drop nums[i++] from win;
    }
}`;
function ccs() {
  const a = [1, 3, 1, 2, 2], n = a.length, total = 3, r = recorder(), m = new Map(); let res = 0;
  r.step(ln(C_CCS, 'int total'), `[1,3,1,2,2] has 3 distinct values. Complete = window holds all 3.`, [W('nums', a, 0, -1), M('window', m)], { total, res: 0 });
  for (let i = 0, j = 0; j < n; j++) {
    inc(m, a[j]); r.step(ln(C_CCS, 'win.merge'), `Add ${a[j]} → ${m.size} distinct.`, [W('nums', a, i, j), M('window', m, a[j])], { res });
    while (m.size === total) { res += n - j; r.step(ln(C_CCS, 'so is [i..j+1]'), `[${i}..${j}] complete → it and every extension right count: +${n - j}.`, [W('nums', a, i, j, { done: range(j, n - 1) }), M('window', m)], { res }); inc(m, a[i], -1); i++; }
  }
  r.step(0, `Answer <b>${res}</b>.`, [lane('nums', a)], { res });
  return r.steps;
}

const C_CCSUB = `
split word where |w[i] − w[i−1]| > 2;           // condition 2 cuts the string
for (int chars = 1; chars * k <= pieceLength; chars++) {
    fixed window of length chars * k;
    good = letters whose count is exactly k;
    if (good == chars) result++;                // every letter appears exactly k times
}`;
function ccsub() {
  const w = 'igigee', k = 2, r = recorder(); let res = 0;
  r.step(ln(C_CCSUB, 'split word'), `"igigee", k = 2. Neighbours i–g, g–e differ by ≤ 2, so the whole string is one piece. A complete substring with c distinct letters has length exactly c·k → try every c with a fixed window.`, [lane('word', [...w], { showIdx: true })], { result: 0 });
  for (let chars = 1; chars * k <= w.length; chars++) {
    const L = chars * k;
    for (let s = 0; s + L <= w.length; s++) {
      const cnt = {}; for (const ch of w.slice(s, s + L)) cnt[ch] = (cnt[ch] || 0) + 1;
      const good = Object.values(cnt).filter(x => x === k).length, ok = good === chars; if (ok) res++;
      r.step(ln(C_CCSUB, ok ? 'result++' : 'good = letters'), `chars = ${chars}, window "${w.slice(s, s + L)}": counts ${JSON.stringify(cnt).replace(/"/g, '')} → good = ${good}${ok ? ' = chars ✓' : ''}.`, [W('word', [...w], s, s + L - 1, ok ? { done: range(s, s + L - 1) } : {})], { chars, window: L, result: res });
    }
  }
  r.step(0, `Answer <b>${res}</b>: "ee", "igig", "igigee".`, [lane('word', [...w])], { result: res });
  return r.steps;
}

const C_OCC = `
int[] count = counts of pat;
for (int i = 0, j = 0; j < txt.length(); j++) {
    count[txt.charAt(j) - 'a']--;        // letter enters: use it up
    if (j - i + 1 == k) {
        if (allZero(count)) result++;    // window used every letter exactly
        count[txt.charAt(i++) - 'a']++;  // letter leaves: give it back
    }
}`;
function occ() {
  const pat = 'for', t = 'forxxorfxdofr', k = 3, r = recorder(), cnt = { f: 1, o: 1, r: 1 }; let res = 0;
  const C = () => lane('count (pat − window)', Object.keys(cnt).map(c => `${c}:${cnt[c]}`), { tag: 'all 0 ⇒ anagram' });
  r.step(ln(C_OCC, 'int[] count'), `pat = "for": start from its letter counts. Entering letters subtract, leaving letters add back.`, [W('txt', [...t], 0, -1), C()], { result: 0 });
  for (let i = 0, j = 0; j < t.length; j++) {
    cnt[t[j]] = (cnt[t[j]] || 0) - 1;
    if (j - i + 1 === k) {
      const zero = Object.values(cnt).every(x => x === 0); if (zero) res++;
      r.step(ln(C_OCC, 'allZero'), `Window "${t.slice(i, j + 1)}": ${zero ? 'all counts 0 → anagram #' + res : 'not all zero'}.`, [W('txt', [...t], i, j, zero ? { done: range(i, j) } : {}), C()], { result: res });
      cnt[t[i]]++; i++;
    }
  }
  r.step(0, `Answer <b>${res}</b> ("for", "orf", "ofr").`, [lane('txt', [...t])], { result: res });
  return r.steps;
}

const C_MAXK = `
for (int i = 0, j = 0; j < n; j++) {
    if (nums[j] == maxE) countMax++;
    while (countMax >= k) {              // [i..j] already has k copies of the max
        result += n - j;                 // so does every extension to the right
        if (nums[i++] == maxE) countMax--;
    }
}`;
function maxk() {
  const a = [1, 3, 2, 3, 3], k = 2, n = a.length, mx = 3, r = recorder(); let res = 0, c = 0;
  r.step(0, `[1,3,2,3,3], k = 2, max = 3. "At least k" is monotone: once a window qualifies, all its right extensions do too.`, [W('nums', a, 0, -1)], { countMax: 0, result: 0 });
  for (let i = 0, j = 0; j < n; j++) {
    if (a[j] === mx) c++; r.step(ln(C_MAXK, 'countMax++'), `j = ${j}: countMax = ${c}.`, [W('nums', a, i, j)], { countMax: c, result: res });
    while (c >= k) { res += n - j; r.step(ln(C_MAXK, 'so does every extension'), `[${i}..${j}] has ${c} threes → +${n - j}; then shrink.`, [W('nums', a, i, j, { done: range(j, n - 1) })], { countMax: c, result: res }); if (a[i] === mx) c--; i++; }
  }
  r.step(0, `Answer <b>${res}</b>.`, [lane('nums', a)], { result: res });
  return r.steps;
}

const C_FIX = `
for (int i = 0; i < nums.length; i++) {
    if (nums[i] < minK || nums[i] > maxK) bad = i;   // nothing can cross this
    if (nums[i] == minK) minPos = i;
    if (nums[i] == maxK) maxPos = i;
    ans += Math.max(0, Math.min(minPos, maxPos) - bad); // starts in (bad, min(minPos,maxPos)]
}`;
function fix() {
  const a = [1, 3, 5, 2, 7, 5], lo = 1, hi = 5, r = recorder(); let bad = -1, mn = -1, mx = -1, ans = 0;
  r.step(0, `[1,3,5,2,7,5], minK 1, maxK 5. For each end i, a valid start must be after the last out-of-range index and at or before both the last 1 and the last 5.`, [lane('nums', a, { showIdx: true })], { ans: 0 });
  a.forEach((x, i) => {
    if (x < lo || x > hi) bad = i; if (x === lo) mn = i; if (x === hi) mx = i;
    const add = Math.max(0, Math.min(mn, mx) - bad); ans += add;
    const ptr = {}; if (bad >= 0) ptr[bad] = 'bad'; if (mn >= 0) ptr[mn] = (ptr[mn] ? ptr[mn] + ',' : '') + 'min'; if (mx >= 0) ptr[mx] = (ptr[mx] ? ptr[mx] + ',' : '') + 'max';
    r.step(ln(C_FIX, 'starts in'), `i = ${i}: bad = ${bad}, minPos = ${mn}, maxPos = ${mx} → +${add}.`, [lane('nums', a, { showIdx: true, ptr, active: [i], bad: bad >= 0 ? [bad] : [], done: add ? range(bad + 1, Math.min(mn, mx)) : [] })], { ans });
  });
  r.step(0, `Answer <b>${ans}</b>: [1,3,5] and [1,3,5,2].`, [lane('nums', a)], { ans });
  return r.steps;
}

const C_SCORE = `
for (int i = 0, j = 0; j < nums.length; j++) {
    sum += nums[j];
    while (i <= j && sum * (j - i + 1) >= k) sum -= nums[i++];   // score too big
    result += j - i + 1;                                          // all shorter ones fit
}`;
function score() {
  const a = [2, 1, 4, 3, 5], k = 10, r = recorder(); let sum = 0, res = 0;
  r.step(0, `[2,1,4,3,5], k = 10. Score = sum × length only grows when the window grows, so shrink until it fits.`, [W('nums', a, 0, -1)], { result: 0 });
  for (let i = 0, j = 0; j < a.length; j++) {
    sum += a[j];
    while (i <= j && sum * (j - i + 1) >= k) { r.step(ln(C_SCORE, 'score too big'), `score ${sum}×${j - i + 1} = ${sum * (j - i + 1)} ≥ 10 → drop ${a[i]}.`, [W('nums', a, i, j, { bad: [i] })], { sum, result: res }); sum -= a[i]; i++; }
    res += j - i + 1; r.step(ln(C_SCORE, 'all shorter ones fit'), `[${i}..${j}] fits (score ${sum * (j - i + 1)}) → +${j - i + 1}.`, [W('nums', a, i, j)], { sum, result: res });
  }
  r.step(0, `Answer <b>${res}</b>.`, [lane('nums', a)], { result: res });
  return r.steps;
}

const C_KC = `
for (int i = 0, j = 0; j < s.length(); j++) {
    if (s.charAt(j) == '0') c0++; else c1++;
    while (c0 > k && c1 > k) {           // both over: invalid
        if (s.charAt(i++) == '0') c0--; else c1--;
    }
    result += j - i + 1;                 // every substring ending at j from i on
}`;
function kc() {
  const s = '10101', k = 1, r = recorder(); let c0 = 0, c1 = 0, res = 0;
  r.step(0, `"10101", k = 1. Valid while 0s ≤ k OR 1s ≤ k. Invalid only when BOTH exceed k.`, [W('s', [...s], 0, -1)], { result: 0 });
  for (let i = 0, j = 0; j < s.length; j++) {
    if (s[j] === '0') c0++; else c1++;
    while (c0 > k && c1 > k) { r.step(ln(C_KC, 'both over'), `0s = ${c0}, 1s = ${c1}: both > 1 → drop s[${i}].`, [W('s', [...s], i, j, { bad: [i] })], { c0, c1, result: res }); if (s[i] === '0') c0--; else c1--; i++; }
    res += j - i + 1; r.step(ln(C_KC, 'every substring ending'), `[${i}..${j}] valid → +${j - i + 1}.`, [W('s', [...s], i, j)], { c0, c1, result: res });
  }
  r.step(0, `Answer <b>${res}</b>.`, [lane('s', [...s])], { result: res });
  return r.steps;
}
const C_KC2 = `
leftMost[j]  = smallest valid start for end j      (window left → right)
rightMost[i] = largest valid end for start i       (window right → left)
cum[j] = Σ (j' − leftMost[j'] + 1) for j' ≤ j
query [l, r]: v = min(r, rightMost[l]);
    answer = len(l..v)·(len+1)/2 + cum[r] − cum[v]`;
function kc2() {
  const s = '0001111', k = 2, n = s.length, L = Array(n), R = Array(n), cum = Array(n);
  for (let i = 0, j = 0, c = [0, 0]; j < n; j++) { c[+s[j]]++; while (c[0] > k && c[1] > k) c[+s[i++]]--; L[j] = i; }
  for (let i = n - 1, j = n - 1, c = [0, 0]; j >= 0; j--) { c[+s[j]]++; while (c[0] > k && c[1] > k) c[+s[i--]]--; R[j] = i; }

    cnt[s.charAt(j) - '0']++;
    while (cnt[0] > 0 && cnt[1] > 0 && cnt[2] > 0) {   // has all three: shrink
        result = Math.min(result, j - i + 1);
        cnt[s.charAt(i++) - '0']--;
    }
}`;
function z12() {
  const s = '10212', r = recorder(), c = [0, 0, 0]; let best = Infinity;
  r.step(0, `"10212": shortest window with a 0, a 1 and a 2. Same template as Minimum Window Substring with a tiny alphabet.`, [W('s', [...s], 0, -1)], {});
  for (let i = 0, j = 0; j < s.length; j++) {
    c[+s[j]]++; r.step(ln(C_012, "cnt[s.charAt(j) - '0']++"), `Add '${s[j]}'.`, [W('s', [...s], i, j)], { cnt: c.join(','), result: best === Infinity ? '∞' : best });
    while (c[0] && c[1] && c[2]) { best = Math.min(best, j - i + 1); r.step(ln(C_012, 'has all three'), `All three present, length ${j - i + 1} → shrink.`, [W('s', [...s], i, j, { done: range(i, j) })], { cnt: c.join(','), result: best }); c[+s[i]]--; i++; }
  }
  r.step(0, `Answer <b>${best}</b>.`, [lane('s', [...s])], { result: best });
  return r.steps;
}

const C_PROD = `
if (k <= 1) return 0;
for (int left = 0, right = 0; right < n; right++) {
    prod *= nums[right];
    while (prod >= k) prod /= nums[left++];       // positive numbers: dividing shrinks
    count += right - left + 1;                    // subarrays ending at right
}`;
function prod() {
  const a = [10, 5, 2, 6], k = 100, r = recorder(); let p = 1, c = 0;
  r.step(ln(C_PROD, 'if (k <= 1)'), `[10,5,2,6], k = 100. Positive numbers: the product only grows when the window grows.`, [W('nums', a, 0, -1)], { prod: 1, count: 0 });
  for (let l = 0, rr = 0; rr < a.length; rr++) {
    p *= a[rr];
    while (p >= k) { r.step(ln(C_PROD, 'dividing shrinks'), `prod ${p} ≥ 100 → divide out ${a[l]}.`, [W('nums', a, l, rr, { bad: [l] })], { prod: p, count: c }); p /= a[l]; l++; }
    c += rr - l + 1; r.step(ln(C_PROD, 'subarrays ending at right'), `[${l}..${rr}] product ${p} → +${rr - l + 1}.`, [W('nums', a, l, rr)], { prod: p, count: c });
  }
  r.step(0, `Answer <b>${c}</b>.`, [lane('nums', a)], { count: c });
  return r.steps;
}

const C_KD = `
for (int iSmall = 0, iBig = 0, j = 0; j < n; j++) {
    add nums[j];
    while (win.size() > k) { drop nums[iSmall++]; iBig = iSmall; }   // too many: both move
    while (win.get(nums[iSmall]) > 1) drop nums[iSmall++];          // spare copy: iSmall moves
    if (win.size() == k) result += iSmall - iBig + 1;               // starts iBig..iSmall
}`;
function kd() {
  const a = [1, 2, 1, 2, 3], k = 2, r = recorder(), m = new Map(); let res = 0;
  r.step(0, `[1,2,1,2,3], k = 2 exactly. iBig = earliest valid start, iSmall = latest (no spare copies to its left can be dropped without losing a value). All starts between them work.`, [lane('nums', a, { showIdx: true }), M('window', m)], { result: 0 });
  for (let s = 0, b = 0, j = 0; j < a.length; j++) {
    inc(m, a[j]);
    while (m.size > k) { inc(m, a[s], -1); s++; b = s; }
    while (m.get(a[s]) > 1) { inc(m, a[s], -1); s++; }
    if (m.size === k) res += s - b + 1;
    r.step(ln(C_KD, m.size === k ? 'starts iBig..iSmall' : 'add nums[j]'), `j = ${j}: iBig = ${b}, iSmall = ${s}${m.size === k ? ` → +${s - b + 1}` : ''}.`, [lane('nums', a, { showIdx: true, active: range(s, j), warn: range(b, s - 1), ghost: range(0, b - 1), ptr: { [b]: 'big', [s]: s === b ? 'big,small' : 'small' } }), M('window', m, a[j])], { result: res });
  }
  r.step(0, `Answer <b>${res}</b>.`, [lane('nums', a)], { result: res });
  return r.steps;
}
const C_KD2 = `
exactly(k) = atMost(k) − atMost(k − 1);
atMost(k): shrink while > k distinct; count += j − i + 1;`;
function kd2() {
  const a = [1, 2, 1, 2, 3], at = k => { const m = new Map(); let c = 0; for (let i = 0, j = 0; j < a.length; j++) { inc(m, a[j]); while (m.size > k) { inc(m, a[i], -1); i++; } c += j - i + 1; } return c; };
  return story([[ln(C_KD2, 'atMost(k):'), `"Exactly k" is not monotone, but "at most k" is: shrinking never breaks it. atMost(2) = ${at(2)}.`, [lane('nums', a, { showIdx: true })], { 'atMost(2)': at(2) }],
    [ln(C_KD2, 'exactly(k)'), `atMost(1) = ${at(1)}. Exactly 2 = ${at(2)} − ${at(1)} = <b>${at(2) - at(1)}</b>.`, [lane('nums', a)], { 'atMost(1)': at(1), answer: at(2) - at(1) }]]);
}

const C_CAT = `
for (int off = 0; off < w; off++) {                 // w separate word grids
    for (int i = off, j = off; j + w <= n; j += w) {
        String word = s.substring(j, j + w);
        if (!need.containsKey(word)) { reset; i = j + w; continue; }
        have[word]++;  used++;
        while (have[word] > need[word]) { drop the word at i; i += w; used--; }
        if (used == words.length) result.add(i);
    }
}`;
function cat() {
  const s = 'barfoothefoobarman', w = 3, need = { foo: 1, bar: 1 }, r = recorder(), out = [];
  r.step(0, `words = ["foo","bar"], w = 3. Cut s into word-sized cells starting at offset 0, 1, 2; on each grid it is a normal window over words.`, [lane('s', [...s], { showIdx: true })]);
  for (let off = 0; off < w; off++) {
    const cells = []; for (let j = off; j + w <= s.length; j += w) cells.push(s.slice(j, j + w));
    const have = {}; let used = 0, i = 0;
    for (let j = 0; j < cells.length; j++) {
      const word = cells[j];
      if (!need[word]) { for (const x in have) delete have[x]; used = 0; i = j + 1; r.step(ln(C_CAT, 'reset'), `Offset ${off}: "${word}" is not a word → reset after it.`, [W(`offset ${off} grid`, cells, i, j, { bad: [j] })], { result: `[${out}]` }); continue; }
      have[word] = (have[word] || 0) + 1; used++;
      while (have[word] > need[word]) { have[cells[i]]--; used--; i++; }
      if (used === 2) { out.push(off + i * w); r.step(ln(C_CAT, 'result.add'), `Offset ${off}: [${cells.slice(i, j + 1).join(' ')}] uses every word once → index ${off + i * w}.`, [W(`offset ${off} grid`, cells, i, j, { done: range(i, j) })], { result: `[${out}]` }); }
      else r.step(ln(C_CAT, 'have[word]++'), `Offset ${off}: take "${word}".`, [W(`offset ${off} grid`, cells, i, j)], { result: `[${out}]` });
    }
  }
  r.step(0, `Answer <b>[${out.sort((x, y) => x - y)}]</b>. The C++ file only has the brute force ("sliding window: coming soon"); this is that window.`, [lane('s', [...s])]);
  return r.steps;
}

const C_TAKE = `
count all letters; if any < k return -1;
for (int i = 0, j = 0; j < n; j++) {
    cnt[s[j]]--;                         // s[j] joins the KEPT middle
    while (i <= j && some cnt < k) cnt[s[i++]]++;   // took too few outside: give back
    keep = Math.max(keep, j - i + 1);
}
return n - keep;`;
function take() {
  const s = 'aabaaaacaabc', k = 2, n = s.length, r = recorder(), c = { a: 0, b: 0, c: 0 }; for (const ch of s) c[ch]++; let keep = 0;
  r.step(ln(C_TAKE, 'count all letters'), `"aabaaaacaabc", k = 2. Taking from both ends = keeping one middle block. Keep the longest block whose OUTSIDE still has ≥ 2 of each letter.`, [W('s', [...s], 0, -1)], { outside: `a${c.a} b${c.b} c${c.c}` });
  for (let i = 0, j = 0; j < n; j++) {
    c[s[j]]--;
    while (i <= j && (c.a < k || c.b < k || c.c < k)) { c[s[i]]++; i++; }
    keep = Math.max(keep, j - i + 1);
    r.step(ln(C_TAKE, 'keep = Math.max'), `Kept block [${i}..${j}], outside a${c.a} b${c.b} c${c.c}.`, [W('s', [...s], i, j)], { keep });
  }
  r.step(ln(C_TAKE, 'return n - keep'), `Answer ${n} − ${keep} = <b>${n - keep}</b> minutes.`, [lane('s', [...s])], { answer: n - keep });
  return r.steps;
}

const C_BOMB = `
int i = k > 0 ? 1 : n + k,  j = k > 0 ? k : n - 1;   // window after (k>0) or before (k<0) index 0
sum = code[i] + ... + code[j];
for (int t = 0; t < n; t++) {
    result[t] = sum;
    sum -= code[i++ % n];  sum += code[++j % n];       // both ends step forward around the circle
}`;
function bomb() {
  const a = [5, 7, 1, 4], k = 3, n = a.length, r = recorder(), out = Array(n).fill('?'); let i = 1, j = k, sum = 0; for (let p = i; p <= j; p++) sum += a[p];
  const cw = (i, j) => { const s = []; for (let t = i; t <= j; t++) s.push(t % n); return s; };
  r.step(ln(C_BOMB, 'int i = k > 0'), `Circle [5,7,1,4], k = 3: each value becomes the sum of the next 3. Start with the window after index 0: indices 1..3.`, [lane('code', a, { showIdx: true, active: cw(i, j) }), lane('result', out)], { sum });
  for (let t = 0; t < n; t++) { out[t] = sum; r.step(ln(C_BOMB, 'result[t] = sum'), `result[${t}] = ${sum}. Slide: −code[${i % n}], +code[${(j + 1) % n}].`, [lane('code', a, { showIdx: true, active: cw(i, j), ptr: { [t]: 'here' } }), lane('result', out, { active: [t] })], { sum }); sum -= a[i % n]; i++; j++; sum += a[j % n]; }
  r.step(0, `Answer <b>[${out}]</b>. For k < 0 the same window starts at n + k (the |k| elements before index 0).`, [lane('result', out)]);
  return r.steps;
}

const C_REC = `
for (int i = 0, j = 0; j < n; j++) {
    if (blocks.charAt(j) == 'W') w++;
    if (j - i + 1 == k) {
        ops = Math.min(ops, w);                   // whites to repaint here
        if (blocks.charAt(i++) == 'W') w--;
    }
}`;
function rec() {
  const s = 'WBBWWBBWBW', k = 7, r = recorder(); let w = 0, ops = k;
  r.step(0, `"WBBWWBBWBW", k = 7. Each window of 7 needs one repaint per white inside.`, [W('blocks', [...s], 0, -1)], { ops });
  for (let i = 0, j = 0; j < s.length; j++) {
    if (s[j] === 'W') w++;
    if (j - i + 1 === k) { ops = Math.min(ops, w); r.step(ln(C_REC, 'whites to repaint'), `[${i}..${j}] has ${w} whites.`, [W('blocks', [...s], i, j)], { w, ops }); if (s[i] === 'W') w--; i++; }
  }
  r.step(0, `Answer <b>${ops}</b>.`, [lane('blocks', [...s])], { ops });
  return r.steps;
}
