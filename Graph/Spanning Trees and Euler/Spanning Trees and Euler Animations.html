<script>
const { lane, graph, grid, tree, recorder, mount, ln } = BrainAnim;
const { range, C, EC, Q, S, A, story, adjOf } = GK;
const fm = d => (d === Infinity || d === undefined ? '∞' : d);
const NM = { 0: [0, 1], 1: [1.6, 0], 2: [1.6, 2], 3: [3.2, 1] }, EM = [[0, 1, 1], [0, 2, 3], [1, 2, 2], [1, 3, 4], [2, 3, 5]];
const mkp = n => { const p = range(0, n - 1); const f = x => (p[x] === x ? x : (p[x] = f(p[x]))); return { p, f }; };

const C_KRU = `
Arrays.sort(sorted, (a, b) -> a[2] - b[2]);                  // cheapest edges first
for (int[] e : sorted) {
    int a = find(parent, e[0]), b = find(parent, e[1]);
    if (a == b) continue;                                    // would close a cycle: skip
    ...union...
    sum += e[2];
    used++;
}
return used == V - 1 ? sum : -1;                             // fewer edges: the graph was not connected`;
function kruskal() {
  const r = recorder(), d = mkp(4), sorted = EM.slice().sort((a, b) => a[2] - b[2]); let sum = 0, used = 0; const taken = [], skipped = [];
  const V = (act) => [graph('graph (weights shown)', NM, EM, { ecls: EC({ done: taken, bad: skipped, hot: act ? [act] : [] }) }), A('MST weight so far', [sum]), A('edges used', [used])];
  r.step(ln(C_KRU, 'Arrays.sort'), 'Kruskal is greedy over <b>edges</b>: consider them from cheapest to dearest; keep an edge unless it joins two nodes that are already connected (that would make a cycle).', V(), {});
  for (const [a, b, w] of sorted) { const ra = d.f(a), rb = d.f(b); if (ra === rb) { skipped.push([a, b]); r.step(ln(C_KRU, 'if (a == b) continue'), `Edge ${a}–${b} (${w}): both ends already connected → skip.`, V([a, b]), {}); continue; } d.p[ra] = rb; sum += w; used++; taken.push([a, b]); r.step(ln(C_KRU, 'sum += e[2]'), `Edge ${a}–${b} (${w}): different components → take it. Weight ${sum}, edges ${used}/3.`, V([a, b]), {}); }
  r.step(ln(C_KRU, 'return used == V - 1'), `3 = V − 1 edges taken: MST weight <b>${sum}</b>. Why correct: the cheapest edge leaving any set of nodes is always safe to add (the cut property).`, V(), {});
  return r.steps;
}
const C_PRIM = `
PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);
pq.add(new int[]{0, 0});
while (!pq.isEmpty()) {
    int[] top = pq.poll();
    if (inTree[top[1]]) continue;
    inTree[top[1]] = true;
    sum += top[0];
    for (int[] e : adj.get(top[1])) if (!inTree[e[0]]) pq.add(new int[]{e[1], e[0]});
}`;
function prim() {
  const r = recorder(), adj = {}; range(0, 3).forEach(i => { adj[i] = []; }); EM.forEach(([a, b, w]) => { adj[a].push([b, w]); adj[b].push([a, w]); });
  const inT = Array(4).fill(false), pq = [[0, 0]], taken = []; let sum = 0; const par = {};
  const V = (act) => [graph('growing tree (green = in the tree)', NM, EM, { cls: C({ done: range(0, 3).filter(i => inT[i]), active: act !== undefined ? [act] : [] }), ecls: EC({ done: taken }) }), Q('heap of (cost, node) edges leaving the tree', pq.slice().sort((a, b) => a[0] - b[0]).map(x => `${x[0]}→${x[1]}`)), A('weight', [sum])];
  r.step(ln(C_PRIM, 'pq.add'), 'Prim grows <b>one tree</b> from node 0, always adding the cheapest edge that leaves the tree. A heap holds the candidate edges.', V(), {});
  while (pq.length) { pq.sort((a, b) => a[0] - b[0]); const [c, u] = pq.shift(); if (inT[u]) { r.step(ln(C_PRIM, 'if (inTree[top[1]]) continue'), `Candidate ${c}→${u}: ${u} is already in the tree: skip.`, V(), {}); continue; } inT[u] = true; sum += c; if (par[u] !== undefined) taken.push([par[u], u]); adj[u].forEach(([v, w]) => { if (!inT[v]) { pq.push([w, v]); if (par[v] === undefined || w < (par[v + 'w'] ?? 1e9)) { par[v] = u; par[v + 'w'] = w; } } }); r.step(ln(C_PRIM, 'sum += top[0]'), `Add node ${u} at cost ${c}. Push its edges to nodes outside the tree. Weight ${sum}.`, V(u), {}); }
  r.step(0, `All nodes in the tree: weight <b>${sum}</b>. Prim and Kruskal find trees of equal weight (the tree itself may differ if weights tie). Use Prim with an O(V²) array on dense graphs.`, V(), {});
  return r.steps;
}
const C_PTS = `
int[] best = new int[n];                      // cheapest wire from the tree to each point
Arrays.fill(best, Integer.MAX_VALUE);
best[0] = 0;
for (int round = 0; round < n; round++) {
    int u = -1;
    for (int v = 0; v < n; v++) if (!inTree[v] && (u == -1 || best[v] < best[u])) u = v;
    inTree[u] = true;
    total += best[u];
    for (int v = 0; v < n; v++) if (!inTree[v]) best[v] = Math.min(best[v], dist(points[u], points[v]));
}`;
function points() {
  const pts = [[0, 0], [2, 2], [3, 10], [5, 2], [7, 0]], n = 5, r = recorder(), best = Array(n).fill(Infinity), inT = Array(n).fill(false); best[0] = 0; let total = 0;
  const d = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
  const N = Object.fromEntries(pts.map((p, i) => [i, [p[0] / 2, (10 - p[1]) / 2.5]])), E = [];
  const V = (act) => [graph('points (edge = wire in the tree)', N, E, { cls: C({ done: range(0, n - 1).filter(i => inT[i]), active: act !== undefined ? [act] : [] }) }), A('best[] (cheapest wire to each point)', best.map(fm), { showIdx: true }), A('total', [total])];
  r.step(0, 'Every pair of points can be joined at Manhattan cost, so the graph is complete (n² edges). Prim with an array needs no edge list: keep the cheapest wire from the growing tree to every outside point.', V(), {});
  const par = Array(n).fill(0);
  for (let k = 0; k < n; k++) { let u = -1; for (let v = 0; v < n; v++) if (!inT[v] && (u === -1 || best[v] < best[u])) u = v; inT[u] = true; total += best[u]; if (k > 0) E.push([par[u], u]); for (let v = 0; v < n; v++) if (!inT[v]) { const c = d(pts[u], pts[v]); if (c < best[v]) { best[v] = c; par[v] = u; } } r.step(ln(C_PTS, 'total += best[u]'), `Pick point ${u} (cost ${best[u]}). Update the wire costs of the points still outside.`, V(u), {}); }
  r.step(0, `Total wire <b>${total}</b>. O(n²) time, O(n) memory: better than sorting n²/2 edges for Kruskal.`, V(), {});
  return r.steps;
}
const C_CRIT = `
int best = mst(n, sorted, -1, -1);                      // weight of a minimum spanning tree
for (int i = 0; i < m; i++) {
    if (mst(n, sorted, i, -1) > best) critical.add(i);          // without edge i the tree gets heavier (or breaks)
    else if (mst(n, sorted, -1, i) == best) pseudo.add(i);      // forcing edge i in still reaches the best weight
}`;
function critical() {
  const E = [[0, 1, 1], [1, 2, 1], [2, 3, 2], [0, 3, 2], [0, 4, 3], [3, 4, 3], [1, 4, 6]], N = { 0: [0, 1], 1: [1.6, 0], 2: [3.2, 0], 3: [3.2, 2], 4: [1.6, 2.4] }, r = recorder();
  const mst = (skip, force) => { const sorted = E.map((e, i) => [...e, i]).sort((a, b) => a[2] - b[2]); const d = mkp(5); let sum = 0, used = 0; if (force >= 0) { const e = E[force]; d.p[d.f(e[0])] = d.f(e[1]); sum += e[2]; used++; } for (const [a, b, w, i] of sorted) { if (i === skip || i === force) continue; if (d.f(a) !== d.f(b)) { d.p[d.f(a)] = d.f(b); sum += w; used++; } } return used === 4 ? sum : Infinity; };
  const best = mst(-1, -1), crit = [], pseudo = [];
  r.step(0, `Many edges may tie. An edge is <b>critical</b> if every minimum spanning tree contains it, <b>pseudo-critical</b> if some (but not all) do. Compute the MST weight once: ${best}. Then test each edge two ways.`, [graph('graph', N, E, {})], {});
  E.forEach(([a, b, w], i) => { const without = mst(i, -1), forced = mst(-1, i); let txt, cls; if (without > best) { crit.push(i); txt = `without edge ${i} the best tree weighs ${fm(without)} > ${best} → <b>critical</b>`; } else if (forced === best) { pseudo.push(i); txt = `removable, but forcing it in still gives ${best} → <b>pseudo-critical</b>`; } else txt = `forcing it in costs ${fm(forced)} > ${best}: never in a minimum tree`; r.step(ln(C_CRIT, 'if (mst(n, sorted, i, -1) > best)'), `Edge ${i} (${a}–${b}, ${w}): ${txt}.`, [graph('edges tested', N, E, { ecls: EC({ done: crit.map(k => [E[k][0], E[k][1]]), hot: pseudo.map(k => [E[k][0], E[k][1]]), bad: [[a, b]] .filter(() => !crit.includes(i) && !pseudo.includes(i)) }) })], {}); });
  r.step(0, `Critical: [${crit.join(', ')}] (the unique cheap edges); pseudo-critical: [${pseudo.join(', ')}] (interchangeable ties). Edge 6 (weight 6) is neither.`, [graph('answer', N, E, { ecls: EC({ done: crit.map(k => [E[k][0], E[k][1]]), hot: pseudo.map(k => [E[k][0], E[k][1]]) }) })], {});
  return r.steps;
}

const C_EUL1 = `
public boolean isEulerCircuitExist(int V, List<List<Integer>> adj) {
    for (List<Integer> out : adj) if (out.size() % 2 != 0) return false;      // every degree even
    return edgesConnected(V, adj);                                            // and all edges in one piece
}`;
function euler1() {
  const r = recorder(), cases = [
    ['triangle', { 0: [0, 0], 1: [1.6, 0], 2: [0.8, 1.4] }, [[0, 1], [1, 2], [2, 0]]],
    ['two triangles', { 0: [0, 0], 1: [1.2, 0], 2: [0.6, 1.2], 3: [3, 0], 4: [4.2, 0], 5: [3.6, 1.2] }, [[0, 1], [1, 2], [2, 0], [3, 4], [4, 5], [5, 3]]],
    ['path', { 0: [0, 0], 1: [1.5, 0], 2: [3, 0], 3: [4.5, 0] }, [[0, 1], [1, 2], [2, 3]]]];
  r.step(0, 'Euler circuit: a closed walk that uses every edge exactly once. Two conditions: every vertex has <b>even degree</b> (each visit enters and leaves), and all edges lie in <b>one connected piece</b>.', [graph('example', cases[0][1], cases[0][2], { cls: C({ done: [0, 1, 2] }) })], {});
  for (const [nm, N, E] of cases) { const deg = {}; Object.keys(N).forEach(k => { deg[k] = 0; }); E.forEach(([a, b]) => { deg[a]++; deg[b]++; }); const even = Object.values(deg).every(d => d % 2 === 0); const adj = adjOf(Object.keys(N).length, E, false), seen = new Set([0]), q = [0]; while (q.length) { const u = q.shift(); adj[u].forEach(v => { if (!seen.has(v)) { seen.add(v); q.push(v); } }); } const conn = seen.size === Object.keys(N).length;
    r.step(ln(C_EUL1, even ? 'return edgesConnected' : 'if (out.size() % 2 != 0)'), `${nm}: degrees ${Object.values(deg).join(', ')} → ${even ? 'all even' : 'odd degree present → no circuit'}${even ? `; reachable from 0: ${seen.size} of ${Object.keys(N).length} → ${conn ? 'connected → <b>circuit exists</b>' : '<b>not connected → no circuit</b> (the degree-only test of the C++ original would wrongly say yes)'}` : ''}.`, [graph(nm + ' (badge = degree)', N, E, { badge: deg, cls: C({ done: even && conn ? Object.keys(N).map(Number) : [], bad: !even || !conn ? Object.keys(N).map(Number).filter(k => !even ? deg[k] % 2 : !seen.has(k)) : [] }) })], {}); }
  return r.steps;
}
const C_EUL2 = `
if (!connected(V, adj)) return 0;
int odd = 0;
for (List<Integer> out : adj) if (out.size() % 2 != 0) odd++;
if (odd > 2) return 0;
return odd == 2 ? 1 : 2;           // 2 odd vertices: an Euler path (start and end there); 0 odd: a circuit`;
function euler2() {
  const r = recorder(), cases = [['triangle', { 0: [0, 0], 1: [1.6, 0], 2: [0.8, 1.4] }, [[0, 1], [1, 2], [2, 0]]], ['path 0-1-2-3', { 0: [0, 0], 1: [1.5, 0], 2: [3, 0], 3: [4.5, 0] }, [[0, 1], [1, 2], [2, 3]]], ['star', { 0: [1.2, 1], 1: [0, 0], 2: [0, 2], 3: [2.4, 1] }, [[0, 1], [0, 2], [0, 3]]]];
  r.step(0, 'Count the odd-degree vertices. 0 odd: an Euler <b>circuit</b>. Exactly 2 odd: an Euler <b>path</b> that must start at one odd vertex and end at the other. More than 2: neither.', [graph('graph', cases[0][1], cases[0][2], {})], {});
  for (const [nm, N, E] of cases) { const deg = {}; Object.keys(N).forEach(k => { deg[k] = 0; }); E.forEach(([a, b]) => { deg[a]++; deg[b]++; }); const odd = Object.keys(deg).filter(k => deg[k] % 2); const res = odd.length > 2 ? 0 : odd.length === 2 ? 1 : 2; r.step(ln(C_EUL2, 'return odd == 2'), `${nm}: odd-degree vertices {${odd.join(', ')}} → ${res === 2 ? 'circuit (2)' : res === 1 ? 'path only (1)' : 'neither (0)'}.`, [graph(nm + ' (badge = degree)', N, E, { badge: deg, cls: C({ active: odd.map(Number), done: odd.length ? [] : Object.keys(N).map(Number) }) })], { answer: res }); }
  return r.steps;
}
const C_HIER = `
Deque<Integer> stack = new ArrayDeque<>();
List<Integer> path = new ArrayList<>();
stack.push(start);                               // start = the node with out - in = 1 (or any node for a circuit)
while (!stack.isEmpty()) {
    int u = stack.peek();
    Deque<Integer> out = adj.get(u);
    if (out != null && !out.isEmpty()) stack.push(out.poll());     // walk along an unused edge
    else path.add(stack.pop());                                     // stuck: this node is final
}
Collections.reverse(path);`;
function hierholzer() {
  const pairs = [[5, 1], [4, 5], [11, 9], [9, 4]], N = { 11: [0, 1], 9: [1.6, 1], 4: [3.2, 1], 5: [4.8, 1], 1: [6.4, 1] }, adj = { 5: [1], 4: [5], 11: [9], 9: [4], 1: [] }, r = recorder(), stack = [11], path = [], used = [];
  const V = (act) => [graph('pairs as directed edges (green = used)', N, pairs, { directed: true, cls: C({ active: act !== undefined ? [act] : [], done: path.slice() }), ecls: EC({ done: used }) }), S('stack (current walk)', stack.slice()), A('nodes finished (reverse = answer)', path, { showIdx: false })];
  r.step(0, 'Each pair (a, b) is a directed edge a → b. A valid arrangement is an <b>Euler path</b>: a walk using every edge once. It starts at the node with out − in = 1 (here 11). Hierholzer: walk along unused edges; when stuck, finish the node; the finished nodes in reverse form the path.', V(), {});
  while (stack.length) { const u = stack[stack.length - 1]; if (adj[u].length) { const v = adj[u].shift(); used.push([u, v]); stack.push(v); r.step(ln(C_HIER, 'stack.push(out.poll())'), `At ${u}: follow unused edge ${u} → ${v}.`, V(u), {}); } else { path.push(stack.pop()); r.step(ln(C_HIER, 'path.add(stack.pop())'), `${u} has no unused edge: it is final. Finished so far: ${path.join(', ')}.`, V(u), {}); } }
  const rev = path.slice().reverse();
  r.step(ln(C_HIER, 'Collections.reverse'), `Reverse: <b>${rev.join(' → ')}</b>, i.e. pairs ${rev.slice(1).map((v, i) => `[${rev[i]}, ${v}]`).join(', ')}. With side loops, the stack back-tracks and splices them in.`, V(), {});
  return r.steps;
}
const C_ITIN = `
Map<String, PriorityQueue<String>> adj = ...;            // destinations of each airport, smallest first
visit("JFK", adj, route);
...
private void visit(String airport, Map<String, PriorityQueue<String>> adj, LinkedList<String> route) {
    PriorityQueue<String> out = adj.get(airport);
    while (out != null && !out.isEmpty()) visit(out.poll(), adj, route);     // spend every ticket, smallest first
    route.addFirst(airport);                                                  // then place the airport in front
}`;
function itinerary() {
  const tickets = [['JFK', 'SFO'], ['JFK', 'ATL'], ['SFO', 'ATL'], ['ATL', 'JFK'], ['ATL', 'SFO']], N = { JFK: [0, 1], ATL: [1.8, 0], SFO: [1.8, 2] }, adj = { JFK: ['ATL', 'SFO'], ATL: ['JFK', 'SFO'], SFO: ['ATL'] }, r = recorder(), route = [], used = [], path = [];
  const V = (act) => [graph('tickets (green = used)', N, tickets, { directed: true, cls: C({ active: act ? [act] : [] }), ecls: EC({ done: used }) }), S('recursion', path.slice()), A('route built from the back', route.slice(), { showIdx: false })];
  r.step(0, 'Use every ticket once, from JFK, with the lexicographically smallest result. Greedy "take the smallest ticket" can get stuck (a dead end with tickets left elsewhere). Hierholzer fixes it: spend tickets smallest-first; an airport with none left is placed at the <b>front</b> of the route as the recursion unwinds, so dead ends land at the end.', V(), {});
  (function go(a) { path.push(a); while (adj[a].length) { const b = adj[a].shift(); used.push([a, b]); r.step(ln(C_ITIN, 'visit(out.poll(), adj, route)'), `At ${a}: use the smallest unused ticket → ${b}.`, V(a), {}); go(b); } path.pop(); route.unshift(a); r.step(ln(C_ITIN, 'route.addFirst(airport)'), `${a} has no tickets left: put it at the front of the route. Route so far: ${route.join(' → ')}.`, V(a), {}); })('JFK');
  r.step(0, `Itinerary <b>${route.join(' → ')}</b>. The first dead end met (SFO's last ticket) ends the route; the detour JFK → SFO → ATL is spliced in correctly.`, V(), {});
  return r.steps;
}
