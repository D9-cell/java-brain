<script>
const { lane, graph, grid, tree, recorder, mount, ln } = BrainAnim;
const { range, C, EC, Q, S, A, story, adjOf } = GK;
const bits = a => a.map(b => (b ? 1 : 0));
const inc = (obj) => Object.fromEntries(Object.entries(obj));

const C_DIA = `
public int diameterTwoBfs(int[][] edges) {
    List<List<Integer>> adj = build(n, edges);
    int[] first = bfs(adj, 0);          // farthest node from any start
    int[] second = bfs(adj, first[0]);  // farthest from that node
    return second[1];
}`;
function diameter() {
  const N = { 0: [0, 1], 1: [1, 1], 2: [2, 0], 3: [3, 0], 4: [2, 2], 5: [3, 2] }, E = [[0, 1], [1, 2], [2, 3], [1, 4], [4, 5]], adj = adjOf(6, E, false), r = recorder();
  const run = (s, tag) => { const d = Array(6).fill(-1); d[s] = 0; let q = [s], far = s; while (q.length) { const u = q.shift(); if (d[u] > d[far]) far = u; adj[u].forEach(v => { if (d[v] < 0) { d[v] = d[u] + 1; q.push(v); } }); } return { d, far }; };
  r.step(ln(C_DIA, 'bfs(adj, 0)'), 'Claim: the farthest node from <i>any</i> start is an end of some diameter. So BFS twice.', [graph('tree', N, E, {})], {});
  const a = run(0); r.step(ln(C_DIA, 'int[] first'), `BFS from 0 (distance badges). Farthest node: <b>${a.far}</b> at distance ${a.d[a.far]}.`, [graph('BFS from 0', N, E, { cls: C({ active: [0], warn: [a.far] }), badge: Object.fromEntries(a.d.map((x, i) => [i, x])) })], {});
  const b = run(a.far); r.step(ln(C_DIA, 'int[] second'), `BFS from ${a.far}: farthest node ${b.far} at distance <b>${b.d[b.far]}</b>. That is the diameter (path ${a.far} → … → ${b.far}).`, [graph(`BFS from ${a.far}`, N, E, { cls: C({ active: [a.far], warn: [b.far] }), badge: Object.fromEntries(b.d.map((x, i) => [i, x])) })], { diameter: b.d[b.far] });
  r.step(ln(C_DIA, 'return second[1]'), 'One-pass alternative: DFS where each node combines its two tallest child heights (see the second approach in the note).', [graph('answer', N, E, { cls: C({ done: [3, 5], active: [1] }) })], {});
  return r.steps;
}

const C_MERGE = `
int d1 = diameter(edges1), d2 = diameter(edges2);
return Math.max(Math.max(d1, d2), (d1 + 1) / 2 + (d2 + 1) / 2 + 1);`;
function merge() {
  const r = recorder(), E1 = [[0, 1], [0, 2], [0, 3]], N1 = { 0: [0.7, 0.7], 1: [0, 0], 2: [0, 1.4], 3: [1.5, 0.7] }, E2 = [[0, 1]], N2 = { 0: [0, 0], 1: [1, 0] };
  r.step(0, 'Join one node of tree A to one node of tree B with a new edge. The longest path in the result either stays inside A, inside B, or crosses the new edge.', [graph('tree A (star, diameter 2)', N1, E1, {}), graph('tree B (one edge, diameter 1)', N2, E2, {})], {});
  r.step(ln(C_MERGE, 'int d1'), 'd1 = 2, d2 = 1. Crossing paths are (depth of A\'s endpoint) + 1 + (depth of B\'s endpoint). Minimise by attaching at each tree\'s <b>centre</b>, whose farthest node is ceil(d / 2) away.', [graph('A, centre 0 (radius 1)', N1, E1, { cls: C({ active: [0] }) }), graph('B, centre 0 or 1 (radius 1)', N2, E2, { cls: C({ active: [0] }) })], { d1: 2, d2: 1 });
  r.step(ln(C_MERGE, 'return Math.max'), 'Answer = max(d1, d2, ceil(d1/2) + ceil(d2/2) + 1) = max(2, 1, 1 + 1 + 1) = <b>3</b>.', [graph('merged at the centres', { a0: [0.7, 0.7], a1: [0, 0], a2: [0, 1.4], a3: [1.5, 0.7], b0: [2.8, 0.7], b1: [3.8, 0.7] }, [['a0', 'a1'], ['a0', 'a2'], ['a0', 'a3'], ['a0', 'b0'], ['b0', 'b1']], { cls: C({ done: ['a0', 'b0'] }), ecls: EC({ hot: [['a0', 'b0']] }) })], { answer: 3 });
  return r.steps;
}

const C_TGT1 = `
int bestSecond = 0;
if (k > 0) for (int j = 0; j < m; j++) bestSecond = Math.max(bestSecond, countWithin(b, j, k - 1));
for (int i = 0; i < n; i++) result[i] = countWithin(a, i, k) + bestSecond;`;
function target1() {
  const E1 = [[0, 1], [0, 2], [2, 3], [2, 4]], N1 = { 0: [1, 1], 1: [0, 0], 2: [2, 1], 3: [3, 0], 4: [3, 2] }, E2 = [[0, 1], [0, 2], [0, 3], [2, 7], [1, 4], [4, 5], [4, 6]], N2 = { 0: [1.5, 1], 1: [0.5, 2], 2: [2.5, 1], 3: [1.5, 0], 4: [0, 3], 5: [-0.5, 4], 6: [0.5, 4], 7: [3.5, 1] }, k = 2, r = recorder();
  const within = (n, E, s, dd) => { const adj = adjOf(n, E, false), d = Array(n).fill(-1); d[s] = 0; const q = [s]; let c = 0; while (q.length) { const u = q.shift(); if (d[u] > dd) continue; c++; adj[u].forEach(v => { if (d[v] < 0) { d[v] = d[u] + 1; q.push(v); } }); } return c; };
  r.step(0, 'Two trees A (5 nodes) and B (8 nodes), k = 2. For each node i of A we add one edge from i to the best node of B. A node is a target if it is within distance k of i.', [graph('tree A', N1, E1, {}), graph('tree B', N2, E2, {})], {});
  const cb = range(0, 7).map(j => within(8, E2, j, k - 1));
  r.step(ln(C_TGT1, 'bestSecond'), `Across the new edge B starts at distance 1 from i, so only nodes within k − 1 = 1 of the attached node count. Counts per B node: [${cb.join(', ')}]. Best = <b>${Math.max(...cb)}</b>, and it does not depend on i.`, [graph('tree B (badge = nodes within 1)', N2, E2, { badge: Object.fromEntries(cb.map((x, i) => [i, x])), cls: C({ active: [cb.indexOf(Math.max(...cb))] }) })], { bestSecond: Math.max(...cb) });
  const ca = range(0, 4).map(i => within(5, E1, i, k));
  r.step(ln(C_TGT1, 'result[i]'), `Within 2 of each A node: [${ca.join(', ')}]. Add ${Math.max(...cb)}: answer = [${ca.map(x => x + Math.max(...cb)).join(', ')}].`, [graph('tree A (badge = within 2)', N1, E1, { badge: Object.fromEntries(ca.map((x, i) => [i, x])) }), A('answer', ca.map(x => x + Math.max(...cb)), { done: range(0, 4) })], {});
  return r.steps;
}
const C_TGT2 = `
int[] color1 = colour(edges1), color2 = colour(edges2);
for (int c : color1) count1[c]++;
for (int c : color2) count2[c]++;
int bestSecond = Math.max(count2[0], count2[1]);
for (int i = 0; i < result.length; i++) result[i] = count1[color1[i]] + bestSecond;`;
function target2() {
  const E1 = [[0, 1], [0, 2], [2, 3], [2, 4]], N1 = { 0: [1, 1], 1: [0, 0], 2: [2, 1], 3: [3, 0], 4: [3, 2] }, E2 = [[0, 1], [0, 2], [0, 3], [2, 7], [1, 4], [4, 5], [4, 6]], N2 = { 0: [1.5, 1], 1: [0.5, 2], 2: [2.5, 1], 3: [1.5, 0], 4: [0, 3], 5: [-0.5, 4], 6: [0.5, 4], 7: [3.5, 1] }, r = recorder();
  const col = (n, E) => { const adj = adjOf(n, E, false), c = Array(n).fill(-1); c[0] = 0; const q = [0]; while (q.length) { const u = q.shift(); adj[u].forEach(v => { if (c[v] < 0) { c[v] = 1 - c[u]; q.push(v); } }); } return c; };
  const c1 = col(5, E1), c2 = col(8, E2), cnt = c => [c.filter(x => x === 0).length, c.filter(x => x === 1).length];
  r.step(0, 'Now a target is a node at <b>even</b> distance. Distance parity is exactly the two-colouring of a tree: same colour ⇒ even distance, different colour ⇒ odd.', [graph('tree A (blue = colour 0, amber = colour 1)', N1, E1, { cls: C({ active: range(0, 4).filter(i => c1[i] === 0), warn: range(0, 4).filter(i => c1[i] === 1) }) }), graph('tree B', N2, E2, { cls: C({ active: range(0, 7).filter(i => c2[i] === 0), warn: range(0, 7).filter(i => c2[i] === 1) }) })], {});
  const a = cnt(c1), b = cnt(c2);
  r.step(ln(C_TGT2, 'count2[c]++'), `Colour counts: A = ${a[0]} / ${a[1]}, B = ${b[0]} / ${b[1]}. Through the new edge, B's nodes at <i>odd</i> distance from the attached node are at even distance from i, so pick the attach point to get the bigger colour class: ${Math.max(...b)}.`, [A('A colour counts', a), A('B colour counts', b), A('best from B', [Math.max(...b)])], {});
  const res = c1.map(c => a[c] + Math.max(...b));
  r.step(ln(C_TGT2, 'result[i]'), `Answer for node i = (size of i's own colour class in A) + ${Math.max(...b)} = [${res.join(', ')}].`, [A('answer', res, { done: range(0, 4) })], {});
  return r.steps;
}

const C_PROF = `
bobWalk(adj, bob, -1, 0, bobTime);                // Bob's arrival time on his way to node 0
return alice(adj, 0, -1, 0, 0, bobTime, amount);
...
if (time < bobTime[u]) income += amount[u];
else if (time == bobTime[u]) income += amount[u] / 2;
int best = Integer.MIN_VALUE;
for (int v : adj.get(u)) if (v != parent) best = Math.max(best, alice(...));
return best == Integer.MIN_VALUE ? income : best;`;
function profit() {
  const E = [[0, 1], [1, 2], [1, 3], [3, 4]], N = { 0: [0, 1], 1: [1, 1], 2: [2, 0], 3: [2, 2], 4: [3, 2] }, amt = [-2, 4, 2, -4, 6], bobT = { 3: 0, 1: 1, 0: 2 }, r = recorder();
  const badge = Object.fromEntries(amt.map((a, i) => [i, 'gate ' + a]));
  r.step(0, 'Bob starts at node 3 and walks to 0, one edge per second. Alice starts at 0 and heads for a leaf. Gates cost (negative) or pay (positive); if both arrive together they split the price.', [graph('tree (badge = gate amount)', N, E, { badge })], {});
  r.step(ln(C_PROF, 'bobWalk'), 'Pass 1: Bob\'s arrival time at each node on his route: node 3 at t=0, node 1 at t=1, node 0 at t=2.', [graph('Bob\'s route', N, E, { cls: C({ warn: [3, 1, 0] }), badge: { 3: 't=0', 1: 't=1', 0: 't=2' }, ecls: EC({ hot: [[1, 3], [0, 1]] }) })], {});
  const paths = [[0, 1, 2], [0, 1, 3, 4]]; let best = -1e9;
  for (const p of paths) { let income = 0, log = []; p.forEach((u, t) => { const bt = bobT[u] ?? Infinity; const g = t < bt ? amt[u] : t === bt ? amt[u] / 2 : 0; income += g; log.push(`${u}@t${t}: ${g}`); }); best = Math.max(best, income);
    r.step(ln(C_PROF, 'if (time < bobTime[u])'), `Alice's path ${p.join(' → ')}: ${log.join(', ')} = <b>${income}</b>. A node Bob already passed (Bob earlier) costs nothing; same time = half.`, [graph('Alice\'s path', N, E, { cls: C({ active: p }), ecls: EC({ hot: p.slice(1).map((v, i) => [p[i], v]) }) }), A('income', [income]), A('best', [best])], { income, best }); }
  r.step(ln(C_PROF, 'return best'), `Best leaf: <b>${best}</b>. Alice's DFS carries her income along the path; she only compares totals at leaves.`, [graph('answer', N, E, { cls: C({ done: [0, 1, 3, 4] }) })], { best });
  return r.steps;
}

const C_KDIV = `
private long dfs(List<List<Integer>> adj, int u, int parent, int[] values, int k, int[] count) {
    long sum = values[u];
    for (int v : adj.get(u)) if (v != parent) sum += dfs(adj, v, u, values, k, count);
    sum %= k;
    if (sum == 0) count[0]++;      // this subtree can be cut off
    return sum;
}`;
function kdiv() {
  const par = { 0: null, 2: 0, 1: 2, 4: 2, 3: 1 }, vals = [1, 8, 1, 4, 4], k = 6, kids = { 0: [2], 2: [1, 4], 1: [3] }, r = recorder(), badge = {}; let count = 0; const done = [];
  const T = (act) => [tree(`tree rooted at 0 (values 1,8,1,4,4; k = ${k}; badge = subtree sum mod k)`, par, { badge, cls: C({ active: act !== undefined ? [act] : [], done, bad: [] }) }), A('components cut', [count])];
  r.step(0, 'Cut edges so every piece has a sum divisible by k, using as many pieces as possible. Total = 18 is divisible by 6, so the pieces are consistent. A subtree whose sum ≡ 0 can be cut off for free.', T(), {});
  (function go(u) { let s = vals[u]; (kids[u] || []).forEach(v => { s += go(v); }); s %= k; badge[u] = s; if (s === 0) { count++; done.push(u); } r.step(ln(C_KDIV, 'sum %= k'), `Node ${u}: subtree sum mod ${k} = ${s}${s === 0 ? ' → <b>cut here</b>, one more component. It returns 0 to its parent, so its sum no longer affects the part above.' : '.'}`, T(u), { count }); return s; })(0);
  r.step(0, `<b>${count}</b> components. The root always returns 0 because the total is divisible by k, so it counts as the last piece.`, T(), { count });
  return r.steps;
}

const C_APPLE = `
private int dfs(List<List<Integer>> adj, int u, int parent, List<Boolean> hasApple) {
    int time = 0;
    for (int v : adj.get(u)) {
        if (v == parent) continue;
        int child = dfs(adj, v, u, hasApple);
        if (child > 0 || hasApple.get(v)) time += child + 2;
    }
    return time;
}`;
function apples() {
  const par = { 0: null, 1: 0, 2: 0, 4: 1, 5: 1, 3: 2, 6: 2 }, apple = [false, false, true, false, true, true, false], kids = { 0: [1, 2], 1: [4, 5], 2: [3, 6] }, r = recorder(), badge = {}; const done = [];
  const T = (act) => [tree('tree (🍎 nodes have apples; badge = time spent below + the edge to the parent)', par, { badge, cls: C({ active: act !== undefined ? [act] : [], warn: [2, 4, 5], done }), wide: false }), A('hasApple', bits(apple))];
  r.step(0, 'Walk the tree from 0 and return to 0, collecting every apple (nodes 2, 4, 5). An edge to a child is walked twice (down and back) only if that subtree holds an apple.', T(), {});
  (function go(u) { let t = 0; (kids[u] || []).forEach(v => { const c = go(v); if (c > 0 || apple[v]) t += c + 2; }); badge[u] = t; done.push(u); r.step(ln(C_APPLE, 'if (child > 0 || hasApple.get(v))'), `Node ${u}: time below = ${t}${t ? ' (each useful child edge costs 2 plus whatever the child needs)' : ' (nothing to fetch here)'}.`, T(u), {}); return t; })(0);
  r.step(0, `Answer <b>${badge[0]}</b> = 2 × the number of edges that lie on a path from the root to an apple.`, T(), {});
  return r.steps;
}

const C_LPATH = `
private int chain(List<List<Integer>> children, int u, String s, int[] best) {
    int top1 = 0, top2 = 0;
    for (int v : children.get(u)) {
        int len = chain(children, v, s, best);
        if (s.charAt(v) == s.charAt(u)) continue;      // same letter: that chain cannot be joined
        if (len > top1) { top2 = top1; top1 = len; }
        else if (len > top2) top2 = len;
    }
    best[0] = Math.max(best[0], top1 + top2 + 1);
    return top1 + 1;
}`;
function lpath() {
  const labels = 'abacbe', par = { 0: null, 1: 0, 2: 0, 3: 1, 4: 1, 5: 2 }, kids = { 0: [1, 2], 1: [3, 4], 2: [5] }, r = recorder(), badge = {}; let best = 1; const done = [];
  const lab = Object.fromEntries(labels.split('').map((c, i) => [i, `${i}:${c}`]));
  const T = (act) => [tree('parent array tree (label shown as node:letter; badge = longest chain going down)', par, { labels: lab, wide: true, badge, cls: C({ active: act !== undefined ? [act] : [], done }) }), A('best path (nodes)', [best])];
  r.step(0, 'Longest path where adjacent nodes have different letters. At each node, combine its two longest child chains whose first letter differs from this node\'s letter.', T(), {});
  (function go(u) { const lens = []; (kids[u] || []).forEach(v => { const l = go(v); lens.push([v, l]); }); const ok = lens.filter(([v]) => labels[v] !== labels[u]).map(x => x[1]).sort((a, b) => b - a); const t1 = ok[0] || 0, t2 = ok[1] || 0; best = Math.max(best, t1 + t2 + 1); badge[u] = t1 + 1; done.push(u);
    r.step(ln(C_LPATH, 'best[0] = Math.max'), `Node ${u} ('${labels[u]}'): usable child chains [${ok.join(', ') || 'none'}]${lens.some(([v]) => labels[v] === labels[u]) ? ` (a child with the same letter is skipped)` : ''}. Path bending here = ${t1} + ${t2} + 1 = ${t1 + t2 + 1}. Chain up = ${t1 + 1}. Best ${best}.`, T(u), { best }); return t1 + 1; })(0);
  r.step(0, `Longest valid path: <b>${best}</b> nodes. The chain returned upward keeps only <i>one</i> side, because a path can bend only once.`, T(), { best });
  return r.steps;
}

const C_SUMD = `
private void down(List<List<Integer>> adj, int u, int parent, int[] size, int[] answer) {
    size[u] = 1;
    for (int v : adj.get(u)) {
        if (v == parent) continue;
        down(adj, v, u, size, answer);
        size[u] += size[v];
        answer[u] += answer[v] + size[v];
    }
}
private void up(List<List<Integer>> adj, int u, int parent, int[] size, int[] answer, int n) {
    for (int v : adj.get(u)) {
        if (v == parent) continue;
        answer[v] = answer[u] - size[v] + (n - size[v]);     // re-root from u to v
        up(adj, v, u, size, answer, n);
    }
}`;
function sumDist() {
  const E = [[0, 1], [0, 2], [2, 3], [2, 4], [2, 5]], N = { 0: [1, 1], 1: [0, 0], 2: [2, 1], 3: [3, 0], 4: [3, 1], 5: [3, 2] }, n = 6, kids = { 0: [1, 2], 2: [3, 4, 5] }, r = recorder(), size = Array(n).fill(0), ans = Array(n).fill(0);
  r.step(0, 'Computing a BFS from every node would be O(n²). <b>Re-rooting</b> does it in two passes: first the answer for root 0, then shift the root across each edge in O(1).', [graph('tree', N, E, {})], {});
  (function go(u) { size[u] = 1; (kids[u] || []).forEach(v => { go(v); size[u] += size[v]; ans[u] += ans[v] + size[v]; }); r.step(ln(C_SUMD, 'answer[u] += answer[v] + size[v]'), `Node ${u}: subtree size ${size[u]}, sum of distances inside its subtree ${ans[u]}.`, [graph('pass 1 (badge = size / inside-sum)', N, E, { cls: C({ active: [u] }), badge: Object.fromEntries(range(0, 5).filter(i => size[i]).map(i => [i, `${size[i]}/${ans[i]}`])) }), A('answer', ans)], {}); })(0);
  (function up(u) { (kids[u] || []).forEach(v => { ans[v] = ans[u] - size[v] + (n - size[v]); r.step(ln(C_SUMD, 'answer[v] = answer[u]'), `Move the root from ${u} to ${v}: the ${size[v]} nodes of v's subtree get 1 closer (−${size[v]}), the other ${n - size[v]} get 1 farther (+${n - size[v]}). answer[${v}] = ${ans[v]}.`, [graph('pass 2', N, E, { cls: C({ active: [v], done: [0] }), ecls: EC({ hot: [[u, v]] }) }), A('answer', ans)], {}); up(v); }); })(0);
  r.step(0, `Result: [${ans.join(', ')}]. Total work O(n).`, [A('answer', ans, { done: range(0, 5) })], {});
  return r.steps;
}

const C_LABEL = `
private int[] dfs(List<List<Integer>> adj, int u, int parent, String labels, int[] result) {
    int[] count = new int[26];
    count[labels.charAt(u) - 'a']++;
    for (int v : adj.get(u)) {
        if (v == parent) continue;
        int[] child = dfs(adj, v, u, labels, result);
        for (int c = 0; c < 26; c++) count[c] += child[c];
    }
    result[u] = count[labels.charAt(u) - 'a'];
    return count;
}`;
function subLabel() {
  const labels = 'abaedcd', par = { 0: null, 1: 0, 2: 0, 4: 1, 5: 1, 3: 2, 6: 2 }, kids = { 0: [1, 2], 1: [4, 5], 2: [3, 6] }, r = recorder(), res = Array(7).fill(null), lab = Object.fromEntries(labels.split('').map((c, i) => [i, `${i}:${c}`]));
  const T = (act, cnt) => [tree('tree (node:label; badge = answer)', par, { labels: lab, wide: true, badge: Object.fromEntries(res.map((x, i) => [i, x]).filter(([, x]) => x !== null)), cls: C({ active: act !== undefined ? [act] : [] }) }), A('letter counts of this subtree', cnt ? Object.entries(cnt).map(([k, v]) => `${k}:${v}`) : [], { showIdx: false })];
  r.step(0, 'Each DFS call returns the 26-letter count of its subtree; the answer for a node is the count of its own letter.', T(), {});
  (function go(u) { const cnt = {}; cnt[labels[u]] = 1; (kids[u] || []).forEach(v => { const c = go(v); for (const [k, x] of Object.entries(c)) cnt[k] = (cnt[k] || 0) + x; }); res[u] = cnt[labels[u]]; r.step(ln(C_LABEL, 'result[u] = count'), `Node ${u} ('${labels[u]}'): subtree has ${Object.entries(cnt).map(([k, v]) => k + '×' + v).join(', ')} → answer ${res[u]}.`, T(u, cnt), {}); return cnt; })(0);
  r.step(0, `Answers: [${res.join(', ')}]. Counting in one bottom-up pass beats walking every subtree separately.`, T(), {});
  return r.steps;
}

const C_XOR = `
int total = xor[0], best = Integer.MAX_VALUE;
for (int u = 1; u < n; u++) {
    for (int v = u + 1; v < n; v++) {

    if (d1[i] == -1 || d2[i] == -1) continue;
    int worst = Math.max(d1[i], d2[i]);
    if (worst < bestDist) { bestDist = worst; best = i; }
}`;
function closest() {
  const e = [2, 2, 3, -1], E = e.map((v, u) => [u, v]).filter(x => x[1] >= 0), N = { 0: [0, 0], 1: [0, 1.6], 2: [1.8, 0.8], 3: [3.6, 0.8] }, r = recorder();
  const dist = s => { const d = [-1, -1, -1, -1]; let u = s, t = 0; while (u !== -1 && d[u] < 0) { d[u] = t++; u = e[u]; } return d; }, d1 = dist(0), d2 = dist(1);
  r.step(0, 'Each node has at most one outgoing edge, so the "BFS" from a node is a single walk. Start nodes: 0 and 1. Find the node both can reach that minimises the larger of the two distances (ties: smaller index).', [graph('edges (0 → 2, 1 → 2, 2 → 3)', N, E, { directed: true, cls: C({ active: [0, 1] }) })], {});
  r.step(ln(C_CLOSE, 'int[] d1'), `Walk from 0: distances ${d1.map((x, i) => i + ':' + (x < 0 ? '∞' : x)).join(', ')}. Walk from 1: ${d2.map((x, i) => i + ':' + (x < 0 ? '∞' : x)).join(', ')}.`, [A('dist from node 0', d1.map(x => (x < 0 ? '∞' : x))), A('dist from node 1', d2.map(x => (x < 0 ? '∞' : x)))], {});
  let best = -1, bd = 1e9;
  for (let i = 0; i < 4; i++) { if (d1[i] < 0 || d2[i] < 0) { r.step(ln(C_CLOSE, 'continue'), `Node ${i}: not reachable from both: skip.`, [A('worst of the two', range(0, 3).map(j => (d1[j] < 0 || d2[j] < 0 ? '–' : Math.max(d1[j], d2[j]))), { active: [i] })], {}); continue; } const w = Math.max(d1[i], d2[i]); if (w < bd) { bd = w; best = i; } r.step(ln(C_CLOSE, 'if (worst < bestDist)'), `Node ${i}: max(${d1[i]}, ${d2[i]}) = ${w}. Best so far: node ${best} (${bd}).`, [A('worst of the two', range(0, 3).map(j => (d1[j] < 0 || d2[j] < 0 ? '–' : Math.max(d1[j], d2[j]))), { active: [i] })], {}); }
  r.step(0, `Meeting node: <b>${best}</b> (strict < keeps the smaller index on ties).`, [graph('answer', N, E, { directed: true, cls: C({ done: [0, 1], active: [best] }) })], {});
  return r.steps;
}

const C_MMW = `
public int minMaxWeight(int n, int[][] edges, int threshold) {
    ...reverse every edge...
    int low = 0, high = maxWeight, answer = -1;
    while (low <= high) {
        int mid = low + (high - low) / 2;
        if (reachesAll(rev, n, mid)) { answer = mid; high = mid - 1; }
        else low = mid + 1;
    }
    return answer;
}`;
function minmax() {
  const E = [[1, 0, 1], [2, 0, 2], [3, 0, 1], [4, 3, 1], [2, 1, 1]], N = { 0: [1.5, 1], 1: [0, 0], 2: [0, 2], 3: [3, 1], 4: [4.5, 1] }, r = recorder();
  r.step(0, 'Every node must still reach node 0 after we delete edges, and we want the <b>heaviest kept edge</b> to be as light as possible. Reaching 0 is the same as 0 reaching everyone in the reversed graph, so for a limit w: BFS from 0 over reversed edges of weight ≤ w.', [graph('edges (weights shown)', N, E, { directed: true })], {});
  let low = 0, high = 2, ans = -1;
  while (low <= high) {
    const mid = (low + high) >> 1, seen = new Set([0]), q = [0]; while (q.length) { const u = q.shift(); E.forEach(([a, b, w]) => { if (b === u && w <= mid && !seen.has(a)) { seen.add(a); q.push(a); } }); }
    const ok = seen.size === 5;
    r.step(ln(C_MMW, 'reachesAll(rev, n, mid)'), `limit ${mid}: reversed BFS from 0 reaches {${[...seen].sort().join(', ')}} — ${ok ? 'all 5 nodes, feasible. Try a smaller limit.' : 'not everyone, infeasible. Raise the limit.'}`, [graph(`limit = ${mid}`, N, E, { directed: true, cls: C({ done: [...seen] }), ecls: EC({ done: E.filter(([a, b, w]) => w <= mid).map(([a, b]) => [a, b]), ghost: E.filter(([a, b, w]) => w > mid).map(([a, b]) => [a, b]) }) }), A('low, high, mid', [low, high, mid])], { low, high, mid });
    if (ok) { ans = mid; high = mid - 1; } else low = mid + 1;
  }
  r.step(0, `Answer <b>${ans}</b>. (Feasibility is monotone in the limit, so binary search works. Dijkstra with "cost = heaviest edge so far" finds the same value without searching.) The <code>threshold</code> parameter is irrelevant: a BFS tree needs only one outgoing edge per node.`, [graph('answer', N, E, { directed: true, cls: C({ done: range(0, 4) }) })], { answer: ans });
  return r.steps;
}
