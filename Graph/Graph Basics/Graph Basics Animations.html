<script>
const { lane, graph, recorder, mount, ln } = BrainAnim;
const { range, C, EC, Q, S, A, story, adjOf } = GK;
const SQ = { 0: [0, 1], 1: [1, 0], 2: [1, 2], 3: [2, 1] };
const bits = a => a.map(b => (b ? 1 : 0));

const C_BFS = `
que.add(start);
visited[start] = true;                  // mark when queued
while (!que.isEmpty()) {
    int curr = que.poll();
    order.add(curr);
    for (int next : adj.get(curr)) {
        if (!visited[next]) {
            visited[next] = true;
            que.add(next);
        }
    }
}`;
function bfs() {
  const E = [[0, 1], [0, 2], [1, 2], [2, 0], [2, 3], [3, 3]], adj = adjOf(4, E, true), r = recorder();
  const vis = [true, false, false, false], q = [0], order = [];
  const G = (cls, ecls) => graph('graph (directed)', SQ, E, { directed: true, cls, ecls });
  r.step(ln(C_BFS, 'que.add(start)'), 'Start at 0: queue it and mark it visited <b>at once</b>, so nobody can queue it twice.', [G(C({ warn: [0] })), Q('queue', q), A('visited', bits(vis))], { order: '' });
  while (q.length) {
    const u = q.shift(); order.push(u);
    r.step(ln(C_BFS, 'order.add(curr)'), `Poll ${u} from the front and visit it. Order so far: ${order.join(' → ')}.`, [G(C({ active: [u], done: order.slice(0, -1), warn: q })), Q('queue', q), A('visited', bits(vis))], { order: order.join(',') });
    for (const v of adj[u]) {
      if (vis[v]) { r.step(ln(C_BFS, 'if (!visited[next])'), `${u} → ${v}: already visited, skip it.`, [G(C({ active: [u], done: order.slice(0, -1), warn: q }), EC({ bad: [[u, v]] })), Q('queue', q), A('visited', bits(vis))], { order: order.join(',') }); continue; }
      vis[v] = true; q.push(v);
      r.step(ln(C_BFS, 'que.add(next)'), `${u} → ${v}: new node. Mark it and queue it at the back.`, [G(C({ active: [u], done: order.slice(0, -1), warn: q }), EC({ hot: [[u, v]] })), Q('queue', q), A('visited', bits(vis))], { order: order.join(',') });
    }
  }
  r.step(0, `Queue empty: BFS order <b>${order.join(' → ')}</b>. Nodes come out in rings of distance 0, 1, 2…`, [G(C({ done: order })), Q('queue', []), A('visited', bits(vis))], { order: order.join(',') });
  return r.steps;
}

const C_DFSR = `
void dfs(List<List<Integer>> adj, int u, boolean[] visited, List<Integer> order) {
    visited[u] = true;
    order.add(u);
    for (int v : adj.get(u)) {
        if (!visited[v]) dfs(adj, v, visited, order);
    }
}`;
const C_DFSI = `
stack.push(start);
while (!stack.isEmpty()) {
    int curr = stack.pop();
    if (visited[curr]) continue;
    visited[curr] = true;
    order.add(curr);
    for (int i = next.size() - 1; i >= 0; i--) {
        if (!visited[next.get(i)]) stack.push(next.get(i));
    }
}`;
function dfsRec() {
  const E = [[0, 1], [0, 2], [1, 2], [2, 0], [2, 3], [3, 3]], adj = adjOf(4, E, true), r = recorder();
  const vis = [false, false, false, false], order = [], path = [];
  const G = (cls, ecls) => graph('graph (directed)', SQ, E, { directed: true, cls, ecls });
  function go(u) {
    vis[u] = true; order.push(u); path.push(u);
    r.step(ln(C_DFSR, 'order.add(u)'), `Enter ${u}: mark and record it. The call stack is [${path.join(', ')}].`, [G(C({ active: [u], done: order.filter(x => x !== u && !path.includes(x)), warn: path.slice(0, -1) })), S('call stack', path), A('visited', bits(vis))], { order: order.join(',') });
    for (const v of adj[u]) {
      if (vis[v]) { r.step(ln(C_DFSR, 'if (!visited[v])'), `${u} → ${v} is already visited: skip.`, [G(C({ active: [u], warn: path.slice(0, -1), done: order.filter(x => !path.includes(x)) }), EC({ bad: [[u, v]] })), S('call stack', path), A('visited', bits(vis))], { order: order.join(',') }); continue; }
      r.step(ln(C_DFSR, 'dfs(adj, v'), `${u} → ${v} is new: dive into it before looking at ${u}'s other neighbours.`, [G(C({ active: [u], warn: path.slice(0, -1), done: order.filter(x => !path.includes(x)) }), EC({ hot: [[u, v]] })), S('call stack', path), A('visited', bits(vis))], { order: order.join(',') });
      go(v);
    }
    path.pop();
    r.step(ln(C_DFSR, 'for (int v : adj.get(u))'), `${u} has no more new neighbours: return to ${path.length ? path[path.length - 1] : 'the caller'}.`, [G(C({ done: order.filter(x => !path.includes(x)), warn: path })), S('call stack', path), A('visited', bits(vis))], { order: order.join(',') });
  }
  go(2);
  r.step(0, `Recursive DFS from 2 visits <b>${order.join(' → ')}</b>.`, [G(C({ done: order })), A('visited', bits(vis))], { order: order.join(',') });
  return r.steps;
}
function dfsIter() {
  const E = [[0, 1], [0, 2], [1, 2], [2, 0], [2, 3], [3, 3]], adj = adjOf(4, E, true), r = recorder();
  const vis = [false, false, false, false], order = [], st = [2];
  const G = (cls, ecls) => graph('graph (directed)', SQ, E, { directed: true, cls, ecls });
  r.step(ln(C_DFSI, 'stack.push(start)'), 'Push the start node 2. The stack replaces the recursion.', [G(C({ warn: [2] })), S('stack', st), A('visited', bits(vis))], { order: '' });
  while (st.length) {
    const u = st.pop();
    if (vis[u]) { r.step(ln(C_DFSI, 'if (visited[curr]) continue'), `Pop ${u}: already visited, discard.`, [G(C({ done: order })), S('stack', st), A('visited', bits(vis))], { order: order.join(',') }); continue; }
    vis[u] = true; order.push(u);
    r.step(ln(C_DFSI, 'order.add(curr)'), `Pop ${u}, visit it.`, [G(C({ active: [u], done: order.slice(0, -1) })), S('stack', st), A('visited', bits(vis))], { order: order.join(',') });
    const push = adj[u].filter(v => !vis[v]).reverse();
    push.forEach(v => st.push(v));
    if (push.length) r.step(ln(C_DFSI, 'stack.push(next.get(i))'), `Push unvisited neighbours <b>in reverse</b> (${push.join(', ')}) so the first neighbour ends on top, exactly like recursion.`, [G(C({ active: [u], done: order.slice(0, -1), warn: push })), S('stack', st), A('visited', bits(vis))], { order: order.join(',') });
  }
  r.step(0, `Same order as the recursive version: <b>${order.join(' → ')}</b>. Pushing forward instead gives 2 → 3 → 0 → 1, a valid DFS but a different order.`, [G(C({ done: order })), A('visited', bits(vis))], { order: order.join(',') });
  return r.steps;
}

const C_PATH = `
boolean dfs(List<List<Integer>> adj, int u, int target, boolean[] visited) {
    if (u == target) return true;
    visited[u] = true;
    for (int v : adj.get(u)) {
        if (!visited[v] && dfs(adj, v, target, visited)) return true;
    }
    return false;
}`;
function pathEx() {
  const N = { 0: [0, 1], 1: [1, 0], 2: [1, 2], 3: [3, 0], 4: [4, 0], 5: [3, 2] }, E = [[0, 1], [0, 2], [3, 5], [5, 4], [4, 3]], adj = adjOf(6, E, false), r = recorder();
  const vis = Array(6).fill(false), path = [];
  const G = (cls, ecls) => graph('graph (undirected)', N, E, { cls, ecls, tag: 'looking for a path from 0 to 5' });
  r.step(0, 'Two islands: {0, 1, 2} and {3, 4, 5}. Is there a path from 0 to 5?', [G(C({ warn: [0], active: [5] }))], { source: 0, target: 5 });
  let found = false;
  (function go(u) {
    path.push(u);
    if (u === 5) { found = true; return; }
    vis[u] = true;
    r.step(ln(C_PATH, 'visited[u] = true'), `Visit ${u}. Not the target yet.`, [G(C({ active: [u], done: range(0, 5).filter(x => vis[x] && x !== u), warn: [5] })), A('visited', bits(vis))], { at: u });
    for (const v of adj[u]) if (!vis[v]) { r.step(ln(C_PATH, '!visited[v]'), `Try ${u} → ${v}.`, [G(C({ active: [u], done: range(0, 5).filter(x => vis[x] && x !== u), warn: [5] }), EC({ hot: [[u, v]] })), A('visited', bits(vis))], { at: u }); go(v); if (found) return; }
    r.step(ln(C_PATH, 'return false'), `${u} has nothing new to try: this branch returns false.`, [G(C({ bad: [u], done: range(0, 5).filter(x => vis[x] && x !== u) })), A('visited', bits(vis))], { at: u });
  })(0);
  r.step(0, 'The whole component of 0 is explored, 5 is not in it: <b>false</b>. A path exists exactly when both ends share a component.', [G(C({ done: [0, 1, 2], bad: [3, 4, 5] })), A('visited', bits(vis))], { answer: 'false' });
  return r.steps;
}
const C_PATHB = `
que.add(source);
visited[source] = true;
while (!que.isEmpty()) {
    int u = que.poll();
    if (u == destination) return true;
    for (int v : adj.get(u)) {
        if (!visited[v]) {
            visited[v] = true;
            que.add(v);
        }
    }
}
return false;`;
function pathBfs() {
  const N = { 0: [0, 1], 1: [1, 0], 2: [1, 2], 3: [2, 1] }, E = [[0, 1], [0, 2], [1, 3], [2, 3]], adj = adjOf(4, E, false), r = recorder();
  const vis = [true, false, false, false], q = [0], done = [];
  const G = (cls, ecls) => graph('graph (undirected)', N, E, { cls, ecls, tag: 'path from 0 to 3?' });
  r.step(ln(C_PATHB, 'que.add(source)'), 'Queue the source 0 and mark it.', [G(C({ warn: [0], active: [3] })), Q('queue', q), A('visited', bits(vis))], {});
  while (q.length) {
    const u = q.shift(); done.push(u);
    if (u === 3) { r.step(ln(C_PATHB, 'return true'), 'Polled 3 = destination: <b>true</b>. BFS even finds a shortest route (2 edges).', [G(C({ done: done.slice(0, -1), active: [3] })), Q('queue', q), A('visited', bits(vis))], {}); break; }
    for (const v of adj[u]) if (!vis[v]) { vis[v] = true; q.push(v); }
    r.step(ln(C_PATHB, 'int u = que.poll()'), `Poll ${u} (not the destination), queue its new neighbours.`, [G(C({ active: [u], done: done.slice(0, -1), warn: q.concat([3]) })), Q('queue', q), A('visited', bits(vis))], {});
  }
  return r.steps;
}

const { grid, tree } = BrainAnim;
// Grid lane where sets of [r,c] cells get a class
const GR = (name, m, o = {}) => { const mark = {}; for (const k of ['ghost', 'done', 'warn', 'bad', 'active']) (o[k] || []).forEach(([a, b]) => { mark[a + ',' + b] = k; }); return grid(name, m, { cls: (r, c) => mark[r + ',' + c], tag: o.tag }); };

const C_GRIDB = `
que.add(src);
seen[src[0]][src[1]] = true;
while (!que.isEmpty()) {
    int[] c = que.poll();
    if (c[0] == dst[0] && c[1] == dst[1]) return true;
    for (int[] d : DIRS) {
        int x = c[0] + d[0], y = c[1] + d[1];
        if (x >= 0 && x < n && y >= 0 && y < n && g[x][y] != 0 && !seen[x][y]) {
            seen[x][y] = true;
            que.add(new int[]{x, y});
        }
    }
}
return false;`;
function gridPath() {
  const m = [[3, 3, 1], [3, 0, 3], [2, 3, 3]], n = 3, D = [[-1, 0], [1, 0], [0, 1], [0, -1]], r = recorder();
  const seen = new Set(['0,2']), q = [[0, 2]], done = [];
  const L = (act) => [GR('grid (1 = source, 2 = destination, 0 = wall)', m, { done, warn: q, active: act ? [act] : [] }), Q('queue', q.map(c => `(${c})`))];
  r.step(ln(C_GRIDB, 'que.add(src)'), 'Queue the source (0,2) and mark it seen. Walls (0) are never entered.', L(), {});
  while (q.length) {
    const c = q.shift();
    if (c[0] === 2 && c[1] === 0) { r.step(ln(C_GRIDB, 'return true'), `Polled (${c}) = destination: <b>true</b>.`, L(c), {}); break; }
    done.push(c);
    for (const d of D) { const x = c[0] + d[0], y = c[1] + d[1]; if (x >= 0 && x < n && y >= 0 && y < n && m[x][y] !== 0 && !seen.has(x + ',' + y)) { seen.add(x + ',' + y); q.push([x, y]); } }
    r.step(ln(C_GRIDB, 'int[] c = que.poll()'), `Poll (${c}) and queue its open, unseen neighbours.`, L(c), { seen: seen.size });
  }
  return r.steps;
}
const C_GRIDD = `
boolean dfs(int[][] g, int i, int j, int[] dst, boolean[][] seen) {
    if (i < 0 || i >= n || j < 0 || j >= n || g[i][j] == 0 || seen[i][j]) return false;
    if (i == dst[0] && j == dst[1]) return true;
    seen[i][j] = true;
    for (int[] d : DIRS) if (dfs(g, i + d[0], j + d[1], dst, seen)) return true;
    return false;
}`;
function gridDfs() {
  const m = [[3, 3, 1], [3, 0, 3], [2, 3, 3]], n = 3, D = [[-1, 0], [1, 0], [0, 1], [0, -1]], r = recorder(), seen = new Set(), path = [];
  let found = false;
  const L = (act) => [GR('grid', m, { done: [...seen].map(s => s.split(',').map(Number)).filter(c => !(act && c[0] === act[0] && c[1] === act[1])), active: act ? [act] : [] }), S('call stack', path.map(c => `(${c})`))];
  (function go(i, j) {
    if (i < 0 || i >= n || j < 0 || j >= n || m[i][j] === 0 || seen.has(i + ',' + j)) return false;
    path.push([i, j]);
    if (m[i][j] === 2) { found = true; r.step(ln(C_GRIDD, 'return true'), `(${i},${j}) is the destination: true, and every caller returns true.`, L([i, j]), {}); return true; }
    seen.add(i + ',' + j);
    r.step(ln(C_GRIDD, 'seen[i][j] = true'), `Enter (${i},${j}) and mark it. It is <b>never un-marked</b>, so each cell is expanded once.`, L([i, j]), {});
    for (const d of D) if (go(i + d[0], j + d[1])) return true;
    path.pop();
    return false;
  })(0, 2);
  return r.steps;
}

const C_MOM = `
for (int i = 0; i < n; i++) {
    if (!visited[i]) {
        dfs(adj, i, visited);
        candidate = i;          // last vertex that had to start a new DFS
    }
}
visited = new boolean[n];
dfs(adj, candidate, visited);   // one check
for (boolean b : visited) if (!b) return -1;
return candidate;`;
function mother() {
  const N = { 0: [1, 0], 1: [2, 0], 2: [0, 1], 3: [3, 1], 4: [4, 0], 5: [0, 3], 6: [3, 3] }, E = [[0, 1], [0, 2], [1, 3], [4, 1], [5, 2], [5, 6], [6, 0], [6, 4]], adj = adjOf(7, E, true), r = recorder();
  let vis = Array(7).fill(false), cand = 0;
  const G = (cls, ecls, tag) => graph('graph (directed)', N, E, { directed: true, cls, ecls, tag });
  const reach = u => { const out = []; (function d(x) { if (vis[x]) return; vis[x] = true; out.push(x); adj[x].forEach(d); })(u); return out; };
  r.step(0, '7 vertices. A mother vertex reaches all the others. Run DFS from every still-unvisited vertex; the <b>last start</b> is the only possible mother.', [G(C({}))], {});
  for (let i = 0; i < 7; i++) {
    if (vis[i]) { r.step(ln(C_MOM, 'if (!visited[i])'), `${i} was already reached by an earlier DFS: no new start.`, [G(C({ done: range(0, 6).filter(x => vis[x]) })), A('visited', bits(vis))], { candidate: cand }); continue; }
    const got = reach(i); cand = i;
    r.step(ln(C_MOM, 'candidate = i'), `${i} starts a new DFS and reaches ${got.join(', ')}. Candidate = ${i}.`, [G(C({ active: [i], done: range(0, 6).filter(x => vis[x] && x !== i) })), A('visited', bits(vis))], { candidate: cand });
  }
  vis = Array(7).fill(false);
  const all = reach(cand);
  r.step(ln(C_MOM, 'dfs(adj, candidate'), `Verify: a fresh DFS from ${cand} reaches ${all.sort().join(', ')}.`, [G(C({ active: [cand], done: all.filter(x => x !== cand) }), {}, 'second pass'), A('visited', bits(vis))], { candidate: cand });
  r.step(ln(C_MOM, 'return candidate'), `All 7 reached: the mother vertex is <b>${cand}</b>. Why the candidate? Any earlier start was reached by a later DFS or could not reach the later start.`, [G(C({ done: range(0, 6).filter(x => x !== cand), active: [cand] })), A('visited', bits(vis))], { answer: cand });
  return r.steps;
}

const C_KEYS = `
void dfs(List<List<Integer>> rooms, int u, boolean[] visited) {
    visited[u] = true;
    for (int key : rooms.get(u)) if (!visited[key]) dfs(rooms, key, visited);
}
// then every room must be visited`;
function keys() {
  const rooms = [[1, 3], [3, 0, 1], [2], [0]], E = [], r = recorder();
  rooms.forEach((ks, u) => ks.forEach(k => E.push([u, k])));
  const N = { 0: [0, 1], 1: [1, 0], 2: [3, 1], 3: [1, 2] }, vis = Array(4).fill(false);
  const G = (cls, ecls) => graph('rooms (room → rooms its keys open)', N, E, { directed: true, cls, ecls });
  r.step(0, 'Room 0 is open. Each room holds keys to other rooms. Can we enter every room?', [G(C({ warn: [0] }))], {});
  (function go(u) {
    vis[u] = true;
    r.step(ln(C_KEYS, 'visited[u] = true'), `Enter room ${u}, take keys [${rooms[u].join(', ')}].`, [G(C({ active: [u], done: range(0, 3).filter(x => vis[x] && x !== u) })), A('visited', bits(vis))], {});
    for (const k of rooms[u]) if (!vis[k]) { r.step(ln(C_KEYS, 'dfs(rooms, key'), `Use key ${k} from room ${u}.`, [G(C({ active: [u], done: range(0, 3).filter(x => vis[x] && x !== u) }), EC({ hot: [[u, k]] })), A('visited', bits(vis))], {}); go(k); }
  })(0);
  r.step(0, 'DFS ends with room 2 never entered: nobody holds its key. <b>false</b>.', [G(C({ done: [0, 1, 3], bad: [2] })), A('visited', bits(vis))], { answer: 'false' });
  return r.steps;
}

const C_CC = `
int components = n;
for (int[] e : edges) {
    int a = find(parent, e[0]), b = find(parent, e[1]);
    if (a != b) {
        parent[a] = b;
        components--;
    }
}`;
function cc() {
  const E = [[0, 1], [1, 2], [3, 4]], N = { 0: [0, 0], 1: [1, 0], 2: [2, 0], 3: [0, 2], 4: [1, 2] }, parent = [0, 1, 2, 3, 4], r = recorder();
  const f = x => parent[x] === x ? x : f(parent[x]); let comps = 5; const joined = [];
  const G = (cls, ecls) => graph('graph', N, E, { cls, ecls });
  r.step(ln(C_CC, 'int components = n'), '5 nodes = 5 components to start. Each successful union removes one.', [G(C({})), A('parent', parent), ], { components: comps });
  E.forEach(([u, v], k) => {
    const a = f(u), b = f(v);
    if (a !== b) { parent[a] = b; comps--; joined.push([u, v]); }
    r.step(a !== b ? ln(C_CC, 'components--') : ln(C_CC, 'if (a != b)'), `Edge ${u}-${v}: roots ${a} and ${b} ${a !== b ? 'differ → union, one fewer component' : 'are equal: already connected'}.`, [G(C({ active: [u, v] }), EC({ done: joined })), A('parent', parent)], { components: comps });
  });
  r.step(0, `Components: <b>${comps}</b> ({0,1,2} and {3,4}).`, [G(C({ done: [0, 1, 2], warn: [3, 4] }), EC({ done: joined })), A('parent', parent)], { components: comps });
  return r.steps;
}
const C_PROV = `
for (int i = 0; i < n; i++) {
    if (!visited[i]) {
        count++;
        dfs(isConnected, i, visited);
    }
}`;
function prov() {
  const m = [[1, 1, 0], [1, 1, 0], [0, 0, 1]], vis = [false, false, false], r = recorder();
  let count = 0; const mk = () => GR('isConnected (1 = connected)', m, {});
  const L = (act, extra) => [GR('isConnected', m, { active: act ? [[act, act]] : [] }), A('visited', bits(vis)), ...(extra || [])];
  r.step(0, '3 cities. Matrix says 0 and 1 are connected, 2 stands alone.', L(), { count });
  for (let i = 0; i < 3; i++) {
    if (vis[i]) { r.step(ln(C_PROV, 'if (!visited[i])'), `City ${i} is already inside a province.`, L(i), { count }); continue; }
    count++;
    const comp = [i]; vis[i] = true; for (let j = 0; j < 3; j++) if (m[i][j] === 1 && !vis[j]) { vis[j] = true; comp.push(j); }
    r.step(ln(C_PROV, 'count++'), `City ${i} is new: province #${count}. DFS marks its members ${comp.join(', ')}.`, L(i), { count });
  }
  r.step(0, `<b>${count}</b> provinces: a province is a connected component.`, L(), { count });
  return r.steps;
}

const C_CLONE = `
Node dfs(Node node, Map<Node, Node> clones) {
    if (clones.containsKey(node)) return clones.get(node);

  (function go(u) {
    vis[u] = true;
    for (const [v, w] of adj[u]) {
      best = Math.min(best, w); seenE.push([u, v]);
      r.step(ln(C_MS, 'best[0] = Math.min'), `Road ${u}-${v} (${w}): lightest so far ${best}.`, view(u), { best });
      if (!vis[v]) go(v);
    }
  })(1);
  r.step(0, `Answer <b>${best}</b>. Walk 1 → 2 → 4 (5) then back: roads can be reused, so the lightest reachable road always counts.`, view(), { best });
  return r.steps;
}

const C_STN = `
for (int[] s : stones) union(parent, s[0], s[1] + 100001);   // stone = edge row—column
Set<Integer> roots = new HashSet<>();
for (int key : new ArrayList<>(parent.keySet())) roots.add(find(parent, key));
return stones.length - roots.size();`;
function stones() {
  const st = [[0, 0], [0, 1], [1, 0], [1, 2], [2, 1], [2, 2]], N = { R0: [0, 0], R1: [0, 1.5], R2: [0, 3], C0: [3, 0], C1: [3, 1.5], C2: [3, 3] }, r = recorder(), E = [], parent = {};
  const f = x => { parent[x] = parent[x] || x; return parent[x] === x ? x : (parent[x] = f(parent[x])); };
  r.step(0, 'Stones that share a row or a column are connected. Model it as a graph: every <b>row</b> and <b>column</b> is a node and every <b>stone is an edge</b> between its row and column.', [graph('rows R and columns C', N, [], {})], {});
  st.forEach(([x, y]) => {
    const a = 'R' + x, b = 'C' + y; E.push([a, b]); parent[f(a)] = f(b);
    const roots = new Set(Object.keys(parent).map(f));
    r.step(ln(C_STN, 'union(parent'), `Stone (${x},${y}) joins ${a} and ${b}. Components so far: ${roots.size}.`, [graph('rows R and columns C', N, E, { cls: C({ active: [a, b] }), ecls: EC({ hot: [[a, b]] }) })], { components: roots.size });
  });
  r.step(ln(C_STN, 'return stones.length'), '6 stones, 1 component: we can remove 6 − 1 = <b>5</b> stones. In every component one stone must stay.', [graph('rows R and columns C', N, E, { cls: C({ done: Object.keys(N) }) })], { answer: 5 });
  return r.steps;
}
