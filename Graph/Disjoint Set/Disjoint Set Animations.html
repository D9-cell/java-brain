<script>
const { lane, graph, grid, tree, recorder, mount, ln } = BrainAnim;
const { range, C, EC, Q, S, A, story, adjOf } = GK;
const bits = a => a.map(b => (b ? 1 : 0));
const fm = d => (d === Infinity || d === undefined ? '∞' : d);

// Forest lane from a parent array (roots have parent == self)
const forest = (name, parent, o = {}) => tree(name, Object.fromEntries(parent.map((p, i) => [o.ids ? o.ids[i] : i, p === i ? null : (o.ids ? o.ids[p] : p)])), { wide: !!o.wide, cls: o.cls || {}, badge: o.badge || {}, labels: o.labels || {} });
// Small DSU used by the animations; log records each union
const mkDsu = (n, o = {}) => { const parent = range(0, n - 1), rank = Array(n).fill(0), size = Array(n).fill(1);
  const find = x => { while (parent[x] !== x) x = parent[x]; return x; };
  const findC = x => (parent[x] === x ? x : (parent[x] = findC(parent[x])));
  const union = (a, b) => { const ra = (o.compress ? findC : find)(a), rb = (o.compress ? findC : find)(b); if (ra === rb) return false; if (o.rank) { if (rank[ra] < rank[rb]) parent[ra] = rb; else if (rank[ra] > rank[rb]) parent[rb] = ra; else { parent[rb] = ra; rank[ra]++; } } else if (o.size) { let x = ra, y = rb; if (size[x] < size[y]) { const t = x; x = y; y = t; } parent[y] = x; size[x] += size[y]; } else parent[ra] = rb; return true; };
  return { parent, rank, size, find, findC, union }; };

const C_DSU = `
// plain: parent[find(a)] = find(b)
// rank + compression:
int find(int x) { return parent[x] == x ? x : (parent[x] = find(parent[x])); }
boolean union(int a, int b) {
    int ra = find(a), rb = find(b);
    if (ra == rb) return false;
    if (rank[ra] < rank[rb]) parent[ra] = rb;
    else if (rank[ra] > rank[rb]) parent[rb] = ra;
    else { parent[rb] = ra; rank[ra]++; }
    return true;
}`;
function dsuVariant(kind) {
  const n = 5, ops = [[0, 1], [1, 2], [2, 3], [3, 4]], r = recorder(), d = mkDsu(n, kind === 'plain' ? {} : kind === 'rank' ? { rank: true, compress: true } : { size: true, compress: true });
  const V = (act) => [forest(`forest (${kind})`, d.parent, { cls: C({ active: act !== undefined ? [act] : [] }), badge: kind === 'size' ? Object.fromEntries(range(0, n - 1).filter(i => d.parent[i] === i).map(i => [i, 'size ' + d.size[i]])) : kind === 'rank' ? Object.fromEntries(range(0, n - 1).filter(i => d.parent[i] === i).map(i => [i, 'rank ' + d.rank[i]])) : {} }), A('parent[]', d.parent)];
  r.step(ln(C_DSU, 'boolean union'), kind === 'plain' ? 'Plain union: hang the root of a under the root of b. Union a chain 0-1-2-3-4 and the tree becomes a long path.' : kind === 'rank' ? 'Union by rank: hang the shorter tree under the taller one, and compress paths in find. Together they make operations almost O(1) (inverse Ackermann).' : 'Union by size: hang the smaller set under the bigger one; the root also stores how many elements its set has.', V(), {});
  for (const [a, b] of ops) { d.union(a, b); r.step(ln(C_DSU, 'if (rank[ra] < rank[rb])'), `union(${a}, ${b}): roots ${a === 0 ? 0 : 'of ' + a} and ${b}'s root differ → merge.`, V(b), {}); }
  r.step(ln(C_DSU, 'int find(int x)'), kind === 'plain' ? 'find(0) must climb the whole chain: 4 steps. n unions can make every find O(n).' : 'Trees stay shallow: find(0) climbs at most a couple of steps, and compression flattens whatever it walks over.', V(0), {});
  return r.steps;
}
const dsuPlain = () => dsuVariant('plain'), dsuRank = () => dsuVariant('rank'), dsuSize = () => dsuVariant('size');

const C_RED = `
for (int[] e : edges) {
    int a = find(parent, e[0]), b = find(parent, e[1]);
    if (a == b) return e;               // both ends already connected: this edge closes the cycle
    parent[a] = b;
}`;
function redundant() {
  const edges = [[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]], r = recorder(), d = mkDsu(6, { compress: true }); const used = [];
  const N = { 1: [0, 0], 2: [1.6, 0], 3: [1.6, 1.6], 4: [0, 1.6], 5: [-1.6, 0] };
  const V = (ecls, cls) => [graph('edges so far', N, edges, { ecls, cls }), forest('union-find forest (0 unused)', d.parent, {})];
  r.step(ln(C_RED, 'for (int[] e : edges)'), 'A tree on n nodes has n − 1 edges; one extra edge makes a cycle. Add edges in order; the first whose ends are already connected is the redundant one.', V({}, C({})), {});
  for (const e of edges) { const a = d.findC(e[0]), b = d.findC(e[1]); if (a === b) { r.step(ln(C_RED, 'if (a == b)'), `Edge ${e.join('–')}: both ends already in the same set ${a}. It closes a cycle: <b>${e.join(', ')}</b> is the answer.`, V(EC({ bad: [e], done: used }), C({ bad: e })), {}); break; } d.union(e[0], e[1]); used.push(e); r.step(ln(C_RED, 'parent[a] = b'), `Edge ${e.join('–')}: different sets → merge.`, V(EC({ done: used }), C({ active: e })), {}); }
  return r.steps;
}

const C_ELP = `
Arrays.sort(edges, (a, b) -> a[2] - b[2]);
Arrays.sort(order, (a, b) -> queries[a][2] - queries[b][2]);        // queries sorted by limit
for (int qi : order) {
    while (next < edges.length && edges[next][2] < queries[qi][2]) {  // add every edge shorter than this limit
        parent[find(parent, edges[next][0])] = find(parent, edges[next][1]);
        next++;
    }
    answer[qi] = find(parent, queries[qi][0]) == find(parent, queries[qi][1]);
}`;
function limited() {
  const E = [[0, 1, 2], [1, 2, 4], [2, 0, 8], [1, 0, 16]], qs = [[0, 1, 2], [0, 2, 5]], N = { 0: [0, 1], 1: [1.6, 0], 2: [1.6, 2] }, r = recorder(), d = mkDsu(3, { compress: true }); let next = 0; const used = [];
  const sorted = E.slice().sort((a, b) => a[2] - b[2]);
  const V = () => [graph('edges (weight = length)', N, E.map(e => [e[0], e[1], e[2]]), { ecls: EC({ done: used }) }), forest('union-find', d.parent, {})];
  r.step(ln(C_ELP, 'Arrays.sort(edges'), 'Query (p, q, limit): is there a path using only edges strictly shorter than limit? Answer queries <b>offline</b>: sort queries by limit and edges by length, and add edges to the Union-Find as the limit grows.', V(), {});
  for (const [p, q, lim] of qs) { while (next < sorted.length && sorted[next][2] < lim) { d.union(sorted[next][0], sorted[next][1]); used.push([sorted[next][0], sorted[next][1]]); r.step(ln(C_ELP, 'parent[find'), `Limit ${lim}: edge ${sorted[next][0]}–${sorted[next][1]} (${sorted[next][2]}) is shorter: union.`, V(), {}); next++; } const ok = d.findC(p) === d.findC(q); r.step(ln(C_ELP, 'answer[qi]'), `Query (${p}, ${q}, limit ${lim}): ${ok ? 'same set → <b>true</b>' : 'different sets → <b>false</b>'}.`, V(), {}); }
  r.step(0, 'Answers [false, true]. Each edge is added once and each query is answered in near-O(1): O((E + Q) log) overall for the sorts.', V(), {});
  return r.steps;
}

const C_COMP = `
for (int[] e : edges) parent[find(parent, e[0])] = find(parent, e[1]);
for (int i = 0; i < n; i++) nodes[find(parent, i)]++;
for (int[] e : edges) edgeCount[find(parent, e[0])]++;
for (int i = 0; i < n; i++) if (find(parent, i) == i && edgeCount[i] == nodes[i] * (nodes[i] - 1) / 2) count++;`;
function complete() {
  const E = [[0, 1], [0, 2], [1, 2], [3, 4]], N = { 0: [0, 0], 1: [1.5, 0], 2: [0.7, 1.4], 3: [3.2, 0], 4: [4.5, 0], 5: [3.8, 1.4] }, r = recorder(), d = mkDsu(6, { compress: true });
  E.forEach(e => d.union(e[0], e[1]));
  r.step(0, 'A component with k nodes is <b>complete</b> iff it has k(k − 1)/2 edges (every pair joined). Union all edges, then compare per root.', [graph('graph', N, E, {})], {});
  let cnt = 0;
  [[[0, 1, 2], 3], [[3, 4], 1], [[5], 0]].forEach(([nodes, edges]) => { const k = nodes.length, need = k * (k - 1) / 2; const ok = edges === need; if (ok) cnt++; r.step(ln(C_COMP, 'edgeCount[i] =='), `Component {${nodes.join(',')}}: k = ${k}, needs ${need} edges, has ${edges} → ${ok ? '<b>complete</b>' : 'not complete'}.`, [graph('graph', N, E, { cls: C({ done: ok ? nodes : [], bad: ok ? [] : nodes }) }), A('complete so far', [cnt])], {}); });
  r.step(0, `<b>${cnt}</b> complete components. A single node counts (0 = 0 edges).`, [A('answer', [cnt])], {});
  return r.steps;
}

const C_GCD = `
for (int i = 0; i < n; i++) {
    int v = nums[i];
    while (v > 1) {
        int p = smallest[v];
        parent[find(parent, i)] = find(parent, n + p);      // link index i with its prime p
        while (v % p == 0) v /= p;
    }
}`;
function gcdTraversal() {
  const nums = [2, 3, 6], n = 3, r = recorder(), E = []; const d = mkDsu(3 + 4, { compress: true });
  const ids = ['i0', 'i1', 'i2', 'p0', 'p1', 'p2', 'p3'], N = { i0: [0, 0], i1: [0, 1.4], i2: [0, 2.8], p2: [2.2, 0.4], p3: [2.2, 2.2] };
  const V = (act) => [graph('indices (left) and primes (right); edge = "has this factor"', N, E, { cls: C({ active: act || [] }) }), A('numbers', nums, { showIdx: true })];
  r.step(0, 'Indices i and j can be joined iff gcd > 1, i.e. they share a prime. So link every index with <b>each of its prime factors</b>; two numbers sharing a prime end up in one set. Then all indices must be in one set.', V(), {});
  nums.forEach((v, i) => { const ps = [2, 3].filter(p => v % p === 0); ps.forEach(p => { E.push([`i${i}`, `p${p}`]); d.union(i, n + p); }); r.step(ln(C_GCD, 'parent[find(parent, i)]'), `nums[${i}] = ${v}: primes ${ps.join(', ')}. Link i${i} with ${ps.map(p => 'p' + p).join(' and ')}.`, V([`i${i}`]), {}); });
  r.step(0, 'Indices 0 (2), 1 (3) and 2 (6): 6 links the primes 2 and 3 together, so everything is one component: <b>true</b>. For [3, 9, 5] the prime 5 stays alone: false. A 1 can never connect: false.', V(['i0', 'i1', 'i2']), {});
  return r.steps;
}
const C_LCS = `
for (int v : nums) {
    for (int f = 2; (long) f * f <= v; f++) {
        if (v % f == 0) {
            parent[find(parent, v)] = find(parent, f);
            parent[find(parent, v)] = find(parent, v / f);
        }
    }
}`;
function largestComp() {
  const nums = [4, 6, 15, 35], r = recorder(), E = [], N = { 4: [0, 0], 6: [0, 1.4], 15: [0, 2.8], 35: [0, 4.2], 2: [2.2, 0.5], 3: [2.2, 1.9], 5: [2.2, 3.3], 7: [2.2, 4.7] };
  const V = (act) => [graph('numbers (left) linked to their factors (right)', N, E, { cls: C({ active: act || [] }) })];
  r.step(0, 'Union each number with its factors > 1 (not all pairs!). Numbers sharing any factor then share a root: 4 – 2 – 6 – 3 – 15 – 5 – 35 – 7 is one chain.', V(), {});
  const fac = { 4: [2], 6: [2, 3], 15: [3, 5], 35: [5, 7] };
  nums.forEach(v => { fac[v].forEach(f => E.push([v, f])); r.step(ln(C_LCS, 'parent[find(parent, v)]'), `${v}: factors ${fac[v].join(', ')} → union ${v} with each.`, V([v]), {}); });
  r.step(0, 'All four numbers are in one component: size <b>4</b>. Counting numbers per root afterwards (a HashMap) gives the largest component.', V([4, 6, 15, 35]), {});
  return r.steps;
}
const C_STAB = `
int low = 1, high = 2 * maxStrength, answer = -1;
while (low <= high) {
    int mid = low + (high - low) / 2;
    if (feasible(n, edges, k, mid)) { answer = mid; low = mid + 1; }
    else high = mid - 1;
}
// feasible: must edges need strength >= s; optional >= s are free; 2 * strength >= s costs one upgrade`;
function stability() {
  const E = [[0, 1, 4], [1, 2, 3], [0, 2, 1]], N = { 0: [0, 1], 1: [1.6, 0], 2: [1.6, 2] }, k = 2, r = recorder();
  r.step(0, 'Choose a spanning tree and up to k = 2 optional edges to double; stability = weakest edge in the tree. "Can we reach stability ≥ s?" is monotone in s, so binary search s; a Union-Find tests feasibility.', [graph('edges (all optional)', N, E, {})], {});
  let low = 1, high = 8, ans = -1;
  while (low <= high) { const mid = (low + high) >> 1; const d = mkDsu(3, { compress: true }); const up = []; E.forEach(([a, b, s]) => { if (s >= mid) d.union(a, b); else if (2 * s >= mid) up.push([a, b, s]); }); let kk = k, used = 0; up.forEach(([a, b]) => { if (d.findC(a) !== d.findC(b) && kk > 0) { d.union(a, b); kk--; used++; } }); const ok = d.findC(0) === d.findC(1) && d.findC(1) === d.findC(2);
    r.step(ln(C_STAB, 'if (feasible'), `s = ${mid}: edges ≥ ${mid} are free (${E.filter(e => e[2] >= mid).map(e => e[0] + '–' + e[1]).join(', ') || 'none'}); upgradable (2·w ≥ ${mid}): ${up.map(u => u[0] + '–' + u[1]).join(', ') || 'none'}; upgrades used ${used}/${k}. ${ok ? 'Everything connected: <b>feasible</b>' : 'Not connected: <b>infeasible</b>'}.`, [graph(`testing s = ${mid}`, N, E, { ecls: EC({ done: E.filter(e => e[2] >= mid).map(e => [e[0], e[1]]), hot: up.map(u => [u[0], u[1]]) }) }), A('low, high, mid', [low, high, mid])], { low, high, mid });
    if (ok) { ans = mid; low = mid + 1; } else high = mid - 1; }
  r.step(0, `Best stability <b>${ans}</b>: upgrade the 3-edge (→ 6) and the 4-edge (→ 8); the weakest becomes 6. Must edges would need strength ≥ s with no upgrade, and two must edges forming a cycle give −1.`, [A('answer', [ans])], {});
  return r.steps;
}
const C_HAM = `
for (int[] s : allowedSwaps) parent[find(parent, s[0])] = find(parent, s[1]);
Map<Integer, Map<Integer, Integer>> pool = ...;       // per component: multiset of source values
for (int i = 0; i < n; i++) pool.computeIfAbsent(find(parent, i), k -> new HashMap<>()).merge(source[i], 1, Integer::sum);
for (int i = 0; i < n; i++) {
    Map<Integer, Integer> values = pool.get(find(parent, i));
    Integer have = values.get(target[i]);
    if (have == null || have == 0) mismatches++;
    else values.put(target[i], have - 1);
}`;
function hamming() {
  const src = [1, 2, 3, 4], tgt = [2, 1, 4, 5], r = recorder();
  r.step(0, 'Swaps may be repeated, so indices linked by allowed swaps form components inside which the values can be arranged in <i>any</i> order. Inside a component only the multiset of values matters.', [A('source', src, { showIdx: true }), A('target', tgt, { showIdx: true })], {});
  r.step(ln(C_HAM, 'for (int[] s : allowedSwaps)'), 'Swaps [0,1] and [2,3] give components {0,1} and {2,3}.', [A('component of each index', ['A', 'A', 'B', 'B'], { showIdx: true })], {});
  r.step(ln(C_HAM, 'pool.computeIfAbsent'), 'Component A holds source values {1, 2}; component B holds {3, 4}.', [A('pool A (source)', [1, 2], { showIdx: false }), A('pool B (source)', [3, 4], { showIdx: false })], {});
  r.step(ln(C_HAM, 'Integer have'), 'Match targets against the pool: A needs {2, 1} → both available (0 mismatches). B needs {4, 5} → 4 available, 5 is not in {3, 4}: <b>1 mismatch</b>.', [A('target in A', [2, 1], { done: [0, 1], showIdx: false }), A('target in B', [4, 5], { done: [0], bad: [1], showIdx: false })], { mismatches: 1 });
  return r.steps;
}
const C_WALK = `
for (int[] e : edges) {
    int a = find(parent, e[0]), b = find(parent, e[1]);
    if (a != b) { parent[b] = a; cost[a] &= cost[b]; }      // merge the AND of both components
    cost[a] &= e[2];                                       // and include this edge
}
...query: s == t -> 0; different components -> -1; else cost[root]`;
function walkCost() {
  const E = [[0, 1, 7], [1, 3, 7], [1, 2, 1]], N = { 0: [0, 1], 1: [1.6, 1], 2: [3.2, 0], 3: [3.2, 2], 4: [4.8, 1] }, r = recorder(), d = mkDsu(5, { compress: true }), cost = Array(5).fill(-1), used = [];
  const V = (act) => [graph('edges (weights); cost of a walk = AND of its edges', N, E, { cls: C({ active: act || [] }), ecls: EC({ done: used }) }), A('component AND (root → value)', range(0, 4).map(i => (d.findC(i) === i ? cost[i] : '·')), { showIdx: true })];
  r.step(0, 'AND can only <i>clear</i> bits, and a walk may reuse edges, so a walk can pick up <b>every</b> edge of its component: the cheapest cost between two nodes of a component is the AND of all the component\'s edges.', V(), {});
  E.forEach(([u, v, w]) => { const a = d.findC(u), b = d.findC(v); if (a !== b) { d.union(u, v); const root = d.findC(u); cost[root] = cost[a] & cost[b]; } cost[d.findC(u)] &= w; used.push([u, v]); r.step(ln(C_WALK, 'cost[a] &= e[2]'), `Edge ${u}–${v} (${w}): component AND becomes ${cost[d.findC(u)]}.`, V([u, v]), {}); });
  r.step(0, 'Query (0, 3): same component, AND = 7 & 7 & 1 = <b>1</b>. Query (3, 4): node 4 is isolated: <b>−1</b>. A query (s, s) is 0.', V([0, 3]), {});
  return r.steps;
}
const C_GP = `
for (Map.Entry<Integer, List<Integer>> en : byValue.entrySet()) {            // values in increasing order
    for (int u : en.getValue()) for (int v : adj.get(u)) if (vals[v] <= vals[u]) union(u, v);
    Map<Integer, Integer> perRoot = new HashMap<>();
    for (int u : en.getValue()) {
        int c = perRoot.merge(find(parent, u), 1, Integer::sum);
        count += c - 1;                                                       // new good paths ending at u
    }
}`;
function goodPaths() {
  const vals = [1, 3, 2, 1, 3], E = [[0, 1], [0, 2], [2, 3], [2, 4]], N = { 0: [1.5, 1], 1: [0, 0], 2: [3, 1], 3: [4.5, 0], 4: [4.5, 2] }, r = recorder(), d = mkDsu(5, { compress: true }), adj = adjOf(5, E, false); let count = 5; const used = [];
  const V = (act) => [graph('tree (badge = value)', N, E, { cls: C({ active: act || [] }), ecls: EC({ done: used }), badge: Object.fromEntries(vals.map((v, i) => [i, v])) }), A('good paths so far', [count])];
  r.step(0, 'A good path has equal end values and no larger value between. Every single node counts (5). Add nodes by <b>increasing value</b>; when value v is active, connect each v-node to neighbours with value ≤ v, then any two v-nodes in one component form a good path.', V(), {});
  for (const v of [1, 2, 3]) { const nodes = range(0, 4).filter(i => vals[i] === v); nodes.forEach(u => adj[u].forEach(w => { if (vals[w] <= vals[u]) { d.union(u, w); used.push([u, w]); } })); const per = {}; let add = 0; nodes.forEach(u => { const root = d.findC(u); per[root] = (per[root] || 0) + 1; add += per[root] - 1; }); count += add;
    r.step(ln(C_GP, 'count += c - 1'), `Value ${v}: nodes ${nodes.join(', ')} connect to smaller-or-equal neighbours. ${add ? add + ' new pair(s) of equal values now share a component → +' + add : 'no two of them share a component yet'}. Total ${count}.`, V(nodes), {}); }
  r.step(0, `Total good paths: <b>${count}</b> = 5 single nodes + the path 1–0–2–4 (both ends 3, nothing larger between). The two 1s (nodes 0 and 3) are separated by the 2 at node 2, so they do not count.`, V(), {});
  return r.steps;
}

const C_NET = `
if (connections.length < n - 1) return -1;           // not enough cables
for (int[] c : connections) {
    int a = find(parent, c[0]), b = find(parent, c[1]);
    if (a != b) { parent[a] = b; components--; }
}
return components - 1;                                 // each spare cable joins one more component`;
function networkConn() {
  const E = [[0, 1], [0, 2], [1, 2]], N = { 0: [0, 0], 1: [1.6, 0], 2: [0.8, 1.4], 3: [3.2, 0.7] }, r = recorder(), d = mkDsu(4, { compress: true }); let comps = 4; const used = [];
  const V = () => [graph('computers and cables (n = 4)', N, E, { ecls: EC({ done: used }) }), A('components', [comps])];
  r.step(ln(C_NET, 'if (connections.length < n - 1)'), 'To connect n computers we need at least n − 1 cables: here 3 ≥ 3, fine. Then every spare (cycle) cable can be moved to join two components.', V(), {});
  E.forEach(([a, b]) => { const ok = d.union(a, b); if (ok) { comps--; used.push([a, b]); } r.step(ln(C_NET, 'if (a != b)'), ok ? `Cable ${a}–${b} merges two components: ${comps} left.` : `Cable ${a}–${b} joins computers already connected: a <b>spare</b> cable.`, V(), {}); });
  r.step(ln(C_NET, 'return components - 1'), `${comps} components, so we need ${comps - 1} move${comps - 1 === 1 ? '' : 's'}: take the spare cable and join computer 3. Answer <b>${comps - 1}</b>.`, V(), {});
  return r.steps;
}
const C_RME = `
for (int[] e : edges) {                                 // shared edges first: they help both people
    if (e[0] != 3) continue;
    boolean a = union(alice, e[1], e[2]), b = union(bob, e[1], e[2]);
    ...
}
for (int[] e : edges) {                                 // then each person's own edges
