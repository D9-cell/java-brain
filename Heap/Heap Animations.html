<script>
const { lane, grid, tree, recorder, mount, ln } = BrainAnim;

// Real binary heap (array, sift up / down) so the tree view shows true heap order
class Heap {
  constructor(cmp, label = x => x) { this.a = []; this.cmp = cmp; this.label = label; }
  get size() { return this.a.length; }
  peek() { return this.a[0]; }
  push(x) { const a = this.a; a.push(x); let i = a.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (this.cmp(a[i], a[p]) < 0) { [a[i], a[p]] = [a[p], a[i]]; i = p; } else break; } }
  pop() { const a = this.a, top = a[0], last = a.pop(); if (a.length) { a[0] = last; let i = 0; for (;;) { let s = i; const l = 2 * i + 1, r = l + 1; if (l < a.length && this.cmp(a[l], a[s]) < 0) s = l; if (r < a.length && this.cmp(a[r], a[s]) < 0) s = r; if (s === i) break; [a[i], a[s]] = [a[s], a[i]]; i = s; } } return top; }
  view(name, cls = {}) { const P = {}, L = {}; this.a.forEach((x, i) => { P[i] = i ? (i - 1) >> 1 : -1; L[i] = this.label(x); }); return tree(name + (this.a.length ? '' : ' (empty)'), P, { labels: L, cls: { 0: 'done', ...cls }, wide: this.a.some(x => String(this.label(x)).length > 2) }); }
  sorted() { return [...this.a].sort(this.cmp); }
}
const MIN = (a, b) => a - b, MAX = (a, b) => b - a;
function sim(intro, steps) { const r = recorder(); r.step(intro[0], intro[1], intro[2]()); for (const s of steps) { s[3] && s[3](); r.step(s[0], s[1](), s[2]()); } return r.steps; }

const C_KLA = `
public int findKthLargestHeap(int[] nums, int k) {
    PriorityQueue<Integer> pq = new PriorityQueue<>();   // min-heap
    for (int x : nums) {
        pq.offer(x);
        if (pq.size() > k) pq.poll();                     // throw away the smallest
    }
    return pq.peek();
}
// Quickselect: partition around a random pivot, recurse into one side only → O(n) average`;
function kthLargest() {
  const r = recorder(), nums = [3, 2, 1, 5, 6, 4], k = 2, h = new Heap(MIN);
  r.step(ln(C_KLA, 'min-heap'), `k = 2. Keep a <b>min-heap of the k largest</b> seen. Its top is the smallest of them = the k-th largest.`, [lane('nums', nums), h.view('min-heap')]);
  nums.forEach((x, i) => { h.push(x); let out = null; if (h.size > k) out = h.pop(); r.step(ln(C_KLA, out === null ? 'pq.offer' : 'throw away'), `offer ${x}${out !== null ? `, size > k → poll the smallest (${out})` : ''}.`, [lane('nums', nums, { active: [i] }), h.view('min-heap (size ≤ k)')]); });
  r.step(ln(C_KLA, 'return pq.peek()'), `Answer = top = <b>${h.peek()}</b>. O(n log k).`, [h.view('min-heap')]);
  return r.steps;
}

const C_STREAM = `
public int add(int val) {
    pq.offer(val);
    if (pq.size() > k) pq.poll();
    return pq.peek();
}`;
function kthStream() {
  const h = new Heap(MIN); [4, 5, 8, 2].forEach(x => { h.push(x); if (h.size > 3) h.pop(); });
  return sim([0, `k = 3, start [4,5,8,2] → keep the 3 largest {4,5,8}.`, () => [h.view('min-heap of size 3')]], [3, 5, 10, 9, 4].map(v => [ln(C_STREAM, 'return pq.peek()'), () => `add(${v}) → <b>${h.peek()}</b>.`, () => [h.view('min-heap of size 3')], () => { h.push(v); if (h.size > 3) h.pop(); }]));
}

const C_STONE = `
while (pq.size() > 1) {
    int y = pq.poll(), x = pq.poll();     // two heaviest
    if (y != x) pq.offer(y - x);
}
return pq.isEmpty() ? 0 : pq.peek();`;
function stones() {
  const h = new Heap(MAX); [2, 7, 4, 1, 8, 1].forEach(x => h.push(x));
  const steps = []; const sim2 = []; const hh = new Heap(MAX); [2, 7, 4, 1, 8, 1].forEach(x => hh.push(x));
  while (hh.size > 1) { const y = hh.pop(), x = hh.pop(); if (y !== x) hh.push(y - x); sim2.push([y, x]); }
  return sim([0, `Max-heap: always smash the <b>two heaviest</b>.`, () => [h.view('max-heap')]], sim2.map(([y, x]) => [ln(C_STONE, 'two heaviest'), () => `${y} vs ${x} → ${y === x ? 'both destroyed' : `push ${y - x}`}.`, () => [h.view('max-heap')], () => { h.pop(); h.pop(); if (y !== x) h.push(y - x); }]));
}

const C_MED = `
public void addNum(int num) {
    left.offer(num);
    right.offer(left.poll());
    if (right.size() > left.size()) left.offer(right.poll());
}`;
function median() {
  const L = new Heap(MAX), R = new Heap(MIN);
  return sim([0, `Max-heap for the small half, min-heap for the big half.`, () => [L.view('left (max-heap)'), R.view('right (min-heap)')]], [5, 15, 1, 3].map(v => [ln(C_MED, 'right.offer'), () => `add ${v} → median ${L.size > R.size ? L.peek() : (L.peek() + R.peek()) / 2}.`, () => [L.view('left (max-heap)'), R.view('right (min-heap)')], () => { L.push(v); R.push(L.pop()); if (R.size > L.size) L.push(R.pop()); }]));
}

const C_LEX = `
for (int i = 0; i < s.length(); i++) {
    char ch = s.charAt(i);
    if (ch != '*') { pos.get(ch - 'a').push(i); continue; }   // stack of indices per letter
    gone[i] = true;
    for (int c = 0; c < 26; c++)                              // smallest letter present…
        if (!pos.get(c).isEmpty()) { gone[pos.get(c).pop()] = true; break; }   // …its RIGHTMOST copy
}`;
function lexStars() {
  const s = 'aaba*', r = recorder();
  r.step(0, `Each '*' deletes the smallest letter to its left. Which copy? The <b>rightmost</b> one: deleting a later 'a' keeps the earlier 'a's in front, so the string stays smaller.`, [lane('s', [...s], { showIdx: true })]);
  r.step(ln(C_LEX, 'stack of indices'), `Stacks per letter: a → [0, 1, 3], b → [2].`, [lane('a positions (top = rightmost)', [0, 1, 3], { active: [2] }), lane('b positions', [2])]);
  r.step(ln(C_LEX, 'RIGHTMOST copy'), `'*' at 4 → smallest letter 'a' → pop its top (index 3).`, [lane('s', [...s], { showIdx: true, bad: [3, 4] })]);
  r.step(0, `Result <b>"aab"</b>. Heap version: order by (char asc, index desc).`, [lane('result', [...'aab'], { done: [0, 1, 2] })]);
  return r.steps;
}

const C_KPAIR = `
for (int i = 0; i < Math.min(a.length, k); i++) pq.offer(new int[]{i, 0});
while (res.size() < k && !pq.isEmpty()) {
    int[] p = pq.poll();
    res.add(List.of(a[p[0]], b[p[1]]));
    if (p[1] + 1 < b.length) pq.offer(new int[]{p[0], p[1] + 1});   // next in that row
}`;
function kPairs() {
  const a = [1, 7, 11], b = [2, 4, 6], h = new Heap((x, y) => a[x[0]] + b[x[1]] - (a[y[0]] + b[y[1]]), p => `${a[p[0]]}+${b[p[1]]}`), res = [];
  const G = () => grid('sum table (rows a, cols b)', a.map(x => b.map(y => x + y)), { rowLabels: a, colLabels: b, cls: (i, j) => (res.some(p => p[0] === i && p[1] === j) ? 'done' : h.a.some(p => p[0] === i && p[1] === j) ? 'active' : '') });
  [0, 1, 2].forEach(i => h.push([i, 0]));
  return sim([ln(C_KPAIR, 'pq.offer(new int[]{i, 0})'), `Each row of the sum table is sorted. Like merging sorted lists: start with column 0 of every row.`, () => [G(), h.view('min-heap')]], [0, 1, 2].map(() => [ln(C_KPAIR, 'next in that row'), () => `pop ${a[res.at(-1)[0]]}+${b[res.at(-1)[1]]}; push its right neighbour.`, () => [G(), h.view('min-heap')], () => { const p = h.pop(); res.push(p); if (p[1] + 1 < 3) h.push([p[0], p[1] + 1]); }]));
}

const C_FRAC = `
for (int i = 0; i < n - 1; i++) pq.offer(new int[]{i, n - 1});   // smallest fraction of each numerator
while (--k > 0) {
    int[] p = pq.poll();
    if (p[1] - 1 > p[0]) pq.offer(new int[]{p[0], p[1] - 1});   // next bigger with the same numerator
}`;
function frac() {
  const arr = [1, 2, 3, 5], h = new Heap((x, y) => arr[x[0]] * arr[y[1]] - arr[y[0]] * arr[x[1]], p => `${arr[p[0]]}/${arr[p[1]]}`), out = [];
  [0, 1, 2].forEach(i => h.push([i, 3]));
  return sim([ln(C_FRAC, 'smallest fraction'), `k = 3. Same "k sorted lists" trick: list i = arr[i]/arr[j] for j going down.`, () => [h.view('min-heap of fractions'), lane('popped', [...out])]], [1, 2].map(() => [ln(C_FRAC, 'next bigger'), () => `pop ${out.at(-1)}; push the next fraction of that numerator.`, () => [h.view('min-heap of fractions'), lane('popped', [...out])], () => { const p = h.pop(); out.push(`${arr[p[0]]}/${arr[p[1]]}`); if (p[1] - 1 > p[0]) h.push([p[0], p[1] - 1]); }]).concat([[ln(C_FRAC, 'while (--k'), () => `3rd smallest = top = <b>${h.label(h.peek())}</b>.`, () => [h.view('min-heap of fractions', { 0: 'done' })]]]));
}

const C_FURTH = `
for (int i = 0; i < heights.length - 1; i++) {
    int d = heights[i + 1] - heights[i];
    if (d <= 0) continue;
    bricks -= d;
    used.offer(d);                         // max-heap of climbs paid with bricks
    if (bricks < 0) {
        if (ladders == 0) return i;
        bricks += used.poll();             // swap the biggest brick-climb for a ladder
        ladders--;
    }
}`;
function furthest() {
  const H = [4, 2, 7, 6, 9, 14, 12]; let b = 5, l = 1; const h = new Heap(MAX); const r = recorder();
  r.step(0, `bricks 5, ladders 1. Pay with bricks now, but <b>remember</b> each climb. When bricks go negative, give the biggest past climb a ladder instead.`, [lane('heights', H, { showIdx: true }), h.view('climbs paid with bricks (max-heap)')], { bricks: b, ladders: l });
  for (let i = 0; i < H.length - 1; i++) {
    const d = H[i + 1] - H[i]; if (d <= 0) { r.step(ln(C_FURTH, 'continue'), `${H[i]} → ${H[i + 1]}: going down, free.`, [lane('heights', H, { showIdx: true, active: [i + 1] }), h.view('max-heap')], { bricks: b, ladders: l }); continue; }
    b -= d; h.push(d);
    if (b < 0) { if (!l) { r.step(ln(C_FURTH, 'return i'), `Climb ${d} → bricks ${b} &lt; 0 and no ladders → stop at building <b>${i}</b>.`, [lane('heights', H, { showIdx: true, done: [i], bad: [i + 1] }), h.view('max-heap')], { bricks: b, ladders: l }); return r.steps; } const big = h.pop(); b += big; l--; r.step(ln(C_FURTH, 'swap the biggest'), `Climb ${d} → bricks went negative. Put a ladder on the biggest climb (${big}) instead → bricks back to ${b}.`, [lane('heights', H, { showIdx: true, active: [i + 1] }), h.view('max-heap')], { bricks: b, ladders: l }); }
    else r.step(ln(C_FURTH, 'used.offer'), `Climb ${d} with bricks → ${b} left.`, [lane('heights', H, { showIdx: true, active: [i + 1] }), h.view('max-heap')], { bricks: b, ladders: l });
  }
  return r.steps;
}

const C_IPO = `
while (k-- > 0) {
    while (i < n && capital[idx[i]] <= w) pq.offer(profits[idx[i++]]);   // unlock affordable
    if (pq.isEmpty()) break;
    w += pq.poll();                                                    // best profit
}`;
function ipo() {
  const P = [1, 2, 3], C = [0, 1, 1]; let w = 0, i = 0; const h = new Heap(MAX);
  const V = () => [lane('projects sorted by capital (cap:profit)', C.map((c, j) => `${c}:${P[j]}`), { ghost: [...Array(i).keys()] }), h.view('unlocked profits (max-heap)')];
  return sim([0, `k = 2, w = 0. Unlock every project you can afford; do the most profitable one; repeat.`, V], [
    [ln(C_IPO, 'unlock affordable'), () => `w = 0 → unlock project (0:1).`, V, () => { while (i < 3 && C[i] <= w) h.push(P[i++]); }],
    [ln(C_IPO, 'best profit'), () => `do it → w = ${w}.`, V, () => { w += h.pop(); }],
    [ln(C_IPO, 'unlock affordable'), () => `w = 1 → unlock (1:2), (1:3).`, V, () => { while (i < 3 && C[i] <= w) h.push(P[i++]); }],
    [ln(C_IPO, 'best profit'), () => `do the best (3) → w = <b>${w}</b>.`, V, () => { w += h.pop(); }]]);
}

const C_CTA = `
while (pq.peek() > 1) {
    long mx = pq.poll(), rest = sum - mx;
    if (rest == 1) return true;
    if (rest == 0 || mx <= rest) return false;
    long prev = mx % rest;              // undo many steps at once
    if (prev == 0) return false;
    pq.offer(prev);
    sum = rest + prev;
}`;
function cta() {
  const h = new Heap(MAX); [9, 3, 5].forEach(x => h.push(x)); let sum = 17;
  return sim([0, `Target [9,3,5]. Run time <b>backwards</b>: the biggest number was written last, as the sum of all others at that time.`, () => [h.view('max-heap'), lane('sum', [sum])]], [
    [ln(C_CTA, 'long prev'), () => `9 came from 9 − (3+5) = 1 → [1,3,5].`, () => [h.view('max-heap'), lane('sum', [sum])], () => { h.pop(); h.push(1); sum = 9; }],
    [ln(C_CTA, 'long prev'), () => `5 came from 5 − (1+3) = 1 → [1,3,1].`, () => [h.view('max-heap'), lane('sum', [sum])], () => { h.pop(); h.push(1); sum = 5; }],
    [ln(C_CTA, 'long prev'), () => `3 came from 3 − 2 = 1 → all ones → <b>true</b>. Use % so [1, 1e9] does not take 1e9 steps.`, () => [h.view('max-heap'), lane('sum', [sum])], () => { h.pop(); h.push(1); sum = 3; }]]);
}

const C_SCORE = `
while (!pq.isEmpty()) {
    int[] p = pq.poll();                    // (value, index), smallest first
    if (marked[p[1]]) continue;
    score += p[0];
    marked[p[1]] = true;
    if (p[1] > 0) marked[p[1] - 1] = true;
    if (p[1] + 1 < n) marked[p[1] + 1] = true;
}`;
function score() {
  const a = [2, 1, 3, 4, 5, 2], m = Array(6).fill(false); let s = 0;
  const order = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const r = recorder(); r.step(0, `Pop (value, index) in increasing order; skip marked ones; take and mark neighbours.`, [lane('nums', a, { showIdx: true })]);
  for (const [v, i] of order) { if (m[i]) { r.step(ln(C_SCORE, 'continue'), `(${v}, ${i}) is marked → skip.`, [lane('nums', a, { showIdx: true, ghost: m.map((x, k) => (x ? k : -1)).filter(k => k >= 0), bad: [i] })], { score: s }); continue; } s += v; m[i] = true; if (i) m[i - 1] = true; if (i < 5) m[i + 1] = true; r.step(ln(C_SCORE, 'score += p[0]'), `Take ${v} at ${i}; mark ${i - 1}, ${i}, ${i + 1}.`, [lane('nums', a, { showIdx: true, ghost: m.map((x, k) => (x ? k : -1)).filter(k => k >= 0), done: [i] })], { score: s }); }
  return r.steps;
}

const C_CS = `
for (int i = 0; i < nums.length; i++) {
    while (!pq.isEmpty() && pq.peek()[1] < i - k) pq.poll();           // too far back
    int dp = nums[i] + (pq.isEmpty() ? 0 : Math.max(0, pq.peek()[0]));
    best = Math.max(best, dp);
    pq.offer(new int[]{dp, i});
}`;
function constrained() {
  const a = [10, 2, -10, 5, 20], k = 2, dp = []; const h = new Heap((x, y) => y[0] - x[0], p => `${p[0]}@${p[1]}`);
  const r = recorder(); r.step(0, `dp[i] = best sum ending at i = nums[i] + max(0, best dp in the last k indices). A max-heap gives that best; drop entries older than i − k.`, [lane('nums', a, { showIdx: true })]);
  a.forEach((v, i) => { while (h.size && h.peek()[1] < i - k) h.pop(); const d = v + (h.size ? Math.max(0, h.peek()[0]) : 0); dp.push(d); h.push([d, i]); r.step(ln(C_CS, 'int dp ='), `i=${i}: ${v} + max(0, ${h.size > 1 ? 'best in window' : '—'}) → dp = <b>${d}</b>.`, [lane('nums', a, { showIdx: true, active: [i] }), lane('dp', [...dp]), h.view('max-heap (dp@index)')]); });
  r.step(ln(C_CS, 'best = Math.max'), `Answer max(dp) = <b>${Math.max(...dp)}</b>. (A monotonic deque makes it O(n).)`, [lane('dp', dp, { done: [dp.indexOf(Math.max(...dp))] })]);
  return r.steps;
}

const C_CHOOSE = `
for (int i = 0; i < n; ) {
    int j = i;
    while (j < n && nums1[idx[j]] == nums1[idx[i]]) ans[idx[j++]] = sum;   // equal nums1 share the old sum
    for (int t = i; t < j; t++) {
        pq.offer(nums2[idx[t]]);
        sum += nums2[idx[t]];
        if (pq.size() > k) sum -= pq.poll();                              // keep the k largest
    }
    i = j;
}`;
function choose() {
  const r = recorder();
  r.step(0, `For each i: sum of the k largest nums2[j] among nums1[j] &lt; nums1[i]. Sort by nums1; as nums1 grows, the candidate pool only grows → min-heap of the k largest + running sum.`, [lane('nums1', [4, 2, 1, 5, 3]), lane('nums2', [10, 20, 30, 40, 50])]);
  r.step(ln(C_CHOOSE, 'equal nums1 share'), `Sorted by nums1: 1(30) 2(20) 3(50) 4(10) 5(40). Answer for each = sum <b>before</b> adding its own group (strictly smaller).`, [lane('sorted (nums1:nums2)', ['1:30', '2:20', '3:50', '4:10', '5:40'])]);
  r.step(ln(C_CHOOSE, 'keep the k largest'), `k = 2 → answers: 1→0, 2→30, 3→50, 4→80, 5→80 → <b>[80,30,0,80,50]</b> in original order.`, [lane('answer', [80, 30, 0, 80, 50], { done: [0, 1, 2, 3, 4] })]);
  return r.steps;
}

const C_HAPPY = `
int[] first = pq.poll();
if (n >= 2 && sb.charAt(n - 1) == first[1] && sb.charAt(n - 2) == first[1]) {
    if (pq.isEmpty()) break;
    int[] second = pq.poll();              // forced to use the runner-up
    sb.append((char) second[1]);
    if (--second[0] > 0) pq.offer(second);
    pq.offer(first);
} else {
    sb.append((char) first[1]);
    if (--first[0] > 0) pq.offer(first);
}`;
function happy() {
  let cnt = { a: 1, b: 1, c: 7 }, s = ''; const r = recorder();
  r.step(0, `a=1, b=1, c=7. Greedy: use the letter with the most left, unless it would make three in a row.`, [lane('counts', Object.entries(cnt).map(([k, v]) => `${k}:${v}`)), lane('string', [])]);
  while (true) { const order = Object.keys(cnt).filter(k => cnt[k] > 0).sort((x, y) => cnt[y] - cnt[x]); if (!order.length) break; let ch = order[0], forced = false; if (s.endsWith(ch + ch)) { if (order.length < 2) break; ch = order[1]; forced = true; } s += ch; cnt[ch]--; r.step(ln(C_HAPPY, forced ? 'forced to use' : 'sb.append((char) first[1])'), forced ? `"${order[0]}" would make three → use runner-up "${ch}".` : `use "${ch}".`, [lane('counts', Object.entries(cnt).map(([k, v]) => `${k}:${v}`)), lane('string', [...s])]); }
  r.step(ln(C_HAPPY, 'if (pq.isEmpty()) break'), `Only c left and "cc" at the end → stop. Answer <b>${s}</b>.`, [lane('string', [...s], { done: [...s].map((_, i) => i) })]);
  return r.steps;
}

const C_KOPS = `
while (k-- > 0) {
    int x = pq.poll();
    score += x;
    pq.offer((x + 2) / 3);        // ceil(x / 3)
}`;
function kops() {
  const h = new Heap(MAX); [1, 10, 3, 3, 3].forEach(x => h.push(x)); let sc = 0;
  return sim([0, `Always take the biggest; it shrinks to ceil(x/3).`, () => [h.view('max-heap'), lane('score', [sc])]], [1, 2, 3].map(() => [ln(C_KOPS, 'score += x'), () => `take → score ${sc}.`, () => [h.view('max-heap'), lane('score', [sc])], () => { const x = h.pop(); sc += x; h.push(Math.ceil(x / 3)); }]));
}

const C_MSS = `
Arrays.sort(idx, (a, b) -> nums2[b] - nums2[a]);   // nums2 descending
for (int t = 0; t < n; t++) {
    int i = idx[t];
    pq.offer(nums1[i]);
    sum += nums1[i];
    if (pq.size() > k) sum -= pq.poll();           // keep the k largest nums1
    if (pq.size() == k) best = Math.max(best, sum * nums2[i]);
}`;
function mss() {
  const n1 = [1, 3, 3, 2], n2 = [2, 1, 3, 4], k = 3, ord = [3, 2, 0, 1], h = new Heap(MIN); let sum = 0, best = 0;
  const r = recorder(); r.step(ln(C_MSS, 'nums2 descending'), `Score = (sum of chosen nums1) × (min of chosen nums2). Sort by nums2 descending: the current element's nums2 is the min of everything taken so far.`, [lane('order by nums2 ↓ (n1,n2)', ord.map(i => `(${n1[i]},${n2[i]})`))]);

    [ln(C_XS, 'freq desc, value desc'), () => `freq: 1→2, 2→2, 3→1, 4→1. Top 2 by (freq, then larger value): 2 and 1 → 2·2 + 1·2 = <b>6</b>.`, () => [lane('top x', ['2×2', '1×2'], { done: [0, 1] })]],
    [ln(C_XS, 'slide the window'), () => `Slide: drop 1, add 2 → [1,2,2,3,4,2] → 2 appears 3 times, then the tie (1,3,4) picks 4 → 6 + 4 = <b>10</b>.`, () => [lane('top x', ['2×3', '4×1'], { done: [0, 1] })]]]);
}

const C_GIFT = `
while (k-- > 0) pq.offer((int) Math.sqrt(pq.poll()));`;
function gifts() {
  const h = new Heap(MAX); [25, 64, 9, 4, 100].forEach(x => h.push(x));
  return sim([0, `k = 4. Take from the richest pile, leave floor(√pile).`, () => [h.view('max-heap')]], [1, 2, 3, 4].map(() => [ln(C_GIFT, 'Math.sqrt'), () => `remaining total ${h.a.reduce((s, x) => s + x, 0)}.`, () => [h.view('max-heap')], () => { h.push(Math.floor(Math.sqrt(h.pop()))); }]));
}
