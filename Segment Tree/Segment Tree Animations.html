const { lane, grid, tree, recorder, mount } = BrainAnim;
// Line number of the first code line containing text
const ln = (code, text, nth = 1) => { const ls = code.replace(/^\n/, '').split('\n'); for (let k = 0, seen = 0; k < ls.length; k++) if (ls[k].includes(text) && ++seen === nth) return k + 1; throw new Error('ln: ' + text); };

// Generic recursive segment tree that records what it does
class Seg {
  constructor(a, combine, identity, opt = {}) {
    this.a = [...a]; this.n = a.length; this.f = combine; this.id = identity; this.t = {}; this.rng = {}; this.P = {};
    this.leaf = opt.leaf || (v => v); this.label = opt.label || (x => x);
    const shape = (i, l, r, p) => { this.rng[i] = [l, r]; this.P[i] = p; if (l === r) return; const m = (l + r) >> 1; shape(2 * i + 1, l, m, i); shape(2 * i + 2, m + 1, r, i); };
    shape(0, 0, this.n - 1, -1);
  }
  view(name, cls = {}, extra = {}) {
    const labels = {}, badge = {};
    for (const i in this.rng) { labels[i] = i in this.t ? this.label(this.t[i]) : '?'; badge[i] = extra[i] ?? `[${this.rng[i][0]},${this.rng[i][1]}]`; }
    return tree(name, this.P, { labels, badge, cls });
  }
  buildAll(i = 0, l = 0, r = this.n - 1) { if (l === r) { this.t[i] = this.leaf(this.a[l]); return; } const m = (l + r) >> 1; this.buildAll(2 * i + 1, l, m); this.buildAll(2 * i + 2, m + 1, r); this.t[i] = this.f(this.t[2 * i + 1], this.t[2 * i + 2]); }
  buildRec(rec, lines, extraLanes = () => []) {
    const go = (i, l, r) => {
      if (l === r) { this.t[i] = this.leaf(this.a[l]); rec.step(lines.leaf, `Leaf [${l}] stores a[${l}] → <b>${this.label(this.t[i])}</b>.`, [this.view('Segment tree (badge = range)', { [i]: 'active' }), ...extraLanes(l)]); return; }
      const m = (l + r) >> 1; go(2 * i + 1, l, m); go(2 * i + 2, m + 1, r);
      this.t[i] = this.f(this.t[2 * i + 1], this.t[2 * i + 2]);
      rec.step(lines.merge, `Node [${l},${r}] = combine(left ${this.label(this.t[2 * i + 1])}, right ${this.label(this.t[2 * i + 2])}) = <b>${this.label(this.t[i])}</b>.`, [this.view('Segment tree (badge = range)', { [i]: 'done', [2 * i + 1]: 'warn', [2 * i + 2]: 'warn' }), ...extraLanes(-1)]);
    };
    go(0, 0, this.n - 1);
  }
  queryRec(rec, ql, qr, lines, extraLanes = () => []) {
    const cls = {};
    const go = (i, l, r) => {
      if (r < ql || l > qr) { cls[i] = 'ghost'; rec.step(lines.none, `[${l},${r}] lies outside [${ql},${qr}] → return the identity <b>${this.label(this.id)}</b>.`, [this.view(`query [${ql},${qr}]`, { ...cls, [i]: 'bad' }), ...extraLanes()]); return this.id; }
      if (ql <= l && r <= qr) { cls[i] = 'done'; rec.step(lines.full, `[${l},${r}] is fully inside → use the stored value <b>${this.label(this.t[i])}</b> and stop going down.`, [this.view(`query [${ql},${qr}]`, cls), ...extraLanes()]); return this.t[i]; }
      cls[i] = 'warn'; rec.step(lines.part, `[${l},${r}] partly overlaps → ask both children.`, [this.view(`query [${ql},${qr}]`, cls), ...extraLanes()]);
      const m = (l + r) >> 1; return this.f(go(2 * i + 1, l, m), go(2 * i + 2, m + 1, r));
    };
    return go(0, 0, this.n - 1);
  }
  updateRec(rec, idx, v, lines, extraLanes = () => []) {
    const path = [];
    const go = (i, l, r) => {
      path.push(i);
      if (l === r) { this.a[idx] = v; this.t[i] = this.leaf(v); rec.step(lines.leaf, `Reached leaf [${idx}] → set it to <b>${this.label(this.t[i])}</b>.`, [this.view(`update index ${idx}`, Object.fromEntries(path.map(p => [p, 'active']))), ...extraLanes()]); return; }
      const m = (l + r) >> 1; idx <= m ? go(2 * i + 1, l, m) : go(2 * i + 2, m + 1, r);
      this.t[i] = this.f(this.t[2 * i + 1], this.t[2 * i + 2]);
      rec.step(lines.merge, `Back up at [${l},${r}]: recompute = <b>${this.label(this.t[i])}</b>. Only the ${Math.ceil(Math.log2(this.n)) + 1} nodes on this path change.`, [this.view(`update index ${idx}`, { ...Object.fromEntries(path.map(p => [p, 'ghost'])), ...Object.fromEntries(path.slice(path.indexOf(i)).map(p => [p, 'active'])), [i]: 'done' }), ...extraLanes()]);
    };
    go(0, 0, this.n - 1);
  }
}

// ===== code snippets =====
const C_SUM = `
private void build(int i, int l, int r, int[] a) {
    if (l == r) { tree[i] = a[l]; return; }
    int mid = (l + r) >>> 1;
    build(2 * i + 1, l, mid, a);
    build(2 * i + 2, mid + 1, r, a);
    tree[i] = tree[2 * i + 1] + tree[2 * i + 2];
}

private void update(int i, int l, int r, int idx, int val) {
    if (l == r) { tree[i] = val; return; }
    int mid = (l + r) >>> 1;
    if (idx <= mid) update(2 * i + 1, l, mid, idx, val);
    else update(2 * i + 2, mid + 1, r, idx, val);
    tree[i] = tree[2 * i + 1] + tree[2 * i + 2];   // fix on the way up
}

private int query(int i, int l, int r, int ql, int qr) {
    if (r < ql || l > qr) return 0;                  // no overlap
    if (ql <= l && r <= qr) return tree[i];           // full overlap
    int mid = (l + r) >>> 1;                          // partial overlap
    return query(2 * i + 1, l, mid, ql, qr) + query(2 * i + 2, mid + 1, r, ql, qr);
}`;
const C_MIN = `
static void build(int[] tree, int i, int l, int r, int[] a) {
    if (l == r) { tree[i] = a[l]; return; }
    int mid = (l + r) >>> 1;
    build(tree, 2 * i + 1, l, mid, a);
    build(tree, 2 * i + 2, mid + 1, r, a);
    tree[i] = Math.min(tree[2 * i + 1], tree[2 * i + 2]);
}

static int query(int[] tree, int i, int l, int r, int ql, int qr) {
    if (r < ql || l > qr) return Integer.MAX_VALUE;   // identity for min
    if (ql <= l && r <= qr) return tree[i];
    int mid = (l + r) >>> 1;
    return Math.min(query(tree, 2 * i + 1, l, mid, ql, qr),
                    query(tree, 2 * i + 2, mid + 1, r, ql, qr));
}`;
const C_IDX = `
static int better(int[] a, int x, int y) {
    if (x == -1) return y;
    if (y == -1) return x;
    return a[x] >= a[y] ? x : y;          // leftmost on ties
}

static void build(int[] tree, int i, int l, int r, int[] a) {
    if (l == r) { tree[i] = l; return; }  // store the INDEX
    int mid = (l + r) >>> 1;
    build(tree, 2 * i + 1, l, mid, a);
    build(tree, 2 * i + 2, mid + 1, r, a);
    tree[i] = better(a, tree[2 * i + 1], tree[2 * i + 2]);
}

static int query(int[] tree, int i, int l, int r, int ql, int qr, int[] a) {
    if (r < ql || l > qr) return -1;
    if (ql <= l && r <= qr) return tree[i];
    int mid = (l + r) >>> 1;
    return better(a, query(tree, 2 * i + 1, l, mid, ql, qr, a),
                     query(tree, 2 * i + 2, mid + 1, r, ql, qr, a));
}`;
const C_LAZY = `
private void push(int i, int l, int r) {
    if (lazy[i] == 0) return;
    tree[i] += (r - l + 1) * lazy[i];     // apply to my whole range
    if (l != r) {
        lazy[2 * i + 1] += lazy[i];       // children owe it later
        lazy[2 * i + 2] += lazy[i];
    }
    lazy[i] = 0;
}

private void update(int i, int l, int r, int ql, int qr, long val) {
    push(i, l, r);
    if (r < ql || l > qr) return;
    if (ql <= l && r <= qr) {
        lazy[i] += val;
        push(i, l, r);
        return;
    }
    int mid = (l + r) >>> 1;
    update(2 * i + 1, l, mid, ql, qr, val);
    update(2 * i + 2, mid + 1, r, ql, qr, val);
    tree[i] = tree[2 * i + 1] + tree[2 * i + 2];
}`;
const C_SOQ = `
public List<Integer> querySum(int n, int[] arr, int q, int[] queries) {
    int[] tree = new int[4 * n];
    build(tree, 0, 0, n - 1, arr);
    List<Integer> res = new ArrayList<>();
    for (int k = 0; k < 2 * q; k += 2)
        res.add(query(tree, 0, 0, n - 1, queries[k] - 1, queries[k + 1] - 1));
    return res;
}
// build / query = the standard sum tree (see Range Sum Query - Mutable)`;
const C_TRIP = `
public long goodTriplets(int[] nums1, int[] nums2) {
    int n = nums1.length;
    int[] pos2 = new int[n];
    for (int i = 0; i < n; i++) pos2[nums2[i]] = i;
    tree = new int[4 * n];
    long res = 0;
    for (int i = 0; i < n; i++) {
        int p = pos2[nums1[i]];
        long leftCommon = query(0, 0, n - 1, 0, p);
        long leftNotCommon = i - leftCommon;
        long rightCommon = (n - 1 - p) - leftNotCommon;
        res += leftCommon * rightCommon;
        update(0, 0, n - 1, p);
    }
    return res;
}`;
const C_FRUIT = `
private boolean place(int i, int l, int r, int fruit) {
    if (tree[i] < fruit) return false;              // nobody here is big enough
    if (l == r) { tree[i] = -1; return true; }      // use this basket
    int mid = (l + r) >>> 1;
    boolean ok = tree[2 * i + 1] >= fruit
            ? place(2 * i + 1, l, mid, fruit)       // leftmost: prefer left
            : place(2 * i + 2, mid + 1, r, fruit);
    tree[i] = Math.max(tree[2 * i + 1], tree[2 * i + 2]);
    return ok;
}`;
const C_BUILD = `
int a = min(q0, q1), b = max(q0, q1);
if (a == b || h[b] > h[a]) { res[k] = b; continue; }
int need = Math.max(h[a], h[b]), lo = b + 1, hi = n - 1, ans = -1;
while (lo <= hi) {
    int mid = (lo + hi) >>> 1;
    if (h[query(0, 0, n - 1, b + 1, mid)] > need) { ans = mid; hi = mid - 1; }
    else lo = mid + 1;
}
res[k] = ans;`;
const C_DIST = `
for (int i = 2; i < nums.length; i++) {
    int cv = Arrays.binarySearch(sorted, nums[i]);   // compressed value
    int c1 = t1.greaterThan(cv), c2 = t2.greaterThan(cv);
    boolean toFirst = c1 != c2 ? c1 > c2 : a1.size() <= a2.size();
    if (toFirst) { a1.add(nums[i]); t1.add(cv); }
    else         { a2.add(nums[i]); t2.add(cv); }
}
// greaterThan(cv) = count(cv + 1 .. m - 1) on a frequency tree`;
const C_BLOCK = `
if (q[0] == 1) {
    int pre = obstacles.lower(x);
    Integer nxt = obstacles.higher(x);
    set(0, 0, N - 1, x, x - pre);                  // gap ending at x
    if (nxt != null) set(0, 0, N - 1, nxt, nxt - x); // next gap shrinks
    obstacles.add(x);
} else {
    int pre = obstacles.floor(x);
    int best = Math.max(max(0, 0, N - 1, 0, pre), x - pre);
    res.add(best >= q[2]);
}`;
const C_REP = `
static Node merge(Node L, Node R, int lenL, int lenR) {
    boolean join = L.rc == R.lc;
    int pre = (L.pre == lenL && join) ? L.pre + R.pre : L.pre;
    int suf = (R.suf == lenR && join) ? R.suf + L.suf : R.suf;
    int best = Math.max(L.best, R.best);
    if (join) best = Math.max(best, L.suf + R.pre);
    return new Node(pre, suf, best, L.lc, R.rc);
}
// update(pos, ch): set the leaf, re-merge up the path; answer = root.best`;
const C_X = `
private Node merge(Node L, Node R) {
    Node res = new Node(k);
    res.prod = L.prod * R.prod % k;
    for (int x = 0; x < k; x++) res.cnt[x] += L.cnt[x];              // prefixes inside L
    for (int x = 0; x < k; x++) res.cnt[L.prod * x % k] += R.cnt[x]; // all of L + prefix of R
    return res;
}
// query: update(index, value); answer = query(start, n - 1).cnt[x]`;
const C_BAL = `
for (int r = 0; r < n; r++) {
    int val = nums[r] % 2 == 0 ? 1 : -1;
    Integer prev = last.get(nums[r]);
    if (prev != null) add(0, 0, n - 1, 0, prev, -val);   // old copy stops counting
    add(0, 0, n - 1, 0, r, val);                         // new copy counts for l <= r
    int l = leftmostZero(0, 0, n - 1);
    if (l != -1 && l <= r) best = Math.max(best, r - l + 1);
    last.put(nums[r], r);
}`;
const C_ACT = `
int low = lowerBound(be, l), high = lowerBound(bs, r + 1) - 1, gain = 0;
if (low < high) {
    int first = be.get(low) - Math.max(bs.get(low), l) + 1;   // clipped
    int last = Math.min(be.get(high), r) - bs.get(high) + 1;   // clipped
    if (high - low == 1) gain = first + last;
    else gain = Math.max(Math.max(first + size[low + 1], size[high - 1] + last),
                         query(0, 0, m - 2, low + 1, high - 2));   // RMQ on pairSum
}
res.add(ones + gain);`;

// ===== simulations =====
function sumTree() {
  const r = recorder(), a = [5, 8, 6, 3, 2, 7], s = new Seg(a, (x, y) => x + y, 0), A = () => [lane('a[]', s.a, { showIdx: true })];
  r.step(0, `Prefix sums give O(1) queries but O(n) updates. A segment tree gives <b>O(log n) for both</b>: each node stores the sum of a range.`, [s.view('Segment tree (badge = range)'), ...A()]);
  s.buildRec(r, { leaf: ln(C_SUM, 'tree[i] = a[l]'), merge: ln(C_SUM, 'tree[i] = tree[2 * i + 1] + tree[2 * i + 2];') }, () => A());
  const v = s.queryRec(r, 1, 4, { none: ln(C_SUM, 'return 0;'), full: ln(C_SUM, 'return tree[i];'), part: ln(C_SUM, 'partial overlap') }, () => A());
  r.step(ln(C_SUM, 'return query('), `sumRange(1, 4) = 8 + 6 + 3 + 2 = <b>${v}</b>, using only a few nodes.`, [s.view('query [1,4]'), ...A()], { answer: v });
  s.updateRec(r, 3, 10, { leaf: ln(C_SUM, 'tree[i] = val'), merge: ln(C_SUM, 'fix on the way up') }, () => A());
  return r.steps;
}
function minTree() {
  const r = recorder(), a = [4, 1, 7, 3, 9, 2, 8], s = new Seg(a, Math.min, '∞');
  s.f = (x, y) => (x === '∞' ? y : y === '∞' ? x : Math.min(x, y));
  r.step(0, `Same skeleton, different <b>combine</b> (min) and different <b>identity</b> (+∞, so it never wins).`, [s.view('Min tree')]);
  s.buildAll(); r.step(ln(C_MIN, 'Math.min(tree'), `Built: every node = min of its range.`, [s.view('Min tree'), lane('a[]', a, { showIdx: true })]);
  const v = s.queryRec(r, 2, 5, { none: ln(C_MIN, 'MAX_VALUE'), full: ln(C_MIN, 'return tree[i]'), part: ln(C_MIN, 'int mid') }, () => [lane('a[]', a, { showIdx: true, active: [2, 3, 4, 5] })]);
  r.step(ln(C_MIN, 'return Math.min(query'), `RMQ(2, 5) = <b>${v}</b>. For range max, swap min→max and +∞→−∞.`, [s.view('Min tree'), lane('a[]', a, { showIdx: true, done: [5] })], { answer: v });
  return r.steps;
}
function idxTree() {
  const r = recorder(), a = [3, 9, 2, 9, 5, 1], better = (x, y) => (x === -1 ? y : y === -1 ? x : a[x] >= a[y] ? x : y);
  const s = new Seg(a.map((_, i) => i), better, -1, { label: i => (i === -1 ? '−' : `i${i}`) });
  s.buildAll();
  r.step(ln(C_IDX, 'store the INDEX'), `Store <b>indices</b>, not values. Comparing needs the array: a[x] ≥ a[y] keeps the left one on ties.`, [s.view('Max-index tree'), lane('a[]', a, { showIdx: true })]);
  const v = s.queryRec(r, 1, 4, { none: ln(C_IDX, 'return -1;'), full: ln(C_IDX, 'return tree[i];'), part: ln(C_IDX, 'int mid', 2) }, () => [lane('a[]', a, { showIdx: true, active: [1, 2, 3, 4] })]);
  r.step(ln(C_IDX, 'return better(a, query'), `Max of a[1..4] is 9, at indices 1 and 3. The leftmost index is <b>${v}</b>.`, [s.view('Max-index tree'), lane('a[]', a, { showIdx: true, done: [v] })], { answer: v });
  return r.steps;
}
function lazyTree() {
  const r = recorder(), n = 6, tr = {}, lz = {}, P = {}, rng = {};
  const shape = (i, l, r_, p) => { rng[i] = [l, r_]; P[i] = p; tr[i] = 0; lz[i] = 0; if (l === r_) return; const m = (l + r_) >> 1; shape(2 * i + 1, l, m, i); shape(2 * i + 2, m + 1, r_, i); };
  shape(0, 0, n - 1, -1);
  const V = (cls, title) => tree(title || 'Sum tree (badge = range | lazy)', P, { labels: Object.fromEntries(Object.keys(tr).map(i => [i, tr[i]])), badge: Object.fromEntries(Object.keys(rng).map(i => [i, `[${rng[i]}]${lz[i] ? ' +' + lz[i] : ''}`])), cls });
  r.step(0, `Adding to a whole range one leaf at a time costs O(n). <b>Lazy</b>: when a node is fully covered, update it and leave an IOU (+val) for its children.`, [V({})]);
  const push = (i, l, r_) => { if (!lz[i]) return; tr[i] += (r_ - l + 1) * lz[i]; if (l !== r_) { lz[2 * i + 1] += lz[i]; lz[2 * i + 2] += lz[i]; } lz[i] = 0; };
  const upd = (i, l, r_, ql, qr, v) => {
    push(i, l, r_);
    if (r_ < ql || l > qr) return;
    if (ql <= l && r_ <= qr) { lz[i] += v; push(i, l, r_); r.step(ln(C_LAZY, 'lazy[i] += val;'), `[${l},${r_}] is fully inside → add ${v}×${r_ - l + 1} here and write the IOU <b>+${v}</b> on its children. Stop.`, [V({ [i]: 'done', [2 * i + 1]: 'warn', [2 * i + 2]: 'warn' })]); return; }
    r.step(ln(C_LAZY, 'int mid'), `[${l},${r_}] partly overlaps → go down.`, [V({ [i]: 'active' })]);
    const m = (l + r_) >> 1; upd(2 * i + 1, l, m, ql, qr, v); upd(2 * i + 2, m + 1, r_, ql, qr, v);
    tr[i] = tr[2 * i + 1] + tr[2 * i + 2];
    r.step(ln(C_LAZY, 'tree[i] = tree[2 * i + 1] + tree[2 * i + 2];'), `Recompute [${l},${r_}] = <b>${tr[i]}</b>.`, [V({ [i]: 'done' })]);
  };
  upd(0, 0, n - 1, 0, 3, 5);
  r.step(0, `Range add +5 on [0,3] touched only a few nodes. The leaves under [0,2] still say 0 but carry +5 IOUs.`, [V({})]);
  const q = (i, l, r_, ql, qr) => { push(i, l, r_); if (r_ < ql || l > qr) return 0; if (ql <= l && r_ <= qr) return tr[i]; const m = (l + r_) >> 1; return q(2 * i + 1, l, m, ql, qr) + q(2 * i + 2, m + 1, r_, ql, qr); };
  const v = q(0, 0, n - 1, 1, 1);
  r.step(ln(C_LAZY, 'tree[i] += (r - l + 1) * lazy[i];'), `Query [1,1]: on the way down every visited node calls <b>push()</b>, so IOUs are cashed only where needed. Value = <b>${v}</b>.`, [V({ 3: 'done', 4: 'done' })], { 'a[1]': v });
  return r.steps;
}
function soq() {
  const r = recorder(), a = [1, 2, 3, 4], s = new Seg(a, (x, y) => x + y, 0);
  s.buildAll();
  r.step(ln(C_SOQ, 'build(tree'), `Build a sum tree once.`, [s.view('Sum tree'), lane('arr', a, { showIdx: true })]);
  r.step(ln(C_SOQ, 'queries[k] - 1'), `GFG gives queries as flat pairs and <b>1-based</b>: (1,4) → [0,3], (2,3) → [1,2]. Subtract 1!`, [s.view('Sum tree'), lane('queries (flat)', [1, 4, 2, 3])]);
  const v1 = s.queryRec(r, 0, 3, { none: 0, full: 0, part: 0 }), v2 = s.queryRec(r, 1, 2, { none: 0, full: 0, part: 0 });
  r.step(ln(C_SOQ, 'return res'), `Answers <b>[${v1}, ${v2}]</b>. (A prefix-sum array also works here because there are no updates.)`, [s.view('Sum tree'), lane('answer', [v1, v2], { done: [0, 1] })]);
  return r.steps;
}
function triplets() {
  const r = recorder(), A = [4, 0, 1, 3, 2], B = [4, 1, 0, 2, 3], n = 5, pos = []; B.forEach((v, i) => pos[v] = i);
  const seen = Array(n).fill(0); let res = 0;

function block() {
  const r = recorder(), obs = [0], gaps = {};

function xvalue() {
